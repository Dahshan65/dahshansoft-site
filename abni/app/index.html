<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b30c9">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أبني لغتي">
<meta name="description" content="أبني لغتي – قواعد اللغة العربية للصف الحادي عشر، المنهاج الأردني. شرح وأسئلة وامتحانات تجريبية. تطوير Dahshan Soft.">
<title>أبني لغتي – الصف الحادي عشر – الفصل الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fb; --card:#ffffff; --card2:#f7f8fd; --ink:#18203a; --muted:#6b7491; --line:#e6e9f4;
  --p1:#3b30c9; --p2:#6d3df0; --pl:#ecebff; --acc:#ffb020; --accd:#d98a00;
  --ok:#12b886; --okbg:#e6f8f1; --bad:#f0435a; --badbg:#fdecef;
  --tq:#0ea5a4; --tqbg:#e2f6f6; --tb:#8b5cf6; --tbbg:#f0eafe; --ta:#f0567a; --tabg:#fde9ef;
  --sh:0 6px 20px rgba(40,40,110,.08); --sh2:0 10px 30px rgba(59,48,201,.25);
  --r:18px;
}
body.dark{
  --bg:#0d1222; --card:#161d33; --card2:#1c2440; --ink:#e9edf8; --muted:#9aa4c4; --line:#263055;
  --pl:#262a5a; --okbg:#0f3a30; --badbg:#44182a; --tqbg:#0f3436; --tbbg:#2c2250; --tabg:#43192a;
  --sh:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s}
button,input{font-family:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.app.nonav{padding-bottom:20px}

/* ---------- الشريط العلوي ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg)}
.topbar h1{flex:1;font-size:1.1rem;font-weight:800}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;box-shadow:var(--sh)}
.iconbtn:active{transform:scale(.92)}

/* ---------- الشاشات ---------- */
.screen{display:none;padding:4px 16px 16px;animation:in .3s ease}
.screen.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- البطاقة الرئيسية ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--sh2);margin-bottom:16px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:220px;height:220px;top:-90px;left:-70px}
.hero:after{width:140px;height:140px;bottom:-60px;left:90px}
.hero .hi{font-size:.9rem;opacity:.85}
.hero .nm{font-size:1.5rem;font-weight:900;margin:2px 0 12px}
.hero .row{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.ring{--v:0;width:92px;height:92px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--acc) calc(var(--v)*1%),rgba(255,255,255,.18) 0)}
.ring i{width:74px;height:74px;border-radius:50%;background:rgba(40,30,150,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring b{font-size:1.35rem;font-weight:900;line-height:1}
.ring small{font-size:.65rem;opacity:.85}
.lvl{flex:1}
.lvl .t{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
.lvl .t b{font-weight:800}
.xpbar{height:9px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,var(--acc));border-radius:9px;transition:width .6s}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);padding:4px 11px;border-radius:30px;font-size:.78rem;font-weight:700}

/* ---------- بطاقات عامة ---------- */
.sect{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sect h2{font-size:1.02rem;font-weight:800}
.sect a{font-size:.82rem;color:var(--p1);font-weight:700;cursor:pointer}
body.dark .sect a{color:#a99cff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px 14px;cursor:pointer;position:relative;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.tile:active{transform:scale(.97)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:10px}
.tile b{display:block;font-size:.98rem;font-weight:800}
.tile span{font-size:.76rem;color:var(--muted)}
.tile .badge{position:absolute;top:12px;left:12px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.i1{background:linear-gradient(135deg,#ffe2a8,#ffc24d)} .i2{background:linear-gradient(135deg,#d6d2ff,#a99cff)}
.i3{background:linear-gradient(135deg,#ffd0d8,#ff8fa3)} .i4{background:linear-gradient(135deg,#c9f3ea,#6fdcc4)}

.daily{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;background:linear-gradient(135deg,#fff4dd,#ffe7b8);border:1px solid #ffd98a;border-radius:var(--r)}
body.dark .daily{background:linear-gradient(135deg,#3a2c10,#4a3510);border-color:#6b4c12}
.daily .ic{font-size:2rem}
.daily b{display:block;font-size:1rem;font-weight:800;color:#7a4b00}
body.dark .daily b{color:#ffd27a}
.daily span{font-size:.8rem;color:#9a6a1a}
body.dark .daily span{color:#d9b06a}
.daily .go{margin-right:auto;background:var(--acc);color:#fff;font-weight:800;padding:8px 16px;border-radius:12px;font-size:.85rem}
.daily.done{opacity:.75}

.cont{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.cont .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.cont .tx{flex:1;min-width:0}
.cont .tx small{color:var(--muted);font-size:.75rem}
.cont .tx b{display:block;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--muted);font-size:1.2rem}

/* ---------- الدروس ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;box-shadow:var(--sh);margin-bottom:12px}
.search input{flex:1;border:none;background:none;padding:13px 0;font-size:.95rem;outline:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:10px;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--p1);box-shadow:var(--sh)}
body.dark .seg button.on{color:#b9afff}
.unit{padding:14px;margin-bottom:12px}
.unit .uh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.unit .un{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.unit .ut{flex:1}
.unit .ut small{font-size:.72rem;color:var(--muted)}
.unit .ut b{display:block;font-size:.95rem;font-weight:800}
.mini{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p1));border-radius:6px}
.les{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:var(--card2);margin-top:8px;cursor:pointer;border:1px solid transparent}
.les:active{transform:scale(.98)}
.les b{flex:1;font-size:.92rem;font-weight:700}
.tag{font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:20px}
.tq{background:var(--tqbg);color:var(--tq)} .tb{background:var(--tbbg);color:var(--tb)} .ta{background:var(--tabg);color:var(--ta)}
.score{font-size:.74rem;font-weight:800;min-width:44px;text-align:center;padding:3px 6px;border-radius:9px;background:var(--line);color:var(--muted)}
.score.g{background:var(--okbg);color:var(--ok)} .score.m{background:#fff3d6;color:var(--accd)} .score.l{background:var(--badbg);color:var(--bad)}
body.dark .score.m{background:#3d2f10}

/* ---------- واجهة القراءة المحسّنة ---------- */
.reader-note{background:var(--pl);color:var(--ink);padding:14px 16px;border-radius:16px;margin-bottom:12px;font-size:.87rem;line-height:1.8;border:1px solid var(--line)}
.reader-note span{display:block;color:var(--muted);font-size:.77rem}
.sum{font-size:1.03rem;line-height:2.15;padding:20px}
.sum h3{margin-top:23px;font-size:1.04rem}
.sum p{margin:8px 0 13px}
.sum li{margin:8px 0}
.reading-passage{font-family:'Amiri',serif;font-size:1.3rem;line-height:2.25;text-align:justify}
.writing-area{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);font:inherit;line-height:2;resize:vertical}
.nav button{font-size:.65rem}
/* ---------- الدرس ---------- */
.lhead{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.lhead .tag{display:inline-block;margin-bottom:8px}
.lhead h2{font-size:1.25rem;font-weight:900;line-height:1.6}
.lhead p{color:var(--muted);font-size:.82rem}
.lhead.hb h2,.lhead.hb p{padding-left:72px}
.lhead .best{position:absolute;left:16px;top:16px;text-align:center}
.lhead .best b{display:block;font-size:1.2rem;color:var(--p1)}
body.dark .lhead .best b{color:#b9afff}
.lhead .best small{font-size:.65rem;color:var(--muted)}
.sum{padding:18px;line-height:2.05;font-size:.97rem}
.sum h3{font-size:1rem;font-weight:800;color:var(--p1);margin:16px 0 4px;display:flex;align-items:center;gap:8px}
body.dark .sum h3{color:#b9afff}
.sum h3:before{content:"";width:6px;height:18px;border-radius:4px;background:var(--acc)}
.sum h3:first-child{margin-top:0}
.sum ul{padding-right:20px}
.sum li{margin:2px 0}
.ex{font-family:'Amiri',serif;font-size:1.28rem;background:var(--card2);border-right:4px solid var(--acc);padding:8px 14px;border-radius:12px;margin:8px 0;line-height:1.9}
.ex em{color:var(--bad);font-style:normal;font-weight:700}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--sh2);margin-top:14px}
.cta:active{transform:scale(.98)}
.cta.alt{background:var(--card);color:var(--p1);border:2px solid var(--p1);box-shadow:none}
body.dark .cta.alt{color:#b9afff;border-color:#6d5ff0}
.cta.gold{background:linear-gradient(135deg,#ffc24d,#ff9500);box-shadow:0 10px 25px rgba(255,150,0,.3)}
.sticky{position:sticky;bottom:12px}

/* ---------- الأسئلة ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .cnt{font-weight:800;font-size:.9rem}
.qhead .cnt small{color:var(--muted);font-weight:600}
.timer{margin-right:auto;background:var(--pl);color:var(--p1);font-weight:900;padding:5px 12px;border-radius:12px;font-size:.9rem}
body.dark .timer{color:#c5bdff}
.timer.low{background:var(--badbg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.qbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff8a00);border-radius:8px;transition:width .4s}
.qcard{padding:20px 18px}
.qfrom{font-size:.74rem;color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:800;line-height:1.9;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card2);border:2px solid var(--line);border-radius:15px;padding:12px 12px;margin-bottom:10px;font-size:1rem;cursor:pointer;transition:all .2s}
.opt:active{transform:scale(.98)}
.opt .l{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;flex-shrink:0;color:var(--p1)}
.opt.sel{border-color:var(--p1);background:var(--pl)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:800}
.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);animation:shake .4s}
.opt.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.gone{opacity:.25;pointer-events:none;text-decoration:line-through}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tools{display:flex;gap:8px;margin-top:4px}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:12px;padding:9px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
.tool.on{color:var(--accd);border-color:var(--acc);border-style:solid;background:#fff6e0}
body.dark .tool.on{background:#3a2c10}
.tool:disabled{opacity:.4}
.why{display:none;margin-top:12px;padding:14px;border-radius:14px;font-size:.95rem;line-height:1.9}
.why.ok{display:block;background:var(--okbg)} .why.bad{display:block;background:var(--badbg)}
.why b{display:block;margin-bottom:2px}
.why.ok b{color:var(--ok)} .why.bad b{color:var(--bad)}

/* ---------- النتيجة ---------- */
.res{padding:24px 18px;text-align:center}
.bigring{--v:0;--c:var(--ok);width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0)}
.bigring i{width:122px;height:122px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.bigring b{font-size:2.2rem;font-weight:900;color:var(--c)}
.bigring small{color:var(--muted);font-size:.8rem}
.res h2{font-size:1.3rem;font-weight:900}
.res p{color:var(--muted);margin:4px 0 10px}
.gain{display:flex;justify-content:center;gap:10px;margin:12px 0}
.gain span{background:var(--card2);border:1px solid var(--line);padding:6px 14px;border-radius:12px;font-weight:800;font-size:.85rem}
.review{margin-top:14px;text-align:right}
.rv{padding:14px;margin-bottom:10px;border-right:4px solid var(--bad)}
.rv .q{font-weight:800;margin-bottom:6px;line-height:1.8}
.rv .a{color:var(--ok);font-weight:800;font-size:.92rem}
.rv .w{color:var(--muted);font-size:.86rem;line-height:1.8;margin-top:4px}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{padding:16px;text-align:center}
.st b{display:block;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
body.dark .st b{background:linear-gradient(135deg,#a99cff,#e0b3ff);-webkit-background-clip:text;background-clip:text}
.st span{font-size:.8rem;color:var(--muted)}
.bars{padding:14px}
.br{margin-bottom:12px}
.br .t{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px}
.br .t b{font-weight:700}
.br .mini{height:9px}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ac{padding:12px 6px;text-align:center;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.ac .e{font-size:1.7rem;filter:grayscale(1);opacity:.35}
.ac small{display:block;font-size:.66rem;color:var(--muted);margin-top:4px;line-height:1.4}
.ac.on{background:linear-gradient(135deg,#fff6df,#ffe9b5);border-color:#ffd98a}
body.dark .ac.on{background:linear-gradient(135deg,#3a2c10,#4a3510);border-color:#6b4c12}
.ac.on .e{filter:none;opacity:1}
.ac.on small{color:#8a5a00;font-weight:700}
body.dark .ac.on small{color:#ffd27a}

/* ---------- الإعدادات ---------- */
.set{padding:4px 16px}
.sr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border:none}
.sr .ic{width:38px;height:38px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.sr .tx{flex:1}
.sr .tx b{display:block;font-size:.95rem}
.sr .tx small{font-size:.75rem;color:var(--muted)}
.sw{width:50px;height:28px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.25s;flex-shrink:0;border:none}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.sw.on{background:linear-gradient(135deg,var(--p1),var(--p2))}
.sw.on:after{right:25px}
.fs{display:flex;gap:6px}
.fs button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:800;cursor:pointer}
.fs button.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.danger{color:var(--bad)!important}
.about{text-align:center;padding:22px 16px;margin-top:14px}
.about .lg{font-family:'Amiri',serif;font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.about p{color:var(--muted);font-size:.85rem;margin:4px 0}
.wa{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#25d366;color:#fff;text-decoration:none;padding:10px 22px;border-radius:30px;font-weight:800;font-size:.92rem;box-shadow:0 8px 20px rgba(37,211,102,.3)}

/* ---------- إعداد الامتحان ---------- */
.opts2{display:flex;gap:8px;flex-wrap:wrap}
.pick{flex:1;min-width:30%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:800;font-size:.9rem;cursor:pointer;text-align:center}
.pick small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}
.pick.on{border-color:var(--p1);background:var(--pl);color:var(--p1)}
body.dark .pick.on{color:#c5bdff}
.lbl{font-weight:800;margin:16px 2px 8px;font-size:.95rem}

/* ---------- الترحيب ---------- */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;text-align:center;
  background:linear-gradient(160deg,var(--p1),var(--p2));color:#fff}
.welcome .lg{font-family:'Amiri',serif;font-size:3.3rem;font-weight:700;line-height:1.2}
.welcome .sub{opacity:.85;margin:6px 0 30px}
.welcome .feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px;text-align:right}
.welcome .feat div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;font-size:.82rem;font-weight:700}
.welcome input{width:100%;border:none;border-radius:16px;padding:16px;font-size:1.05rem;text-align:center;color:#18203a;margin-bottom:12px;outline:none}

        "summary": "<h3>دليل الدرس: من صور المبتدأ والخبر</h3><p><b>مرجع المنهج:</b> ص 63–67. شرح تعليمي أصلي.</p><h3>1. الجملة الاسمية</h3><p>تتألف في أصلها من مبتدأ وخبر: <b>الصدقُ فضيلةٌ</b>. المبتدأ محكوم عليه، والخبر يحقق الفائدة.</p><h3>2. صور المبتدأ في الكتاب</h3><ul><li>اسم ظاهر: الوقايةُ نافعةٌ.</li><li>ضمير منفصل: أنا مجتهدٌ.</li><li>اسم إشارة: هذا مفيدٌ.</li><li>اسم موصول: الذي يعملُ ناجحٌ.</li><li>مصدر مؤول: أنْ تتعاونوا خيرٌ لكم.</li></ul><h3>3. صور الخبر</h3><ul><li><b>مفرد:</b> العلمُ نورٌ؛ والمفرد هنا ما ليس جملة ولا شبه جملة، ولو كان مثنى أو جمعًا.</li><li><b>جملة اسمية:</b> الطالبُ خُلُقُه كريمٌ، والرابط الهاء.</li><li><b>جملة فعلية:</b> الطالبُ يقرأُ.</li><li><b>شبه جملة جار ومجرور:</b> الكتابُ في الحقيبةِ.</li><li><b>شبه جملة ظرفية:</b> العصفورُ فوقَ الشجرةِ.</li><li><b>مصدر مؤول:</b> الصوابُ أنْ تعتذرَ.</li></ul><h3>4. علامات الرفع</h3><p>الضمة الظاهرة: الطالبُ مجتهدٌ. الألف للمثنى: الطالبان متفوقان. الواو لجمع المذكر السالم والأسماء الخمسة: المعلمون مخلصون؛ ذو العلم محترمٌ. الضمة المقدرة: الهدى نورٌ؛ القاضي عادلٌ؛ أختي طبيبةٌ.</p><h3>5. فرق أساسي</h3><p>الخبر المفرد مرفوع، والجملة الخبرية في محل رفع. أما شبه الجملة فيتعلق بمحذوف خبر وفق التحليل النحوي المعتمد في الشرح المدرسي.</p><h3>6. مثال إعرابي</h3><p>«الظلمُ مرتعُه وخيمٌ»: الظلم مبتدأ أول، مرتعُه مبتدأ ثان، وخيم خبر المبتدأ الثاني، والجملة الاسمية «مرتعُه وخيم» في محل رفع خبر المبتدأ الأول.</p><h3>7. أخطاء شائعة</h3><ul><li>اعتبار «المعلمون» خبرًا مفردًا لمجرد أنه جمع: الخبر المفرد قد يكون جمعًا.</li><li>نسيان الرابط في جملة الخبر.</li><li>الخلط بين الضمة المقدرة والضمة الظاهرة.</li></ul><h3>تدريب ذاتي</h3><p>حوّل «العلمُ نافعٌ» إلى جملة خبرها فعلية، ثم إلى جملة خبرها شبه جملة، وبيّن موضع الخبر.</p>",

        "summary": "<h3>دليل الدرس: العدد</h3><p><b>مرجع المنهج:</b> ص 85–91. هذا شرح أصلي يغطي أنماط الأعداد والتطبيقات الأساسية.</p><h3>1. مصطلحان أساسيان</h3><p><b>العدد:</b> اللفظ الدال على كمية. <b>المعدود:</b> الاسم الذي نبيّن عدده. انتبه إلى <b>مفرد المعدود</b> عند تحديد التذكير والتأنيث: «كتب» مفردها «كتاب» مذكر، و«صفحات» مفردها «صفحة» مؤنث.</p><h3>2. الواحد والاثنان</h3><p>يطابقان المعدود تذكيرًا وتأنيثًا، ويأتيان غالبًا بعده نعتًا: <b>طالبٌ واحدٌ</b>، <b>طالبتان اثنتان</b>. ويتبع النعت المنعوت في الإعراب.</p><h3>3. الأعداد من 3 إلى 10</h3><p>تخالف المعدود في التذكير والتأنيث، ويكون المعدود جمعًا مجرورًا بالإضافة: <b>ثلاثةُ طلابٍ</b>، <b>ثلاثُ طالباتٍ</b>. وتعامل «بضعة/بضع» معاملة هذه الأعداد في المطابقة والمخالفة.</p><h3>4. العددان 11 و12</h3><p>يطابق الجزآن المعدود: <b>أحدَ عشرَ طالبًا</b>، <b>إحدى عشرةَ طالبةً</b>. العدد 11 مبني على فتح الجزأين، والجزء الأول من 12 يعرب إعراب المثنى: <b>اثنا عشرَ</b> في الرفع، <b>اثني عشرَ</b> في النصب والجر، وللمؤنث: اثنتا/اثنتي عشرةَ.</p><h3>5. الأعداد من 13 إلى 19</h3><p>الجزء الأول يخالف المعدود، والثاني يطابقه: <b>ثلاثةَ عشرَ طالبًا</b>، <b>ثلاثَ عشرةَ طالبةً</b>. ويكون المعدود مفردًا منصوبًا تمييزًا.</p><h3>6. العقود من 20 إلى 90</h3><p>لا تتغير مع جنس المعدود، وتعرب إعراب جمع المذكر السالم: <b>حضر عشرونَ طالبًا</b>، <b>رأيتُ عشرينَ طالبةً</b>، <b>مررتُ بعشرينَ طالبًا</b>.</p><h3>7. الأعداد المعطوفة من 21 إلى 99</h3><p>الآحاد تتبع قواعدها، والعقود ثابتة: <b>واحدٌ وعشرونَ طالبًا</b>، <b>إحدى وعشرونَ طالبةً</b>، <b>ثلاثةٌ وعشرونَ طالبًا</b>، <b>ثلاثٌ وعشرونَ طالبةً</b>. ويتغير ضبط العدد بحسب موقعه الإعرابي.</p><h3>8. المئة والألف وما فوقهما</h3><p>يأتي المعدود بعد المئة والألف مفردًا مجرورًا بالإضافة: <b>مئةُ كتابٍ</b>، <b>ألفُ صفحةٍ</b>. وقد تتداخل هذه الأحكام في الأعداد الكبيرة، فافصل أجزاء العدد وحدد علاقة كل جزء بما يليه.</p><h3>9. خطوات حل سؤال العدد</h3><ul><li>حوّل المعدود إلى مفرده لتعرف جنسه.</li><li>حدّد فئة العدد: مفرد، مركب، عقد، معطوف، مئة أو ألف.</li><li>اضبط العدد بحسب المطابقة أو المخالفة.</li><li>حدّد إعراب العدد في الجملة، ثم اضبط المعدود: جمع مجرور أو مفرد منصوب أو مفرد مجرور.</li></ul><h3>10. أخطاء شائعة</h3><p>«ثلاثة طالبات» خطأ؛ الصواب «ثلاث طالبات». «عشرون طالبٍ» خطأ؛ الصواب «عشرون طالبًا». «رأيتُ اثنا عشر» خطأ في النصب؛ الصواب «اثني عشر».</p><h3>تدريب ذاتي</h3><p>اكتب الأعداد 2 و7 و12 و17 و25 و100 كتابةً لفظيةً مع «طالب» و«طالبة»، ثم بيّن سبب كل ضبط.</p>",

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const dstr = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today = () => dstr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate()-1); return dstr(d); };
const lessonById = id => LESSONS.find(l => l.id === id);
function allQ(filter){
  const out = [];
  LESSONS.forEach(l => { if(filter && !filter(l)) return;
    l.questions.forEach((q,i) => out.push({...q, key:l.id+"_"+i, lid:l.id, lesson:l.title})); });
  if(!filter) SKILLS.forEach(k=>k.questions.forEach((q,i)=>out.push({...q,key:k.id+"_"+i,lid:k.id,lesson:"فهم المقروء: "+k.topic})));
  return out;
}
const qByKey = k => allQ().find(q => q.key === k);
const level = () => Math.floor(S.xp / XP_PER_LEVEL);
const levelName = () => LEVELS[Math.min(level(), LEVELS.length-1)];
function progress(){
  const sum = LESSONS.reduce((a,l) => a + (S.stats[l.id] ? S.stats[l.id].best : 0), 0);
  const skillSum = SKILLS.reduce((a,k)=>a+(S.skillStats[k.id]?.best||0),0);
  return Math.round((sum+skillSum)/(LESSONS.length+SKILLS.length));
}
const scoreCls = v => v >= 80 ? "g" : v >= 50 ? "m" : "l";
const greet = () => { const h = new Date().getHours(); return h < 12 ? "صباح الخير ☀️" : h < 18 ? "مساء الخير 🌤️" : "مساء النور 🌙"; };

function toast(t){ const el=$("toast"); el.innerHTML=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }
function confetti(){
  const c=document.createElement("div"); c.className="confetti";
  const cols=["#3b30c9","#6d3df0","#ffb020","#12b886","#f0567a","#0ea5a4"];
  for(let i=0;i<70;i++){ const p=document.createElement("i");
    p.style.left=Math.random()*100+"%"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.8+Math.random()*1.8)+"s"; p.style.animationDelay=Math.random()*.5+"s"; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
}
let AC;
function beep(ok){
  if(!S.set.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    o.type="sine"; const t=AC.currentTime;
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+.09); }
    else { o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(170,t+.12); }
    g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.28); o.start(t); o.stop(t+.3);
  }catch(e){}
  if(!ok && navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
}

    <button style="background:var(--bad);color:#fff" id="mYes">${yes}</button></div>`;

}

const MAIN = ["home","lessons","skills","mastery","examSetup","stats","settings"];
const TITLES = {home:"أبني لغتي",lessons:"القواعد",skills:"مهارات اللغة",mastery:"مركز الإتقان",examSetup:"امتحان تجريبي",stats:"تقدّمي",settings:"الإعدادات"};
let stack = [];
function show(id, title){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active"); $("title").textContent = title;
  const main = MAIN.includes(id);
  $("app").classList.toggle("nonav", !main);
  $("backBtn").style.display = main ? "none" : "flex";
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  window.scrollTo(0,0);
}
function tab(id){ stopTimer(); stack = []; RENDER[id](); show(id, TITLES[id]); }
function push(id, title){
  const cur = document.querySelector(".screen.active");
  if(cur) stack.push({id:cur.id, title:$("title").textContent});
  show(id, title);
}
function goBack(){
  if(QZ.active && !QZ.done){
    confirmBox("الخروج من الأسئلة؟","لن يُحفظ تقدّمك في هذه المحاولة.","خروج",()=>{ QZ.active=false; stopTimer(); goBack(); });
    return;
  }
  stopTimer();
  let p = stack.pop();
  while(p && (p.id==="quiz" || p.id==="result")) p = stack.pop();
  if(!p){ tab("home"); return; }
  if(RENDER[p.id]) RENDER[p.id]();
  if(p.id==="lesson" && CUR) openLesson(CUR.id, true);
  if(p.id==="skillDetail" && CURRENT_SKILL) openSkill(CURRENT_SKILL.id,true);
  show(p.id, p.title);
}

let SEM = 0, QRY = "";
function renderLessons(){
  $("lessons").innerHTML = `
    <div class="search"><span>🔍</span><input id="sq" placeholder="ابحث عن درس... (مثال: التشبيه)" value="${QRY}" oninput="QRY=this.value;drawUnits()"></div>

      <button class="${SEM===1?"on":""}" onclick="SEM=1;renderLessons()">الفصل الأول</button>

    </div>
    <div id="unitList"></div>`;
  drawUnits();
}
function drawUnits(){
  const q = QRY.trim();
  let h = "";
  UNITS.filter(u => !SEM || u.sem === SEM).forEach(u => {
    const ls = u.lessons.filter(l => !q || l.title.includes(q) || u.title.includes(q) || TYPE[l.type].n.includes(q));
    if(!ls.length) return;
    const up = Math.round(u.lessons.reduce((a,l) => a + (S.stats[l.id]?S.stats[l.id].best:0),0) / u.lessons.length);
    h += `<div class="card unit">
      <div class="uh"><div class="un">${u.n}</div>
        <div class="ut"><small>${u.sem===1?"الفصل الأول":"الفصل الثاني"} • الوحدة ${u.n}</small><b>${u.title}</b>
        <div class="mini"><i style="width:${up}%"></i></div></div></div>
      ${ls.map(l => { const s = S.stats[l.id];
        return `<div class="les" onclick="openLesson('${l.id}')">
          <span class="tag ${TYPE[l.type].c}">${TYPE[l.type].n}</span><b>${l.title}</b>
          <span class="score ${s?scoreCls(s.best):""}">${s ? s.best+"%" : "جديد"}</span></div>`; }).join("")}
    </div>`;
  });
  $("unitList").innerHTML = h || `<div class="empty"><div class="e">🔎</div>لا توجد نتائج لـ«${q}»</div>`;
}

 <div class="card" style="padding:17px"><h3>📚 خطة قراءة الشروح</h3>${LESSONS.map(l=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line,#ddd)"><span>${S.readLessons[l.id]?'✅':'📖'} ${l.title}</span><button style="padding:8px 12px;border-radius:10px" onclick="openLesson('${l.id}')">افتح</button></div>`).join('')}</div>
 <div class="card" style="padding:17px"><h3>🔎 ابحث في الأسئلة</h3><input id="masterySearch" aria-label="ابحث في الأسئلة" placeholder="اكتب كلمة من السؤال أو عنوان الدرس" oninput="searchMastery(this.value)" style="width:100%;padding:12px;border-radius:12px;border:1px solid #aaa"><div id="masteryResults" style="margin-top:10px"></div></div>

function drawQ(){
  const q = QZ.qs[QZ.i]; QZ.answered = false;
  QZ.opts = shuffle(q.o.map((t,k) => ({t, right:k===(q.answer ?? 0)})));
  const fav = S.fav.includes(q.key);
  $("quiz").innerHTML = `
    <div class="qhead"><div class="cnt">السؤال ${QZ.i+1} <small>من ${QZ.qs.length}</small></div>

      </div>
      <div class="why" id="why"></div>

function useHint(){
  if(!QZ.hints || QZ.answered) return;
  const wrong = shuffle(QZ.opts.map((o,k)=>({o,k})).filter(x=>!x.o.right)).slice(0,2);
  wrong.forEach(x => $("o"+x.k).classList.add("gone"));

  const k = QZ.qs[QZ.i].key, b = $("favBtn");

  else { S.fav.push(k); b.classList.add("on"); b.textContent="⭐ محفوظ"; toast("⭐ أُضيف السؤال إلى المفضلة"); }
  save();
}
function pickOpt(k){
  if(QZ.answered) return; QZ.answered = true;
  const q = QZ.qs[QZ.i], o = QZ.opts[k], right = o.right;
  S.solved++;
  const hist=S.attempts[q.key]||{correct:0,wrong:0};
  if(right){hist.correct++;if(hist.wrong>0)hist.wrong--;}
  else {hist.wrong++;hist.correct=0;}
  S.attempts[q.key]=hist;
  if(right){ QZ.right++; S.correct++; QZ.xp += 10; S.xp += 10; if(QZ.mode==="mistakes") S.mistakes = S.mistakes.filter(x=>x!==q.key); }
  else { QZ.wrong.push(q); if(!S.mistakes.includes(q.key)) S.mistakes.push(q.key); }
  save();
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  if($("hintBtn")) $("hintBtn").disabled = true;
  if(QZ.exam){
    $("o"+k).classList.add("sel");
  }else{
    beep(right);
    QZ.opts.forEach((x,j) => { if(x.right) $("o"+j).classList.add("ok"); });
    if(!right) $("o"+k).classList.add("bad");
    const w = $("why"); w.className = "why " + (right?"ok":"bad");
    w.innerHTML = `<b>${right ? ["✅ أحسنت!","✅ إجابة صحيحة","✅ ممتاز!"][Math.floor(Math.random()*3)] : "❌ الإجابة الصحيحة: "+q.o[q.answer ?? 0]}</b>${q.why}`;
  }

  if(QZ.exam){ const i0 = QZ.i; setTimeout(()=>{ if(QZ.active && QZ.i===i0 && QZ.answered) nextQ(); }, 450); }
  else n.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function nextQ(){ if(QZ.i < QZ.qs.length-1){ QZ.i++; drawQ(); window.scrollTo(0,0); } else finish(false); }

/* =================== المؤقت =================== */
let TID = null;
function startTimer(){ stopTimer(); TID = setInterval(()=>{ QZ.time--; drawTimer(); if(QZ.time<=0){ stopTimer(); finish(true); } },1000); }
function stopTimer(){ if(TID){ clearInterval(TID); TID=null; } }
function drawTimer(){ const t=$("timer"); if(!t) return; const m=Math.floor(QZ.time/60), s=QZ.time%60;
  t.textContent=`⏱ ${m}:${s<10?"0":""}${s}`; t.classList.toggle("low", QZ.time<=60); }

/* =================== النتيجة =================== */
function touchStreak(){
  const t = today(); if(S.streak.last === t) return;
  S.streak.count = S.streak.last === yesterday() ? S.streak.count + 1 : 1;
  S.streak.last = t; S.streak.best = Math.max(S.streak.best, S.streak.count);
}
function finish(timeout){
  stopTimer(); QZ.done = true; QZ.active = false;
  const answeredN = QZ.i + (QZ.answered ? 1 : 0);
  if(timeout) for(let j=answeredN;j<QZ.qs.length;j++) QZ.wrong.push(QZ.qs[j]);
  const total = QZ.qs.length, pct = Math.round(QZ.right/total*100);
  const lvBefore = Math.floor((S.xp - QZ.xp)/XP_PER_LEVEL);
  let bonus = 0;
  if(QZ.mode==="lesson"){
    const old = S.stats[CUR.id];
    if(!old && pct>=80) bonus = 30;
    S.stats[CUR.id] = {best:Math.max(old?old.best:0,pct), tries:(old?old.tries:0)+1};
  }
  if(QZ.mode==="daily" && S.daily!==today()){ S.daily = today(); bonus += 20; }
  if(QZ.mode==="exam") S.examBest = Math.max(S.examBest, pct);
  if(QZ.mode==="skill" && CURRENT_SKILL){ const id=CURRENT_SKILL.id; S.skillsDone[id]=true; const old=S.skillStats[id]||{best:0,tries:0}; S.skillStats[id]={best:Math.max(old.best,pct),tries:old.tries+1}; }
  S.xp += bonus; QZ.xp += bonus;
  touchStreak();
  const newAch = ACH.filter(a => !S.ach.includes(a.id) && a.t(S));
  newAch.forEach(a => S.ach.push(a.id));
  save();

  const c = pct>=80?"var(--ok)":pct>=50?"var(--acc)":"var(--bad)";
  const msg = pct===100?["علامة كاملة! 👑","أداء أستاذ، استمر هكذا"]:pct>=90?["ممتاز! 🌟","أنت جاهز للامتحان"]:pct>=75?["جيد جدًا 👏","راجع أخطاءك لتصل للكاملة"]:pct>=50?["جيد 👍","تحتاج مراجعة بسيطة للخلاصة"]:["لا بأس، حاول مجددًا 💪","اقرأ الخلاصة ثم أعد المحاولة"];
  const again = QZ.mode==="skill" ? `<button class="cta" onclick="startSkillQuiz()">🔁 أعد أسئلة الفهم</button><button class="cta alt" onclick="openSkill(CURRENT_SKILL.id)">📖 راجع النص</button>` : QZ.mode==="lesson" ? `<button class="cta" onclick="startLesson()">🔁 أعد الأسئلة</button><button class="cta alt" onclick="goBack()">📖 راجع الخلاصة</button>`
              : QZ.mode==="exam" ? `<button class="cta" onclick="startExam()">🔁 امتحان جديد</button>`
              : QZ.mode==="mistakes" ? `<button class="cta" onclick="startMistakes()">🔁 تابع حل أخطائي</button>`
              : QZ.mode==="fav" ? `<button class="cta" onclick="startFav()">🔁 أعد المفضلة</button>`
              : `<button class="cta" onclick="tab('home')">🏠 الرئيسية</button>`;
  const shareTxt = encodeURIComponent(`حصلت على ${pct}% في «${$("title").textContent}» على تطبيق أبني لغتي للتوجيهي 📚✨`);
  $("result").innerHTML = `
    <div class="card res">
      <div class="bigring" style="--v:${pct};--c:${c}"><i><b>${pct}%</b><small>${QZ.right} من ${total}</small></i></div>
      <h2>${timeout?"انتهى الوقت ⏰":msg[0]}</h2><p>${msg[1]}</p>
      <div class="gain"><span>⭐ +${QZ.xp} نقطة</span><span>🔥 ${S.streak.count} يوم</span></div>
      ${again}
      <a class="cta alt" style="text-decoration:none" href="https://wa.me/?text=${shareTxt}" target="_blank">📤 شارك نتيجتك</a>
    </div>
    ${QZ.wrong.length ? `<div class="sect"><h2>📋 راجع أخطاءك (${QZ.wrong.length})</h2></div>
      <div class="review">${QZ.wrong.map(q=>`<div class="card rv"><div class="q">${q.q}</div><div class="a">✔ ${q.o[q.answer ?? 0]}</div><div class="w">${q.why}</div></div>`).join("")}</div>` : ""}`;
  show("result", "النتيجة");
  if(pct>=90) confetti();
  let d = 300;
  if(Math.floor(S.xp/XP_PER_LEVEL) > lvBefore){ setTimeout(()=>toast(`🎉 ارتقيت إلى مستوى «${levelName()}»`), d); d += 2800; }
  newAch.forEach(a => { setTimeout(()=>{ toast(`🏅 إنجاز جديد: ${a.e} ${a.n}`); beep(true); }, d); d += 2800; });
}

/* =================== التقدّم =================== */
function renderStats(){
  const acc = S.solved ? Math.round(S.correct/S.solved*100) : 0;
  const done = LESSONS.filter(l => S.stats[l.id]);
  const weak = done.slice().sort((a,b)=>S.stats[a.id].best-S.stats[b.id].best).filter(l=>S.stats[l.id].best<80).slice(0,3);
  const byType = ["q","b","a"].map(t => { const ls = LESSONS.filter(l=>l.type===t);
    return {t, v:Math.round(ls.reduce((a,l)=>a+(S.stats[l.id]?S.stats[l.id].best:0),0)/ls.length)}; });
  $("stats").innerHTML = `
    <div class="stats">
      <div class="card st"><b>${progress()}%</b><span>الإنجاز الكلي</span></div>
      <div class="card st"><b>${acc}%</b><span>دقة الإجابات</span></div>
      <div class="card st"><b>${S.solved}</b><span>سؤالًا حللته</span></div>
      <div class="card st"><b>${S.streak.best}</b><span>أطول سلسلة أيام</span></div>
    </div>
    <div class="sect"><h2>مستواك في كل قسم</h2></div>
    <div class="card bars">${byType.map(x=>`<div class="br"><div class="t"><b>${TYPE[x.t].e} ${TYPE[x.t].n}</b><span>${x.v}%</span></div><div class="mini"><i style="width:${x.v}%"></i></div></div>`).join("")}</div>
    <div class="sect"><h2>🎯 تحتاج إلى مراجعة</h2></div>
    ${weak.length ? weak.map(l=>`<div class="card cont" style="margin-bottom:10px" onclick="openLesson('${l.id}')">
        <div class="ic tag ${TYPE[l.type].c}" style="padding:0">${TYPE[l.type].e}</div>
        <div class="tx"><small>أفضل نتيجة ${S.stats[l.id].best}%</small><b>${l.title}</b></div><span class="arrow">‹</span></div>`).join("")
      : `<div class="card empty" style="padding:22px">${done.length?"👏 لا توجد دروس ضعيفة، كل نتائجك فوق 80%":"ابدأ بحل الدروس ليظهر هنا ما يحتاج إلى مراجعة"}</div>`}
    <div class="sect"><h2>🏅 الإنجازات (${S.ach.length}/${ACH.length})</h2></div>
    <div class="ach">${ACH.map(a=>`<div class="ac ${S.ach.includes(a.id)?"on":""}"><div class="e">${a.e}</div><small>${a.n}</small></div>`).join("")}</div>`;
}

/* =================== الإعدادات =================== */
function renderSettings(){
  $("settings").innerHTML = `
    <div class="card set">
      <div class="sr"><div class="ic">👤</div><div class="tx"><b>${S.name||"بدون اسم"}</b><small>اسمك في التطبيق</small></div>
        <button class="tool" style="flex:0;padding:8px 14px" onclick="editName()">تعديل</button></div>
      <div class="sr"><div class="ic">🌙</div><div class="tx"><b>الوضع الليلي</b><small>مريح للعين في الدراسة ليلًا</small></div>
        <button class="sw ${S.set.dark?"on":""}" onclick="toggleDark();renderSettings()"></button></div>
      <div class="sr"><div class="ic">🔊</div><div class="tx"><b>الصوت والاهتزاز</b><small>عند الإجابة</small></div>
        <button class="sw ${S.set.sound?"on":""}" onclick="S.set.sound=!S.set.sound;save();renderSettings()"></button></div>
      <div class="sr"><div class="ic">🔠</div><div class="tx"><b>حجم الخط</b><small>لراحة القراءة</small></div>
        <div class="fs">${["ص","م","ك"].map((t,i)=>`<button class="${S.set.font===i?"on":""}" onclick="setFont(${i})">${t}</button>`).join("")}</div></div>
      <div class="sr"><div class="ic">📦</div><div class="tx"><b>نسخة احتياطية من التقدم</b><small>احفظ نتائجك ومسوداتك في ملف JSON على جهازك</small></div><button class="tool" style="flex:0;padding:8px" onclick="exportProgress()">تصدير</button></div>
      <div class="sr"><div class="ic">📥</div><div class="tx"><b>استعادة التقدم</b><small>استيراد ملف نسختك الاحتياطية</small></div><button class="tool" style="flex:0;padding:8px" onclick="document.getElementById('restoreFile').click()">استيراد</button><input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></div>
      <div class="sr" style="cursor:pointer" onclick="resetAll()"><div class="ic">🗑️</div><div class="tx"><b class="danger">مسح التقدّم</b><small>يحذف النتائج والنقاط والأخطاء</small></div></div>
    </div>
    <div class="card about">
      <div class="lg">أبني لغتي</div>
      <p>تدريبات مستقلة للصف الحادي عشر – الفصل الأول 2026–2027<br>مستندة إلى موضوعات الكتاب المدرسي، وليست تطبيقًا رسميًا تابعًا للمركز الوطني لتطوير المناهج.</p>
      <p style="margin-top:12px">تطوير: <b style="color:var(--ink)">Dahshan Soft</b></p>
      <a class="wa" href="https://wa.me/${WA}" target="_blank">💬 تواصل عبر واتساب</a>
      <p style="margin-top:10px;font-size:.75rem">لاقتراحاتك أو للإبلاغ عن خطأ في سؤال. جميع البيانات محفوظة محليًا على جهازك؛ احفظ نسخة احتياطية قبل حذف بيانات المتصفح.</p>
    </div>`;
}
function exportProgress(){
  const payload={app:'abni-lughati',version:3,exported:new Date().toISOString(),data:S};
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='abni-lughati-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('تم تجهيز ملف النسخة الاحتياطية');
}
async function importProgress(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(file.size>2_000_000){toast('الملف كبير جدًا');input.value='';return;}
  try{
    const payload=JSON.parse(await file.text());
    if(payload.app!=='abni-lughati'||!payload.data||typeof payload.data!=='object'||typeof payload.data.xp!=='number'||!Array.isArray(payload.data.mistakes)||!Array.isArray(payload.data.fav))throw Error('bad format');
    confirmBox('استعادة النسخة الاحتياطية؟','ستحل بيانات النسخة المستوردة محل بيانات التقدم الحالية.','استعادة',()=>{
      S=Object.assign({},JSON.parse(JSON.stringify(DEF)),payload.data);
      S.set=Object.assign({},DEF.set,S.set||{});S.streak=Object.assign({},DEF.streak,S.streak||{});
      S.drafts=S.drafts||{};S.skillsDone=S.skillsDone||{};S.skillStats=S.skillStats||{};
      save();applySet();tab('home');toast('تمت استعادة البيانات');
    });
  }catch(e){toast('ملف النسخة الاحتياطية غير صالح');}
  input.value='';
}
function editName(){
  $("modalBox").innerHTML = `<h3>تعديل الاسم</h3><input id="nm2" value="${S.name}" maxlength="20" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:1rem;margin:10px 0 14px">
    <div class="btns"><button style="background:var(--card2)" onclick="closeModal()">إلغاء</button>
    <button style="background:var(--p1);color:#fff" onclick="S.name=$('nm2').value.trim();save();closeModal();renderSettings()">حفظ</button></div>`;
  $("modal").classList.add("show");
}
function resetAll(){
  confirmBox("مسح كل التقدّم؟","ستُحذف النتائج والنقاط والأخطاء والمفضلة. لا يمكن التراجع.","مسح",()=>{
    const name=S.name, set=S.set; S = JSON.parse(JSON.stringify(DEF)); S.name=name; S.set=set; save(); toast("تم مسح التقدّم"); tab("home"); });
}
function toggleDark(){ S.set.dark = !S.set.dark; save(); applySet(); }
function setFont(i){ S.set.font = i; save(); applySet(); renderSettings(); }
function applySet(){
  document.body.classList.toggle("dark", S.set.dark);
  $("darkBtn").textContent = S.set.dark ? "☀️" : "🌙";
  document.documentElement.style.fontSize = [14.5,16,17.5][S.set.font] + "px";
  document.querySelector('meta[name=theme-color]').content = S.set.dark ? "#0d1222" : "#3b30c9";
}

/* =================== البداية =================== */
const RENDER = {home:renderHome, lessons:renderLessons, skills:renderSkills, mastery:renderMastery, examSetup:renderExamSetup, stats:renderStats, settings:renderSettings};
function saveName(){
  S.name = $("nameIn").value.trim() || "يا بطل"; save();
  $("welcome").style.display = "none"; $("app").style.display = "block"; tab("home");
}
applySet();
if(!S.name){ $("welcome").style.display = "flex"; }
else { $("app").style.display = "block"; tab("home"); }
</script>

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
