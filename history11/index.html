L.push({id:"u3l2",u:3,n:2,t:"الأوضاع الاجتماعية والاقتصادية في العهد العثماني",
idea:"التعرف إلى تاريخ الأردن الاجتماعي والاقتصادي في العهد العثماني.",
sum:[
{h:"فئات المجتمع الأردني",p:["تكوّن المجتمع من *ثلاث فئات*: *الفلاحون* (الغالبية العظمى) – *الحضر* – *البدو*."]},
{h:"① الفلاحون والقرية",p:["القرية *العمود الفقري* للمنطقة، بُنيت غالبًا *على قمة مرتفعة* (حماية طبيعية) أو *قرب عيون الماء* (مصدر للشرب).","بيوتها *مكتظة متقاربة* تفصلها جدران عالية للحماية، ثم قُسّمت إلى *أحياء حسب العائلات*.","بيوت من طابق أو طابقين، من *الطين والحجر والشيد والقش*؛ السقف طين وقش فوق *القصيب* على جسور خشبية.","*الصيانة سنويًا*: الطلاء بالشيد أو الكلس الأبيض داخلًا، وبالتراب الصلصالي والتبن خارجًا لمنع دلف المطر.","*العونة أو الفزعة*: عادة أردنية إيجابية؛ تعاون أهل القرية في البناء والحصاد مع الأغاني والأهازيج.","*الطابون* لصنع الخبز، والمياه من *الينابيع* أو *الصهاريج*، وتُنقل بالجرار والقِرب والروايا. المغاور لإيواء الحيوانات وخزن الحبوب.","منشآت عامة: *المسجد، الكنيسة، الكتّاب*، ومعاصر الزيتون وطواحين الماء."]},
{h:"إدارة القرية",p:["*قانون الولايات العثماني 1864م*: الدولة ← *ولاية* ← *لواء* ← *قضاء* ← *ناحية* ← *قرية*.","في كل قرية *مجلس اختياري* يرأسه *المختار*: حفظ النظام، المسؤولية أمام السلطة، *فضّ النزاعات*، *جمع الضرائب*، واستقبال الزوار الرسميين في *المضافة*.","*الخطيب أو الكاهن* يعلم الدين والقراءة والكتابة والحساب، و*الحارس* يبلغ الناحية بالأحداث (ولادات، وفيات).","*المرأة*: أعمال البيت، مساعدة الزوج في الزراعة، الألبان والأجبان، حياكة الملابس، نسج البسط، صناعة بيوت الشعر. و*الداية (القابلة)* تشرف على الحوامل."]},
{h:"② الحضر",p:["المناطق الحضرية من *القصبات* التي تشبه *القرى الكبيرة*، وتضم رجال السلطة ومقر الحكم والمحاكم والدرك والسجن والسوق.","تحولت إلى *مدن*: *الكرك، السلط، عجلون، إربد*، يعمل سكانها بالتجارة والصناعة والحرف (*الدباغة، المنسوجات، المحاريث*).","يقصدها أهل القرى لبيع الألبان والأجبان والمحاصيل والدواجن."]},
{h:"③ البدو",p:["*البدو الرحّل*: يربّون *الإبل*، في *تنقل مستمر* بحثًا عن الماء والكلأ.","*البدو شبه الرحّل (نصف المستقرة)*: يمارسون *الزراعة وتربية الأغنام* ويتنقلون داخل *ديرة محددة*.","التنظيم: *القبيلة* (شيخ المشايخ) ← *العشيرة* (شيخ العشيرة) ← *الأفخاذ* ← *العائلات*.","*بيت الشعر* من شعر الماعز، سهل الاستعمال لحياة التنقل.","المعيشة على *المواشي*: اللحوم، الزبدة والسمن والجميد والجبنة، *مبادلتها* بحاجاتهم، و*تأجير الجمال* للفلاحين والحجاج.","*القضاء العشائري*: قضاة مختصون معروفون بالنزاهة؛ في ظل غياب مؤسسات الدولة."]},
{h:"الحياة العلمية",p:["قبل ق19م انحصر التعليم في *المدارس الدينية (الزوايا)* و*الكتاتيب*: القرآن والحساب والقراءة والخط.","في *الحكم المصري*: شجّع إبراهيم باشا *الإرساليات التبشيرية*، وأُنشئت *المدرسة الجهادية* في دمشق، وأُرسلت بعثات إلى مصر والأستانة.","*ثلاثة أنماط*: ① *الكتاتيب* ② *المدارس الحكومية* (الابتدائية والرشدية) ③ *المدارس التبشيرية*.","*الكتّاب*: مكان تعليم الصبيان، ملحق بالمساجد، طرق تقليدية (*الحفظ والتلقين والتكرار*)، والشيخ يأخذ *هبات عينية* (حبوب، خبز، بيض).","*المدارس الحكومية* في قصبات: معان، الطفيلة، الكرك، السلط، عمّان، جرش، عجلون، إربد.","*التبشيرية*: ملك الطوائف المسيحية؛ *شروطها*: موافقة الحكومة العثمانية، وخضوع مناهجها للمراقبة؛ أدخلت *الإنجليزية والفرنسية*."]},
{h:"الحياة الاقتصادية",p:["*الزراعة* عصب الحياة: *بعلية* (الشائعة، على الأمطار) و*مروية* (نسبة بسيطة).","*تراجع الزراعة في ق19م*: القحط والجفاف والجراد، كثرة الضرائب، انعدام الأمن، تعدي البدو على القرى، الأساليب التقليدية ← فقر الفلاح و*استدانته من المرابين*.","*الصناعة* بدائية: *جلدية* (أحذية، القربة، الشكوة، الظبية للقهوة) | *غذائية* (عصر الزيتون، الطحين، الزبيب، القطين، الجميد، السمن) | *نسيجية* (البسط، بيوت الشعر، المفارش) | *القش* (الحصر، السلال) | *الفخار* (الجرار) | *معدنية* (سكة الحراثة، المنجل، العربات، تصليح البنادق، البارود، تبييض النحاس، الصياغة) | *خشبية* (المحراث، الأبواب، لوح الدراس).","*التجارة* تراجعت: الاضطرابات، *انعدام الأمن*، فقر السكان، هجمات اللصوص وقطاع الطرق على القوافل.","*الارتباطات التجارية*: الكرك ↔ القدس والخليل | معان ↔ مصر والحجاز | السلط ↔ نابلس والقدس | عجلون ↔ طبريا وعكا ودمشق وبيروت.","*الصادرات*: *القِلي* (نبتة صحراوية للصابون إلى نابلس)، الحبوب، الزبيب، الصوف والجلود، السمن.","*النقود*: الليرة العثمانية الذهبية، *الريال المجيدي*، البارة، البشلك، الليرة الإنجليزية والفرنساوية."]},
{h:"الخط الحديدي الحجازي والضرائب",p:["بدأ إنشاؤه *1900م* في عهد السلطان *عبد الحميد الثاني* من *دمشق إلى المدينة المنورة*، وانتهى *1908م*.","*أهدافه*: خدمة الحجاج، سرعة نقل العساكر، منع التمرد، ربط أطراف الدولة، تشجيع التجارة، نقل المحاصيل، نشر العمران حول المحطات.","*الضرائب*: *العُشر* | *الويركو* (على الأراضي وأصحاب الحرف) | *المواشي* | *المسقّفات* (على الأبنية) | *العرفية* (في الطوارئ كالحرب)."]}
],

idea:"التعرف إلى الثورة العربية الكبرى: أسبابها وأهدافها ومجرياتها ونتائجها، ودور الأردنيين فيها، وصلتها بقيام الدولة الأردنية.",
sum:[
{h:"قبل الثورة",p:["لم يفكر العرب بالانفصال عن الدولة العثمانية *قبل تورطها في الحرب العالمية الأولى* وإعدامات جمال باشا.","انحصرت مطالبهم في *إصلاح الدولة*، ومنحهم حقوقهم، وإنصافهم، و*اللامركزية*."]},
{h:"أسباب (عوامل) قيام الثورة العربية الكبرى",p:["① *احتلال الدول الأوروبية* للبلاد العربية التابعة للدولة العثمانية (الجزائر، تونس، مصر، سواحل الجزيرة الجنوبية) في ظل *عجزها عن حمايتها*.","② تزايد *المظالم والتخلف* وسوء الأوضاع الاقتصادية والاجتماعية والثقافية.","③ تصاعد *المد القومي التركي* و*سياسة التتريك* مع وصول *حزب الاتحاد والترقي* للحكم بالانقلاب على *عبد الحميد الثاني*.","④ *دخول الدولة الحرب العالمية الأولى* (1914–1918م) مع ألمانيا والنمسا-هنغاريا ضد الحلفاء؛ ما أثار مخاوف العرب على بلادهم.","⑤ *إعدامات جمال باشا (السفاح)* لرجالات العرب في *بيروت 1915م* و*دمشق 1916م* (*37 شخصية*).","⑥ *رفض الاتحاد والترقي المطالب الإصلاحية* التي عُرضت في *المؤتمر العربي الأول في باريس 1913م*: العربية لغة رسمية في الولايات العربية، *اللامركزية*، مشاركة أكبر في الحكم ومجلس المبعوثان والإدارة والجيش، *حصر الخدمة العسكرية داخل الولايات العربية*."]},
{h:"سياسة التتريك والامتيازات الأجنبية",p:["*التتريك*: سياسة *عنصرية* مارسها *حزب الاتحاد والترقي* (استولى على الحكم *1908م*) ضد الشعوب الأخرى؛ بالسيطرة على الحكم والإدارة و*فرض اللغة التركية* رسمية في الدولة والتعليم.","*الامتيازات الأجنبية*: منح قدّمها السلاطين للدول الأوروبية لرعاياها: إعفاء من المحاكم العثمانية والضرائب المحلية والتجنيد؛ اعتبرتها أوروبا حقوقًا مكتسبة و*مبررًا للتدخل* في شؤون الدولة."]},
{h:"الشريف الحسين بن علي (1853–1931م)",p:["وُلد في *إسطنبول 1853م* حيث كان والده منفيًا، ونشأ في *مكة* على قيم الإسلام والعروبة، ونُفي إلى إسطنبول *1893م* حتى *1908م* فعاد *أميرًا على مكة*.","كان *مخلصًا للخلافة العثمانية* وارتبط بصلة وثيقة بـ *عبد الحميد الثاني* الذي عيّنه أميرًا على مكة 1908م.","*مكانته*: *انتماؤه الهاشمي*، وكونه من *السلالة النبوية الشريفة* التي تولت إمارة مكة قرونًا ← لذلك اختاره رجال الحركة العربية قائدًا."]},
{h:"تفويض الشريف الحسين بقيادة الحركة العربية",p:["*ميثاق (بروتوكول) دمشق 1915م*: صادر عن جمعيتي *العربية الفتاة والعهد* السريتين وشخصيات عربية؛ نصّب الشريف الحسين *زعيمًا للحركة العربية* وفوّضه *بالتباحث مع بريطانيا* لعقد تحالف ضد الاتحاديين.","*بنوده*: ① اعتراف بريطانيا *باستقلال البلاد العربية*: شمالًا *خط مرسين–أضنة (خط العرض 37)*، جنوبًا *المحيط الهندي عدا عدن*، شرقًا *حدود إيران* إلى الخليج، غربًا *البحر الأحمر* إلى مرسين ② *إلغاء الامتيازات الأجنبية* ③ *معاهدة دفاعية* بين بريطانيا والدولة العربية ④ *تفضيل بريطانيا* في المشروعات الاقتصادية.","*الجمعية العربية الفتاة*: سرية أسسها المثقفون العرب في *باريس 1911م*، انضم إليها *الأمير فيصل*؛ طالبت بالإصلاح ثم *بالاستقلال بعد دخول الحرب*.","*النواب العرب* في مجلس المبعوثان (*35 نائبًا*) فوّضوه بالرئاسة الدينية والقيادة السياسية."]},
{h:"أهداف الثورة ومراسلات الحسين–مكماهون",p:["*الهدف*: حصول البلاد العربية في *آسيا* على *استقلالها في دولة عربية موحدة*.","بدأت الاتصالات بمشاورات *الأمير عبد الله* منذ *1914م* مع ممثلي بريطانيا في مصر.","*مراسلات الحسين–مكماهون (1915–1916م)*: بين الشريف الحسين والسير *هنري مكماهون* المندوب السامي البريطاني في القاهرة؛ *عشر رسائل* (5 من الحسين و5 من مكماهون).","الرسالة الأولى *14 تموز 1915م*: الاستقلال ضمن الحدود السابقة، *إعلان خليفة عربي*، ومهلة *30 يومًا* للرد."]},
{h:"إعلان الثورة ومعاركها",p:["أُعلنت في *9 شعبان 1334هـ = 10 حزيران 1916م* في *مكة المكرمة*.","قادها أنجال الشريف: *علي وعبد الله وفيصل وزيد*، وسيطرت على الحجاز *عدا المدينة المنورة* التي بقيت فيها القوات التركية حتى نهاية الحرب 1918م.","*المنشور الأول*: الاتحاديون سلبوا الخليفة سلطاته، وابتعدوا عن تعاليم الإسلام، واضطهدوا العرب ولغتهم، وعلّقوا أحرارهم على المشانق، وأضاعوا أقطارًا؛ فوجب إنشاء كيان عربي مستقل.","وصلت طلائعها إلى *العقبة 1917م* بقيادة *الأمير فيصل*، ومن معاركها في الأردن: *العقبة، باير، الجفر، جبال الشراة، أبو اللسن، عين وهيدة، معان، وادي موسى، الطفيلة*.","*معارك معان 1918م*: *من أهم معارك الثورة*؛ قضت على الحاميات التركية ومهّدت الطريق إلى دمشق. منح الشريف الحسين *وسام معان* تكريمًا للأبطال.","دخلت دمشق *1918م* وتأسست *المملكة العربية السورية* بقيادة فيصل وأصبح الأردن تابعًا لها.","*العشائر الأردنية* انحازت للثورة متطلعة للتخلص من مظالم الترك."]},
{h:"علم الثورة العربية الكبرى",p:["ثلاثة مستطيلات من الأعلى: *الأسود ثم الأخضر ثم الأبيض*، ومثلث *أحمر* جهة السارية.","*الأسود*: راية العقاب، راية النبي ﷺ، شعار *العباسيين*.","*الأخضر*: شعار *آل البيت*، واتخذته *الدولة الفاطمية*.","*الأبيض*: شعار *الدولة الأموية*.","*الأحمر*: شعار *الأسرة الهاشمية* منذ جدهم *أبي نُمَي*."]},
{h:"أنجال الشريف الحسين",p:["*علي (1881–1935م)*: قائد *الجيش الجنوبي*، حاصر المدينة، *ملك الحجاز*، توفي في العراق.","*عبد الله (1882–1951م)*: قائد *الجيش الشرقي*، *حرر الطائف* وحاصر المدينة، *أمير ثم ملك الأردن*، استُشهد في القدس ودُفن في عمّان.","*فيصل (1883–1933م)*: قائد *الجيش الشمالي*، حرر شمال الحجاز وشرقي الأردن وسوريا، *ملك سوريا ثم العراق*، توفي في برن ودفن في بغداد.","*زيد (1898–1970م)*: عاش في العراق، مناصب دبلوماسية، توفي في باريس ودفن في عمّان."]},
{h:"نتائج الثورة",p:["① *تأسيس دول وممالك عربية*: الحجاز (1916–1925م)، سورية (1918–1920م)، العراق (1921–1958م)، *شرق الأردن منذ 1921م*.","② *نشر الوعي* بحق العرب في استقلال بلادهم ووحدتها.","③ *إبراز القضية العربية* وحق العرب في تقرير المصير.","④ *تحويل الأفكار والمطالب العربية إلى حركة سياسية*."]},
{h:"مواقف بريطانيا وفرنسا: سايكس–بيكو وبلفور",p:["*سايكس–بيكو 1916م*: اتفاقية *سرية* بين البريطاني *مارك سايكس* والفرنسي *جورج بيكو* لتقسيم *الهلال الخصيب* بينما كانت بريطانيا تفاوض الشريف الحسين.","المناطق: *الزرقاء* (الساحل السوري + جنوب الأناضول: فرنسي مباشر) | *الحمراء* (بغداد والبصرة: بريطاني مباشر) | *(أ)* (حلب–دمشق–الموصل: نفوذ فرنسي غير مباشر) | *(ب)* (*شرقي الأردن* وبادية الشام: نفوذ بريطاني غير مباشر) | *البنية* (*فلسطين*: إشراف دولي).","*وعد بلفور 2 تشرين الثاني 1917م*: من وزير الخارجية البريطاني *بلفور* إلى *روتشيلد*، بإقامة *وطن قومي لليهود في فلسطين*.","*الحركة الصهيونية*: حركة سياسية عنصرية ظهرت أواخر ق19م في أوروبا، انبثقت عن *مؤتمر بازل 1897م* برئاسة *هرتزل*.","*موقف الشريف الحسين*: رفض وعد بلفور وسايكس–بيكو، و*رفض توقيع المعاهدة البريطانية–الحجازية* لأنها تعني القبول الضمني بهما رغم ما فيها من دعم له."]}
],

dlg:["م:هل كان العرب يريدون الانفصال عن العثمانيين منذ البداية؟","ط:لا، كانوا يطالبون بالإصلاح واللامركزية.","م:صحيح. فما الذي تغيّر؟ احفظ الأسباب الستة بالترتيب.","ط:الاحتلال الأوروبي للبلاد العربية، المظالم، التتريك، دخول الحرب، إعدامات جمال باشا، رفض مطالب مؤتمر باريس.","م:ممتاز! وما التتريك؟","ط:سياسة عنصرية للاتحاد والترقي تفرض اللغة التركية والسيطرة على الحكم.","م:ولماذا اختير الشريف الحسين قائدًا؟","ط:لأنه هاشمي من السلالة النبوية وأمير مكة.","م:وما ميثاق دمشق؟","ط:وثيقة جمعيتي الفتاة والعهد 1915 تنصّب الشريف الحسين زعيمًا وتفوّضه بمفاوضة بريطانيا.","م:ومتى أُعلنت الثورة؟","ط:10 حزيران 1916م في مكة.","م:وألوان العلم من الأعلى؟ احفظ «سخب»: أسود، أخضر، أبيض، والمثلث أحمر. والدول بالترتيب نفسه «عفا»: عباسي، فاطمي، أموي.","ط:وأهم معركة في الأردن؟","م:معارك معان 1918م؛ قضت على الحاميات التركية ومهّدت الطريق إلى دمشق.","ط:وما الخيانة البريطانية؟","م:سايكس–بيكو السرية 1916 لتقسيم البلاد، ووعد بلفور 1917 لليهود. ورفض الشريف الحسين الاثنين، ورفض توقيع المعاهدة الحجازية البريطانية."],
tips:["ألوان العلم من الأعلى: «*سَخَب*» = *س*ود – *خ*ضر – *ب*يض، والدول بالترتيب: «*عَفَا*» = *ع*باسي – *ف*اطمي – *أ*موي، و*الأحمر = الهاشميون*.","الأسباب الستة: «*احتلال – مظالم – تتريك – حرب – إعدام – رفض*».","التواريخ المتتالية: *1911* الفتاة ← *1913* باريس ← *1914* الحرب ← *1915* ميثاق دمشق ومكماهون ← *1916* الثورة وسايكس–بيكو ← *1917* العقبة وبلفور ← *1918* معان ودمشق.","الأنجال والجيوش: *علي = الجنوبي*، *عبد الله = الشرقي (الطائف)*، *فيصل = الشمالي (الأردن وسوريا)*.","سايكس–بيكو: *الأردن في المنطقة (ب)*، *فلسطين في البنية*."],
cards:[["متى أُعلنت الثورة العربية الكبرى وأين؟","9 شعبان 1334هـ = 10 حزيران 1916م في مكة المكرمة."],["ما سياسة التتريك؟","سياسة عنصرية مارسها حزب الاتحاد والترقي بالسيطرة على الحكم وفرض اللغة التركية رسمية في الدولة والتعليم."],["متى وأين عُقد المؤتمر العربي الأول؟","في باريس عام 1913م."],["كم شخصية أعدم جمال باشا؟","37 شخصية عربية في بيروت 1915م ودمشق 1916م."],["لماذا اختير الشريف الحسين لقيادة الحركة العربية؟","لانتمائه الهاشمي وكونه من السلالة النبوية التي تولت إمارة مكة قرونًا، ومكانته بين العرب والمسلمين."],["ما ميثاق دمشق 1915م؟","وثيقة جمعيتي الفتاة والعهد نصّبت الشريف الحسين زعيمًا للحركة العربية وفوّضته بالتباحث مع بريطانيا."],["ما الامتيازات الأجنبية؟","منح قدمها السلاطين العثمانيون للدول الأوروبية لرعاياها، تعفيهم من المحاكم والضرائب والتجنيد."],["متى وأين تأسست الجمعية العربية الفتاة؟","في باريس عام 1911م."],["ما مراسلات الحسين–مكماهون؟","عشر رسائل (1915–1916م) بين الشريف الحسين والمندوب السامي البريطاني في القاهرة هنري مكماهون."],["هدف الثورة العربية الكبرى؟","استقلال البلاد العربية في آسيا في دولة عربية موحدة."],["أهمية معارك معان 1918م؟","قضت على الحاميات التركية في معان ومهّدت الطريق لجيش الثورة نحو دمشق."],["دلالة اللون الأحمر في علم الثورة؟","شعار الأسرة الهاشمية منذ جدهم أبي نمي."],["الأمير الذي حرر الطائف؟","الأمير عبد الله بن الحسين قائد الجيش الشرقي."],["ما اتفاقية سايكس–بيكو؟","اتفاقية سرية 1916م بين بريطانيا وفرنسا لتقسيم الهلال الخصيب."],["ما وعد بلفور؟","تصريح بريطاني في 2 تشرين الثاني 1917م بإقامة وطن قومي لليهود في فلسطين."],["ما الحركة الصهيونية؟","حركة سياسية عنصرية ظهرت أواخر ق19م، انبثقت عن مؤتمر بازل 1897م برئاسة هرتزل."],["في أي منطقة كان شرقي الأردن في سايكس–بيكو؟","المنطقة (ب): نفوذ بريطاني غير مباشر."]],

mcq:[["الأمير الهاشمي الذي حرر مدينة الطائف:",["علي بن الحسين","عبد الله بن الحسين","فيصل بن الحسين","زيد بن الحسين"],1,"قائد الجيش الشرقي."],["عُقد ميثاق دمشق عام:",["1914م","1915م","1916م","1917م"],1,"1915م."],["أُعلنت الثورة العربية الكبرى في:",["10 حزيران 1916م","2 تشرين الثاني 1917م","14 تموز 1915م","24 تموز 1920م"],0,"في مكة المكرمة."],["اللون الذي يرمز إلى الدولة الأموية في علم الثورة:",["الأسود","الأخضر","الأبيض","الأحمر"],2,"الأبيض."],["اللون الأخضر في علم الثورة شعار:",["العباسيين","آل البيت والفاطميين","الأمويين","الهاشميين منذ أبي نمي"],1,"آل البيت والدولة الفاطمية."],["المندوب السامي البريطاني الذي راسله الشريف الحسين:",["مارك سايكس","هنري مكماهون","هربرت صموئيل","بلفور"],1,"في القاهرة."],["تأسست الجمعية العربية الفتاة في:",["دمشق","بيروت","باريس","القاهرة"],2,"باريس 1911م."],["كان شرقي الأردن في اتفاقية سايكس–بيكو ضمن المنطقة:",["الزرقاء","الحمراء","(أ)","(ب)"],3,"نفوذ بريطاني غير مباشر."],["صدر وعد بلفور عام:",["1916م","1917م","1918م","1920م"],1,"2 تشرين الثاني 1917م."],["قائد الجيش الشمالي للثورة العربية:",["فيصل بن الحسين","علي بن الحسين","عبد الله بن الحسين","زيد بن الحسين"],0,"حرر شمال الحجاز وشرقي الأردن وسوريا."],["من أهم معارك الثورة العربية على الأرض الأردنية:",["ميسلون","معارك معان","حطين","تل الثعالب"],1,"عام 1918م."],["عُقد المؤتمر الصهيوني الأول في مدينة:",["بازل","باريس","لندن","فيينا"],0,"بازل السويسرية 1897م."],["الحزب الذي مارس سياسة التتريك:",["الاتحاد والترقي","العربية الفتاة","العهد","حزب الاستقلال"],0,"استولى على الحكم 1908م."]],
ess:[["ما أسباب إعلان الثورة العربية الكبرى؟","احتلال الدول الأوروبية للبلاد العربية التابعة للدولة العثمانية وعجزها عن حمايتها|تزايد المظالم والتخلف وسوء الأوضاع|تصاعد المد القومي التركي وسياسة التتريك|دخول الدولة العثمانية الحرب العالمية الأولى|إعدامات جمال باشا لرجالات العرب|رفض الاتحاد والترقي المطالب الإصلاحية العربية"],["بيّن أهم المطالب العربية الإصلاحية في المؤتمر العربي الأول (باريس 1913م).","جعل اللغة العربية لغة رسمية في الولايات العربية|اللامركزية ومنح الولايات صلاحيات اتخاذ القرار|منح العرب مزيدًا من المشاركة في الحكم ومجلس المبعوثان والإدارة والجيش|حصر خدمة العرب العسكرية داخل الولايات العربية"],["وضّح مضامين ميثاق دمشق 1915م.","اعتراف بريطانيا باستقلال البلاد العربية ضمن حدود: شمالًا خط مرسين–أضنة، جنوبًا المحيط الهندي عدا عدن، شرقًا حدود إيران، غربًا البحر الأحمر|إلغاء الامتيازات الأجنبية|عقد معاهدة دفاعية بين بريطانيا والدولة العربية|تفضيل بريطانيا في المشروعات الاقتصادية"],["وضّح أسباب اختيار رجال الحركة العربية للشريف الحسين قائدًا لها.","انتماؤه الهاشمي|كونه من السلالة النبوية الشريفة التي تولت إمارة مكة قرونًا|مكانته الرفيعة بين العرب والمسلمين|كونه أمير مكة"],["عدّد نتائج الثورة العربية الكبرى.","تأسيس دول وممالك عربية في الحجاز وسورية والعراق وشرق الأردن|نشر الوعي بحق العرب في استقلال بلادهم ووحدتها|إبراز القضية العربية وحق تقرير المصير|تحويل الأفكار والمطالب العربية إلى حركة سياسية"],["بيّن دلالات ألوان علم الثورة العربية الكبرى.","الأسود: راية العقاب، راية النبي ﷺ وشعار العباسيين|الأخضر: شعار آل البيت والدولة الفاطمية|الأبيض: شعار الدولة الأموية|الأحمر: شعار الأسرة الهاشمية منذ جدهم أبي نمي"],["لخّص اتفاقية سايكس–بيكو.","اتفاقية سرية 1916م بين البريطاني مارك سايكس والفرنسي جورج بيكو|المنطقة الزرقاء: فرنسية مباشرة (الساحل السوري)|الحمراء: بريطانية مباشرة (بغداد والبصرة)|(أ): نفوذ فرنسي غير مباشر|(ب): نفوذ بريطاني غير مباشر (شرقي الأردن)|البنية: فلسطين تحت إشراف دولي"],["فسّر: رفض العرب وعد بلفور.","لأنه إنكار لحقوق العرب وحريتهم وظلم للشعب الفلسطيني|ونقض لتعهدات بريطانيا للشريف الحسين باستقلال البلاد العربية ووحدتها|وتهديد للبلاد العربية كلها وتحالف بين الصهيونية والاستعمار"]]

L.push({id:"u3l4",u:3,n:4,t:"الأردن في عهد المملكة العربية السورية والحكومات المحلية",
idea:"التعرف إلى تاريخ الأردن في حقبة المملكة العربية السورية (1918–1920م) والحكومات المحلية (1920–1921م).",
sum:[
{h:"المملكة العربية السورية (1918–1920م)",p:["دخلت قوات الثورة بقيادة *الأمير فيصل* دمشق *1918م*، وشكّل *حكومة عربية* سُمّيت لاحقًا *المملكة العربية السورية*، شملت *سوريا ولبنان وفلسطين وشرقي الأردن*."]},
{h:"① لجنة كنج–كرين (1919م)",p:["بحث مجلس الحلفاء في *مؤتمر الصلح* في قصر فرساي قرب باريس (1919–1920م) بحضور *الأمير فيصل* مستقبل البلاد العربية، وقرر إرسال *لجنة دولية لاستطلاع رأي الأهالي*.","*رفضت بريطانيا وفرنسا المشاركة* في اللجنة التي اقترحها الرئيس الأمريكي *ويلسون*، فتشكّلت *لجنة أمريكية صرفة* برئاسة *هنري كينغ وتشارلز كرين*، تجولت بين *10 حزيران و21 تموز 1919م*.","*مطالب السكان*: ① استقلال بلاد الشام ② *رفض تجزئة البلاد* ③ *رفض وعد بلفور* ④ وقف الهجرة اليهودية وانتقال الأراضي للصهاينة ⑤ قبول الانتداب *بشرط* أن يكون مساعدة نزيهة.","*توصيات اللجنة*: ① قبول *الانتداب تحت وصاية عصبة الأمم* ② *المحافظة على وحدة بلاد الشام* ③ *ترشيح الأمير فيصل رئيسًا* للدولة السورية."]},
{h:"② المؤتمر السوري العام",p:["شكّله فيصل من *النواب العرب في مجلس المبعوثان* والناخبين الثانويين؛ ليكون *برلمانًا* يمثل أهالي الشام قبل قدوم اللجنة.","عُقد في *دمشق 2 تموز 1919م*.","*قراراته*: ① *استقلال البلاد السورية بحدودها الطبيعية* على الأساس النيابي ② *اختيار فيصل ملكًا دستوريًا* ③ *رفض مزاعم الصهيونية* في فلسطين.","*8 آذار 1920م*: أكّد قراراته، ونادى *بفيصل ملكًا* على سورية الطبيعية، و*أعلن قيام المملكة العربية السورية*."]},
{h:"③ موقف الحلفاء: مؤتمر سان ريمو وميسلون",p:["*مؤتمر سان ريمو* (إيطاليا) – *25 نيسان 1920م*: بريطانيا وفرنسا وإيطاليا وحضور اليابان وبلجيكا واليونان و*الحركة الصهيونية*.","*قراراته*: ① وضع البلاد العربية (من المتوسط إلى إيران) *تحت الانتداب* ② *تجزئة سوريا* إلى فلسطين ولبنان وبقية البلاد ③ *انتداب بريطاني* على *العراق وفلسطين وشرقي الأردن* مع *تنفيذ وعد بلفور* ④ *انتداب فرنسي* على سوريا ولبنان ⑤ تنازل فرنسا عن *الموصل* مقابل *25% من نفطها*.","*معركة ميسلون 24 تموز 1920م*: هاجمت القوات الفرنسية بقيادة *الجنرال غورو* دمشق، و*استُشهد يوسف العظمة* وزير الدفاع، واحتُلت دمشق و*زالت المملكة العربية السورية*."]},
{h:"④ التقسيم الإداري لشرقي الأردن في عهد المملكة",p:["*لواء الكرك*: مركزه *الكرك*؛ أقضية *الطفيلة ومعان والعقبة*؛ نواحي الشوبك والعراق (الكرك) وذيبان وتبوك.","*لواء البلقاء*: مركزه *السلط*؛ *قضاء عمّان* وقضاء الجيزة (زيزيا) وناحية مأدبا.","*لواء حوران*: مركزه *درعا*؛ ويضم من الأردن *قضاءي عجلون وجرش*."]},
{h:"⑤ المشاركة الأردنية في المملكة",p:["*في المؤتمر السوري العام*: خليل التلهوني وناجي ذيب (معان)، حسن عطيوي وعبد المهدي المرافي (الطفيلة)، سعيد الصليبي وسعيد أبو جابر (السلط)، عيسى المدانات (الكرك)، سليمان السودي الروسان وعبد الرحمن إرشيدات (عجلون)، ناصر الفواز البركات الزعبي (الرمثا ضمن وفد حوران).","*في الوظائف*: *محمد علي العجلوني* مرافقًا لفيصل، *علي خلقي الشرايري*، *رفيفان المجالي* مدير الأمن الخارجي في لواء الكرك، *حسين الطراونة* مدير الأمن الداخلي، *هشال الطوالبة* مدير ناحية ذيبان.","*مقاومة الفرنسيين*: متطوعون بقيادة *علي خلقي الشرايري ومحمود أبو راس (الروسان)* في جنوب لبنان والقنيطرة وميسلون؛ وقوات بقيادة *سلطان العدوان* وقوة شركسية (*ميرزا باشا وسعيد المفتي*) عادت من *المزيريب* لانتهاء ميسلون.","*مقاومة الاستيطان الصهيوني*: مؤتمر *قم* (إربد) شكّل قوة بقيادة *كايد المفلح العبيدات*، هاجمت مستعمرة صهيونية ومعسكرًا بريطانيًا في *سمخ قرب بيسان* في *معركة تل الثعالب (20 نيسان 1920م)*، واستُشهد كايد ← *أول صدام مسلح ضد المشروع الصهيوني*، و*أول شهيد أردني وعربي على أرض فلسطين منذ وعد بلفور*.","*ثورة جبل حوران (جبل العرب) 1920م*: شارك فيها متطوعون أردنيون واستُشهد عدد منهم."]},
{h:"الحكومات المحلية (آب 1920 – نيسان 1921م)",p:["دعا *هربرت صموئيل* (المندوب السامي البريطاني على فلسطين وشرقي الأردن) زعماء شرقي الأردن إلى *اجتماع السلط (آب 1920م)*، حضره زعماء الوسط والجنوب ولم يحضره زعماء الشمال؛ وقال: لا نية لإلحاق شرقي الأردن بفلسطين، وستُمنح *إدارة منفردة (حكمًا ذاتيًا)*، ويُعيّن ضباط سياسيون بريطانيون، ولا تجنيد إجباري.","*اجتماع أم قيس (2 أيلول 1920م)* بحضور *الميجر سمرست*؛ *المطالب الأردنية*: ① حكومة عربية يرأسها *أمير عربي* ② مجلس عام يمثل البلاد لسن القوانين والميزانية ③ *استقلال الحكومة عن حكومة فلسطين* ④ *منع الهجرة اليهودية وتحريم بيع الأرض لليهود* ⑤ *جيش وطني* ⑥ حرية التبادل التجاري ⑦ الانضمام لسوريا حين تتحقق الوحدة.","*الحكومات*: ① *حكومة عجلون* (مركزها *إربد*، برئاسة *علي خلقي الشرايري*، انقسمت لحكومات فرعية) ② *حكومة السلط* (من الموجب إلى سيل الزرقاء، برئاسة *مظهر أرسلان*) ③ *حكومة مؤاب (الكرك)* (من الموجب إلى الحسا، برئاسة *رفيفان المجالي*).","ساعدهم ضباط إنجليز ← *وجود رمزي للانتداب*.","*سمات الحكومات المحلية*: ① *ضعيفة* تفتقر للموارد ② ذات صبغة *عشائرية مناطقية* ③ *ليس لها صفة دولية* ④ *لا تعاون بينها* بل تنافس واختلاف ⑤ *لم تتلقَّ مساعدات خارجية*.","لعجزها، *تطلّع الجميع إلى دولة واحدة يحكمها أمير عربي*."]}
],

dlg:["م:بعد دخول فيصل دمشق 1918، ماذا أسّس؟","ط:المملكة العربية السورية.","م:وشملت سوريا ولبنان وفلسطين وشرقي الأردن. ثم أرسل الحلفاء لجنة؛ ما اسمها؟","ط:كنج–كرين.","م:ولماذا كانت أمريكية فقط؟","ط:لأن بريطانيا وفرنسا رفضتا المشاركة.","م:أحسنت. وما توصياتها؟","ط:الانتداب تحت عصبة الأمم، ووحدة بلاد الشام، وفيصل رئيسًا.","م:وماذا قرر المؤتمر السوري العام؟","ط:الاستقلال، وفيصل ملكًا دستوريًا، ورفض الصهيونية.","م:لكن مؤتمر سان ريمو 25 نيسان 1920 قرر العكس: الانتداب والتجزئة وتنفيذ وعد بلفور. ثم ماذا؟","ط:معركة ميسلون 24 تموز 1920 واستشهاد يوسف العظمة.","م:وما أول صدام مسلح مع المشروع الصهيوني؟","ط:معركة تل الثعالب بقيادة كايد المفلح العبيدات 20 نيسان 1920.","م:ممتاز. ما الحكومات المحلية الثلاث؟","ط:عجلون والسلط والكرك.","م:احفظ رؤساءها: «شرايري عجلون، أرسلان السلط، مجالي الكرك». ولماذا فشلت؟","ط:لأنها ضعيفة وعشائرية وبلا صفة دولية ومتنافسة وبلا مساعدات، فتطلع الناس لأمير عربي يوحّدهم."],
tips:["التسلسل الزمني 1919–1920: *كنج–كرين* (حزيران–تموز 1919) ← *المؤتمر السوري* (2 تموز 1919) ← *إعلان المملكة* (8 آذار 1920) ← *تل الثعالب* (20 نيسان 1920) ← *سان ريمو* (25 نيسان 1920) ← *ميسلون* (24 تموز 1920) ← *اجتماع السلط* (آب 1920) ← *أم قيس* (2 أيلول 1920).","الحكومات المحلية: «*شرايري عجلون، أرسلان السلط، مجالي الكرك*».","سمات الحكومات ٥: «*ضعف – عشائرية – لا دولية – تنافس – لا مساعدات*».","الألوية الثلاثة في عهد المملكة: *الكرك (الكرك) – البلقاء (السلط) – حوران (درعا)*.","*كايد المفلح العبيدات*: أول شهيد أردني وعربي على أرض فلسطين بعد بلفور."],
cards:[["ما المملكة العربية السورية؟","حكومة عربية شكّلها فيصل في دمشق 1918م، شملت سوريا ولبنان وفلسطين وشرقي الأردن."],["لماذا كانت لجنة كنج–كرين أمريكية صرفة؟","لأن بريطانيا وفرنسا رفضتا المشاركة في اللجنة التي اقترحها الرئيس ويلسون."],["توصيات لجنة كنج–كرين؟","قبول الانتداب تحت وصاية عصبة الأمم، والمحافظة على وحدة بلاد الشام، وترشيح فيصل رئيسًا."],["متى وأين عُقد المؤتمر السوري العام؟","في دمشق في 2 تموز 1919م."],["قرارات المؤتمر السوري العام؟","استقلال البلاد السورية بحدودها الطبيعية، واختيار فيصل ملكًا دستوريًا، ورفض مزاعم الصهيونية."],["متى أُعلن قيام المملكة العربية السورية؟","في 8 آذار 1920م."],["متى عُقد مؤتمر سان ريمو؟","25 نيسان 1920م في إيطاليا."],["ما قرار سان ريمو بشأن شرقي الأردن؟","وضعه تحت الانتداب البريطاني مع العراق وفلسطين، مع الالتزام بتنفيذ وعد بلفور."],["ما نتائج معركة ميسلون؟","استشهاد يوسف العظمة، واحتلال الفرنسيين دمشق، وزوال المملكة العربية السورية (24 تموز 1920م)."],["ما معركة تل الثعالب؟","هجوم قوة بقيادة كايد المفلح العبيدات على مستعمرة صهيونية ومعسكر بريطاني في سمخ (20 نيسان 1920م)، أول صدام مسلح ضد المشروع الصهيوني."],["من دعا لاجتماع السلط ومتى؟","هربرت صموئيل المندوب السامي البريطاني في آب 1920م."],["متى عُقد اجتماع أم قيس؟","في 2 أيلول 1920م بحضور الميجر سمرست."],["رئيس حكومة عجلون ومركزها؟","علي خلقي الشرايري، ومركزها إربد."],["رئيس حكومة مؤاب (الكرك)؟","الشيخ رفيفان المجالي."],["رئيس حكومة السلط؟","مظهر أرسلان."],["سمات الحكومات المحلية؟","ضعيفة تفتقر للموارد، عشائرية مناطقية، بلا صفة دولية، لا تعاون بينها، بلا مساعدات خارجية."]],
ce:[["رفض بريطانيا وفرنسا المشاركة في اللجنة الدولية","تشكيل لجنة كنج–كرين الأمريكية الصرفة."],["رغبة فيصل في تمثيل أهالي الشام قبل قدوم اللجنة","تشكيل المؤتمر السوري العام."],["قرارات مؤتمر سان ريمو وإنذارات فرنسا","هجوم القوات الفرنسية على دمشق ووقوع ميسلون."],["معركة ميسلون واستيلاء الفرنسيين على دمشق","نهاية المملكة العربية السورية."],["الهجرة والاستيطان اليهودي في فلسطين","تشكيل قوة بقيادة كايد المفلح العبيدات ومعركة تل الثعالب."],["انتهاء المملكة السورية وغياب حكومة مركزية","تأسيس الحكومات المحلية في شرقي الأردن."],["ضعف الحكومات المحلية وعجزها","تطلّع أهالي شرقي الأردن إلى دولة واحدة يحكمها أمير عربي."]],
tl:[["1918م","دخول فيصل دمشق وتأسيس الحكومة العربية"],["10 حزيران – 21 تموز 1919م","جولة لجنة كنج–كرين"],["2 تموز 1919م","انعقاد المؤتمر السوري العام"],["8 آذار 1920م","إعلان المملكة العربية السورية وفيصل ملكًا"],["20 نيسان 1920م","معركة تل الثعالب"],["25 نيسان 1920م","مؤتمر سان ريمو"],["24 تموز 1920م","معركة ميسلون"],["آب 1920م","اجتماع السلط وبداية الحكومات المحلية"],["2 أيلول 1920م","اجتماع أم قيس"],["نيسان 1921م","نهاية الحكومات المحلية"]],
mcq:[["الحكومات المحلية التي تشكلت في الأردن عام 1920م:",["عجلون، عمّان، الكرك","عجلون، الكرك، معان","عجلون، السلط، الكرك","عجلون، الكرك، المفرق"],2,"عجلون والسلط ومؤاب (الكرك)."],["الأمير الهاشمي الذي نودي به ملكًا على سوريا:",["علي بن الحسين","عبد الله بن الحسين","فيصل بن الحسين","زيد بن الحسين"],2,"في 8 آذار 1920م."],["المعركة التي حدثت عام 1920م:",["العقبة","الطفيلة","معان","ميسلون"],3,"24 تموز 1920م."],["وزير دفاع المملكة العربية السورية الذي استُشهد في ميسلون:",["يوسف العظمة","علي خلقي الشرايري","كايد العبيدات","سلطان العدوان"],0,"يوسف العظمة."],["رئيس حكومة عجلون:",["رفيفان المجالي","مظهر أرسلان","علي خلقي الشرايري","حسين الطراونة"],2,"ومركزها إربد."],["قاد قوة المجاهدين في معركة تل الثعالب:",["كايد المفلح العبيدات","سلطان العدوان","محمود أبو راس","ميرزا باشا"],0,"واستُشهد فيها."],["قرر مؤتمر سان ريمو الانتداب الفرنسي على:",["العراق وفلسطين","سوريا ولبنان","شرقي الأردن","الحجاز"],1,"والبريطاني على العراق وفلسطين وشرقي الأردن."],["عُقد اجتماع أم قيس في:",["آب 1920م","2 أيلول 1920م","25 نيسان 1920م","8 آذار 1920م"],1,"بحضور الميجر سمرست."],["مركز لواء البلقاء في عهد المملكة العربية السورية:",["عمّان","السلط","مأدبا","الجيزة"],1,"السلط."],["من توصيات لجنة كنج–كرين:",["تقسيم بلاد الشام","ترشيح فيصل رئيسًا للدولة السورية","تنفيذ وعد بلفور","الانتداب الفرنسي"],1,"مع وحدة بلاد الشام."],["الجنرال الفرنسي الذي هاجم دمشق:",["غورو","سمرست","ويلسون","بيكو"],0,"الجنرال غورو."],["من سمات الحكومات المحلية:",["قوية ومتعاونة","ذات صفة دولية","ذات صبغة عشائرية مناطقية","تلقت مساعدات بريطانية"],2,"وكانت ضعيفة ومتنافسة."]],

});

</script>
<script>
{
const $=s=>document.querySelector(s);
const app=$("#app");
const UC=u=>UNITS[u-1].c;
const md=s=>String(s).replace(/\*(.+?)\*/g,"<b>$1</b>");
let S={read:{},quiz:{},known:{},wrong:[],ess:{},fs:18};
try{const r=localStorage.getItem("hist11");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("hist11",JSON.stringify(S))}catch(e){}};
document.body.style.fontSize=S.fs+"px";
$("#sizeBtn").onclick=()=>{S.fs=S.fs>=22?16:S.fs+2;document.body.style.fontSize=S.fs+"px";save()};
$("#homeBtn").onclick=()=>go("home");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byId=id=>L.find(x=>x.id===id);
function pct(l){let p=0;if(S.read[l.id])p+=30;const q=S.quiz[l.id]||0;p+=q*0.4;const k=(S.known[l.id]||[]).length;p+=Math.min(1,k/l.cards.length)*30;return Math.round(Math.min(100,p))}
const canSpeak="speechSynthesis" in window;
function speak(t,btn){try{if(speechSynthesis.speaking){speechSynthesis.cancel();return}const u=new SpeechSynthesisUtterance(t.replace(/[*|]/g," "));u.lang="ar-SA";u.rate=.85;speechSynthesis.speak(u)}catch(e){if(btn)btn.textContent="غير متاح"}}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
window.addEventListener("hashchange",route);
function route(){const h=location.hash.slice(1)||"home";window.scrollTo(0,0);
 if(h==="home")return home();
 if(h==="exam")return exam();
 if(h==="timeline")return bigTimeline();
 if(h==="review")return review();
 if(h==="bookmap")return bookMap();
 const m=h.match(/^(u\dl\d)(?:-(\w+))?$/);if(m&&byId(m[1]))return lesson(byId(m[1]),m[2]||"sum");
 home()}
/* ---------- HOME ---------- */
function home(){
 $("#brand").textContent="تاريخ الأردن – الصف الحادي عشر";
 const done=L.filter(l=>pct(l)>=80).length, avg=Math.round(L.reduce((a,l)=>a+pct(l),0)/L.length);
 const layers=L.slice().reverse().map(l=>`<button class="layer" style="background:${UC(l.u)};filter:saturate(${.75+l.n*.08}) brightness(${1.12-l.n*.06})" data-go="${l.id}"><span class="dot ${pct(l)>=80?"done":""}">${pct(l)>=80?"✓":l.n}</span><span>${l.t}</span><i>الوحدة ${l.u}</i></button>`).join("");
 app.innerHTML=`<section class="hero"><div>
 <h1>افهم تاريخ الأردن… ثم احفظه بدقة</h1>
 <p class="lead">١٣ درسًا من كتاب الصف الحادي عشر، لكل درس: شرح مبسّط، خريطة ذهنية، حوار بين المعلم والطالب، حيل للحفظ، بطاقات، سبب ونتيجة، تواريخ، واختبار، وأسئلة امتحان مع إجاباتها النموذجية.</p>
 <div class="stats"><div class="stat"><strong>${avg}%</strong><span>إنجازك العام</span></div><div class="stat"><strong>${done}/13</strong><span>دروس متقنة</span></div><div class="stat"><strong>${S.wrong.length}</strong><span>أسئلة للمراجعة</span></div></div>
 <p class="note">ابدأ من أسفل «التلّ» (الأقدم) واصعد للأعلى، درسًا درسًا.</p>
 </div>
 <div class="tell" aria-label="طبقات التاريخ"><div class="sky"><span>اليوم</span></div>${layers}<div class="base">أقدم الطبقات: العصور الحجرية</div></div>
 </section>
 <div class="tools">
 <button class="tool" data-go="exam"><strong>الاختبار الشامل</strong><span>أسئلة عشوائية من الكتاب كله أو من وحدة</span></button>
 <button class="tool" data-go="review"><strong>مراجعة أخطائي</strong><span>الأسئلة التي أخطأت فيها سابقًا</span></button>
 <button class="tool" data-go="timeline"><strong>الخط الزمني الكامل</strong><span>كل تواريخ الكتاب بالترتيب</span></button>
 <button class="tool" data-go="bookmap"><strong>خريطة الكتاب الذهنية</strong><span>الوحدات والدروس في صفحة واحدة</span></button>
 </div>
 ${UNITS.map(u=>`<section class="unit"><div class="unit-h" style="background:${u.c}"><div class="n">${u.n}</div><div><h2 style="margin:0">${u.t}</h2><p>${u.idea}</p></div></div>
 <div class="lessons">${L.filter(l=>l.u===u.n).map(l=>`<button class="les" data-go="${l.id}"><small>الدرس ${l.n}</small><strong>${l.t}</strong><div class="bar"><div style="width:${pct(l)}%;background:${u.c}"></div></div><small>${pct(l)}% منجز</small></button>`).join("")}</div></section>`).join("")}`;
 bindGo()}
function bindGo(){app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
/* ---------- LESSON ---------- */
const TABS=[["sum","الشرح المبسّط"],["map","الخريطة الذهنية"],["dlg","حوار"],["tips","حيل الحفظ"],["cards","بطاقات"],["ce","سبب ونتيجة"],["tl","التواريخ"],["quiz","اختبر نفسك"],["ess","أسئلة الامتحان"]];
function lesson(l,tab){
 const c=UC(l.u);$("#brand").textContent=`الوحدة ${l.u} · الدرس ${l.n}`;
 const i=L.indexOf(l),prev=L[i-1],next=L[i+1];
 app.innerHTML=`<div class="lhead"><span class="chip" style="background:${c}">الوحدة ${l.u}: ${UNITS[l.u-1].t}</span><h1 style="font-size:clamp(28px,5vw,40px)">${l.t}</h1>
 <div class="idea"><b>الفكرة الرئيسة:</b> ${l.idea}</div></div>
 <nav class="tabs" role="tablist">${TABS.map(([k,n])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===tab}" style="${k===tab?`background:${c}`:""}">${n}</button>`).join("")}</nav>
 <div class="pane" id="pane"></div>
 <div class="row" style="justify-content:space-between;margin-bottom:30px">${prev?`<button class="btn" data-go="${prev.id}">→ ${prev.t}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.id}">${next.t} ←</button>`:""}</div>`;
 bindGo();
 app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{history.replaceState(null,"","#"+l.id+(b.dataset.t==="sum"?"":"-"+b.dataset.t));lesson(l,b.dataset.t);document.querySelector(".tabs").scrollIntoView({block:"start"})});
 const sel=app.querySelector('.tab[aria-selected=true]');if(sel)sel.scrollIntoView({inline:"center",block:"nearest"});
 const P=$("#pane");({sum,map,dlg,tips,cards,ce,tl,quiz,ess})[tab](l,P,c)}
function sum(l,P,c){
 P.innerHTML=l.sum.map((s,k)=>`<div class="sec"><h3><span>${s.h}</span>${canSpeak?`<button class="say" data-k="${k}">استمع</button>`:""}</h3><ul>${s.p.map(p=>`<li>${md(p)}</li>`).join("")}</ul></div>`).join("")+
 `<div class="row"><button class="btn pri" style="background:${c}" id="rd">${S.read[l.id]?"✓ قرأت الشرح":"قرأت الشرح وفهمته"}</button><button class="btn" id="tomap">الخطوة التالية: الخريطة الذهنية ←</button></div>`;
 P.querySelectorAll(".say").forEach(b=>b.onclick=()=>{const s=l.sum[b.dataset.k];speak(s.h+". "+s.p.join(". "),b)});
 $("#rd").onclick=()=>{S.read[l.id]=true;save();$("#rd").textContent="✓ قرأت الشرح"};
 $("#tomap").onclick=()=>app.querySelector('[data-t=map]').click()}
function mindmap(m,c,click){
 return `<div class="mm"><div class="mm-root" style="background:${c}">${m.c}</div><div class="mm-stem" style="background:${c}"></div>
 <div class="mm-grid" style="border-color:${c}">${m.b.map((b,i)=>{const col=`hsl(${(i*53+ (c==="#b4532f"?10:c==="#1f6b5c"?160:220))%360} 45% 38%)`;return `<div class="br" style="--stem:${col}"><h4 style="background:${col}">${b[0]}</h4><ul>${b[1].map(x=>typeof x==="string"?`<li>${x}</li>`:`<li><button class="say" style="border:0;padding:0;color:inherit;font-size:inherit" data-go="${x[1]}">${x[0]}</button></li>`).join("")}</ul></div>`}).join("")}</div></div>`}
function map(l,P,c){
 P.innerHTML=`<p class="note">اقرأ الخريطة من المركز إلى الفروع. ثم فعّل «وضع التسميع»: تختفي التفاصيل، حاول تذكّرها ثم المسها لتظهر.</p>
 <div class="row"><button class="btn pri" style="background:${c}" id="hm">وضع التسميع</button></div><div id="mmw">${mindmap(l.map,c)}</div>`;
 const w=$("#mmw");$("#hm").onclick=e=>{w.classList.toggle("hide");e.target.textContent=w.classList.contains("hide")?"أظهر كل التفاصيل":"وضع التسميع";w.querySelectorAll("li").forEach(x=>x.classList.remove("show"))};
 w.addEventListener("click",e=>{const li=e.target.closest("li");if(li&&w.classList.contains("hide"))li.classList.add("show")})}
function dlg(l,P,c){
 let n=2;const draw=()=>{P.innerHTML=`<p class="note">حوار بين المعلّم والطالب يشرح الدرس خطوة خطوة. اقرأه بصوت مرتفع، أو اضغط «استمع».</p><div class="chat">${l.dlg.slice(0,n).map(x=>{const t=x[0]==="م";return `<div class="msg ${t?"t":"s"}" ${t?"":`style="background:${c}"`}><span class="who">${t?"المعلّم":"الطالب"}</span>${md(x.slice(2))}</div>`}).join("")}</div>
 <div class="row">${n<l.dlg.length?`<button class="btn pri" style="background:${c}" id="nx">التالي</button><button class="btn" id="all">اعرض الحوار كاملًا</button>`:`<span class="note">انتهى الحوار. جرّب الآن «حيل الحفظ».</span>`}${canSpeak?`<button class="btn" id="sp">استمع</button>`:""}</div>`;
 const nx=$("#nx");if(nx){nx.onclick=()=>{n=Math.min(l.dlg.length,n+2);draw();nx.scrollIntoView&&$("#nx")&&$("#nx").scrollIntoView({block:"center"})};$("#all").onclick=()=>{n=l.dlg.length;draw()}}
 const sp=$("#sp");if(sp)sp.onclick=()=>speak(l.dlg.slice(0,n).map(x=>x.slice(2)).join(". "),sp)};draw()}
function tips(l,P){P.innerHTML=`<p class="note">جمل قصيرة وحروف أوائل تساعدك على تذكّر القوائم والترتيب في الامتحان.</p><ul class="tips">${l.tips.map(t=>`<li>${md(t)}</li>`).join("")}</ul>`}
function cards(l,P,c){
 const known=new Set(S.known[l.id]||[]);let q=shuffle(l.cards.map((_,i)=>i).filter(i=>!known.has(i)));let cur=0;
 const draw=()=>{if(!q.length){P.innerHTML=`<div class="q" style="text-align:center"><div class="score" style="color:${c}">ممتاز!</div><p>عرفت كل البطاقات (${l.cards.length}).</p><button class="btn" id="rs">ابدأ من جديد</button></div>`;$("#rs").onclick=()=>{S.known[l.id]=[];save();cards(l,P,c)};return}
 const i=q[cur%q.length],k=l.cards[i];
 P.innerHTML=`<p class="prog">عرفت ${known.size} من ${l.cards.length} · المس البطاقة لتقلبها</p><div class="fc"><div class="card3d" id="cd"><div class="face"><small>السؤال</small>${k[0]}</div><div class="face back" style="background:${c}"><small>الجواب</small>${k[1]}</div></div></div>
 <div class="row" style="justify-content:center"><button class="btn" id="no">لم أعرفها، أعدها لي</button><button class="btn pri" style="background:var(--ok)" id="ye">عرفتها</button></div>`;
 $("#cd").onclick=()=>$("#cd").classList.toggle("on");
 $("#ye").onclick=()=>{known.add(i);S.known[l.id]=[...known];save();q.splice(cur%q.length,1);draw()};
 $("#no").onclick=()=>{cur++;draw()}};draw()}
function ce(l,P){P.innerHTML=`<p class="note">اقرأ السبب، وقل النتيجة بصوتك، ثم المس المربع لتتأكد. (أسئلة «فسّر» في الامتحان تأتي من هنا.)</p>`+l.ce.map(x=>`<div class="ce"><div><span class="lab">السبب</span>${x[0]}</div><div class="ar">←</div><div class="eff cover" data-v="${x[1].replace(/"/g,"&quot;")}"><span>المس لإظهار النتيجة</span></div></div>`).join("")+`<div class="row"><button class="btn" id="sa">أظهر الكل</button></div>`;
 const open=d=>{d.classList.remove("cover");d.innerHTML=`<span class="lab">النتيجة</span>${d.dataset.v}`};
 P.querySelectorAll(".eff").forEach(d=>d.onclick=()=>open(d));$("#sa").onclick=()=>P.querySelectorAll(".eff.cover").forEach(open)}
function tl(l,P,c){P.innerHTML=`<div class="row"><button class="btn pri" style="background:${c}" id="ht">أخفِ الأحداث واختبر نفسي</button></div><div class="tl" id="tlw">${l.tl.map(x=>`<div class="ev"><span class="d">${x[0]}</span>: <span class="e">${x[1]}</span></div>`).join("")}</div>`;
 const w=$("#tlw");$("#ht").onclick=e=>{w.classList.toggle("hideev");e.target.textContent=w.classList.contains("hideev")?"أظهر الأحداث":"أخفِ الأحداث واختبر نفسي";w.querySelectorAll(".e").forEach(x=>x.classList.remove("show"))};
 w.addEventListener("click",e=>{const x=e.target.closest(".e");if(x)x.classList.add("show")})}
/* quiz engine: items = [{l, i}] */
function runQuiz(items,P,c,onEnd){
 let k=0,score=0,wrongs=[];
 const draw=()=>{if(k>=items.length){const p=Math.round(score/items.length*100);onEnd&&onEnd(p);
  P.innerHTML=`<div class="q" style="text-align:center"><div class="score" style="color:${p>=80?"var(--ok)":p>=50?"var(--gold)":"var(--bad)"}">${p}%</div><p>${score} من ${items.length} إجابة صحيحة. ${p>=80?"أداء ممتاز، أنت جاهز!":p>=50?"جيد، راجع الأسئلة التي أخطأت فيها.":"لا بأس، ارجع إلى الشرح والخريطة ثم أعد المحاولة."}</p><div class="row" style="justify-content:center"><button class="btn pri" style="background:${c}" id="again">أعد الاختبار</button>${wrongs.length?`<button class="btn" id="wr">أعد الأسئلة الخاطئة فقط (${wrongs.length})</button>`:""}</div></div>`;
  $("#again").onclick=()=>runQuiz(shuffle(items),P,c,onEnd);const w=$("#wr");if(w)w.onclick=()=>runQuiz(wrongs,P,c,null);return}
  const it=items[k],L0=byId(it.l),m=L0.mcq[it.i],order=shuffle([0,1,2,3].slice(0,m[1].length));
  P.innerHTML=`<p class="prog">السؤال ${k+1} من ${items.length} · ${L0.t}</p><div class="q"><p class="qt">${m[0]}</p>${order.map(o=>`<button class="opt" data-o="${o}">${m[1][o]}</button>`).join("")}<div id="fb"></div></div>`;
  P.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=+b.dataset.o,ok=o===m[2],key=it.l+":"+it.i;
   P.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===m[2])x.classList.add("ok")});
   if(ok){score++;S.wrong=S.wrong.filter(w=>w!==key)}else{b.classList.add("no");wrongs.push(it);if(!S.wrong.includes(key))S.wrong.push(key)}save();
   $("#fb").innerHTML=`<div class="fb"><b style="background:none">${ok?"إجابة صحيحة.":"إجابة خاطئة."}</b> ${m[3]}</div><div class="row"><button class="btn pri" style="background:${c}" id="nq">${k+1<items.length?"السؤال التالي":"النتيجة"}</button></div>`;
   $("#nq").onclick=()=>{k++;draw()};$("#nq").focus()})};draw()}
function quiz(l,P,c){runQuiz(shuffle(l.mcq.map((_,i)=>({l:l.id,i}))),P,c,p=>{S.quiz[l.id]=Math.max(S.quiz[l.id]||0,p);save()})}
function ess(l,P,c){P.innerHTML=`<p class="note">هذه أسئلة على نمط الكتاب والامتحان (وضّح، فسّر، عدّد، قارن). حاول الإجابة في دفترك أو بصوتك أولًا، ثم اكشف الإجابة النموذجية وقارن.</p>`+l.ess.map((e,i)=>`<div class="ess"><h3>${i+1}. ${e[0]}</h3><div class="row"><button class="btn" data-i="${i}">اكشف الإجابة النموذجية</button></div><div class="ans hidden" id="a${i}"><ol>${e[1].split("|").map(x=>`<li>${md(x)}</li>`).join("")}</ol><div class="row"><button class="btn" style="color:var(--ok)" data-m="${i}" data-v="1">أجبت صح</button><button class="btn" style="color:var(--bad)" data-m="${i}" data-v="0">أحتاج مراجعة</button><span class="note" id="m${i}">${(S.ess[l.id+":"+i]===1)?"✓ متقن":(S.ess[l.id+":"+i]===0)?"يحتاج مراجعة":""}</span></div></div></div>`).join("");
 P.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{$("#a"+b.dataset.i).classList.toggle("hidden")});
 P.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const key=l.id+":"+b.dataset.m;S.ess[key]=+b.dataset.v;save();$("#m"+b.dataset.m).textContent=b.dataset.v==="1"?"✓ متقن":"يحتاج مراجعة"})}
/* ---------- GLOBAL ---------- */
function exam(){$("#brand").textContent="الاختبار الشامل";let u=0;
 const draw=()=>{app.innerHTML=`<h1>الاختبار الشامل</h1><p class="lead">٢٠ سؤالًا عشوائيًا. اختر النطاق ثم ابدأ.</p><div class="filters">${["الكتاب كله","الوحدة 1","الوحدة 2","الوحدة 3"].map((n,i)=>`<button class="tab" data-u="${i}" aria-selected="${i===u}" style="${i===u?"background:var(--u1)":""}">${n}</button>`).join("")}</div><div class="row"><button class="btn pri" style="background:var(--u3)" id="st">ابدأ الاختبار</button></div><div id="pane" class="pane"></div>`;
 app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{u=+b.dataset.u;draw()});
 $("#st").onclick=()=>{const pool=[];L.filter(l=>!u||l.u===u).forEach(l=>l.mcq.forEach((_,i)=>pool.push({l:l.id,i})));runQuiz(shuffle(pool).slice(0,20),$("#pane"),"var(--u3)",null);$("#st").classList.add("hidden")}};draw()}
function review(){$("#brand").textContent="مراجعة أخطائي";
 const items=S.wrong.map(w=>{const [l,i]=w.split(":");return {l,i:+i}}).filter(x=>byId(x.l));
 app.innerHTML=`<h1>مراجعة أخطائي</h1>${items.length?`<p class="lead">${items.length} سؤالًا أخطأت فيها. عندما تجيب عن السؤال صحيحًا يُحذف من القائمة.</p><div id="pane" class="pane"></div>`:`<p class="lead">لا توجد أخطاء محفوظة. ادخل أي درس وحلّ «اختبر نفسك»، وستظهر هنا الأسئلة التي تحتاج مراجعة.</p><button class="btn" data-go="home">العودة للرئيسية</button>`}`;
 bindGo();if(items.length)runQuiz(shuffle(items),$("#pane"),"var(--u1)",null)}
function bigTimeline(){$("#brand").textContent="الخط الزمني الكامل";let u=0;
 const draw=()=>{app.innerHTML=`<h1>الخط الزمني الكامل</h1><p class="lead">كل تواريخ الكتاب مرتبة حسب الدروس. استخدم «أخفِ الأحداث» لاختبار ذاكرتك.</p><div class="filters">${["الكل","الوحدة 1","الوحدة 2","الوحدة 3"].map((n,i)=>`<button class="tab" data-u="${i}" aria-selected="${i===u}" style="${i===u?"background:var(--u2)":""}">${n}</button>`).join("")}<button class="tab" id="ht">أخفِ الأحداث</button></div><div class="tl" id="tlw">${L.filter(l=>!u||l.u===u).map(l=>l.tl.map(x=>`<div class="ev"><span class="d">${x[0]}</span>: <span class="e">${x[1]}</span><small>${l.t}</small></div>`).join("")).join("")}</div>`;
 app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{u=+b.dataset.u;draw()});const w=$("#tlw");
 $("#ht").onclick=()=>w.classList.toggle("hideev");w.addEventListener("click",e=>{const x=e.target.closest(".e");if(x)x.classList.add("show")})};draw()}
function bookMap(){$("#brand").textContent="خريطة الكتاب الذهنية";
 app.innerHTML=`<h1>خريطة الكتاب الذهنية</h1><p class="lead">الكتاب كله في صفحة واحدة. المس اسم الدرس لفتحه.</p>`+UNITS.map(u=>`<h2 style="color:${u.c}">الوحدة ${u.n}</h2>`+mindmap({c:u.t,b:L.filter(l=>l.u===u.n).map(l=>[`الدرس ${l.n}`,[[l.t,l.id],...l.map.b.map(b=>b[0])]])},u.c)).join("");bindGo()}
route();
}
</script>
