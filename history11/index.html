<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تاريخ الأردن 11</title>
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
@font-face{font-family:"NaskhLocal";src:url("fonts/NotoNaskhArabic.ttf") format("truetype");font-weight:400 700;font-display:swap}
/* VOICE: معلّم صبور يشرح لطالب يحتاج وقتًا؛ جمل قصيرة، خط نسخ كبير واضح.
   IDEA: مقطع أثري في تلّ أردني؛ طبقات الأرض من الأقدم أسفل إلى الأحدث أعلى، كل طبقة درس.
   PICTURE: عمود الطبقات الملوّن في الواجهة، كل طبقة تفتح درسها.
   COLOUR and TYPE: أرضية حجر جيري رملي، حبر بني داكن، ورديّ البترا للوحدة 1، أخضر زيتوني للوحدة 2، أزرق للوحدة 3، وذهبي للتمييز. Noto Naskh Arabic لكل النصوص.
   LAYOUT: عمود واحد مريح على الهاتف، شبكتان على الشاشات الواسعة، تبويبات أفقية قابلة للتمرير داخل الدرس. */
:root{color-scheme:light dark;
--bg:light-dark(#f6efe3,#18130f);--card:light-dark(#fffaf2,#231c16);--ink:light-dark(#2a1f17,#f1e6d8);--mute:light-dark(#6e5d4e,#bfae9b);
--line:light-dark(#e3d5c1,#3a2f25);--gold:#d39a22;--ok:light-dark(#2f7d4f,#6fcf97);--bad:light-dark(#b3372e,#ff8a7f);
--u1:#b4532f;--u2:#1f6b5c;--u3:#2d4a86;--hl:light-dark(#fde7a8,#5a4513)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.9 "NaskhLocal","Noto Naskh Arabic","Amiri","Traditional Arabic","Times New Roman",serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
b{font-weight:700;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,14px)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{font-weight:700;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0 12px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.25;margin:.2em 0 .1em;text-wrap:balance}
h2{font-size:26px;line-height:1.4;margin:1.2em 0 .5em}
h3{font-size:20px;margin:.2em 0 .4em}
.lead{color:var(--mute);font-size:18px;max-width:60ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;padding:24px 0 8px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.tell{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px -18px #0007;background:var(--card)}
.tell .sky{height:34px;background:linear-gradient(light-dark(#cfe3ea,#1d2a33),transparent);position:relative}
.tell .sky span{position:absolute;inset-inline-start:14px;top:6px;font-size:14px;color:var(--mute)}
.layer{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:start;padding:7px 14px;min-height:44px;color:#fff;font-size:16px;position:relative}
.layer i{font-style:normal;font-size:13px;opacity:.85;margin-inline-start:auto;white-space:nowrap}
.layer:hover{filter:brightness(1.08)}
.layer>span:not(.dot){flex:1 1 0}
@media(max-width:520px){.layer i{display:none}}
.layer .dot{width:22px;height:22px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:12px;flex:none}
.layer .dot.done{background:#fff;color:#2a1f17}
.tell .base{padding:8px 14px;font-size:13px;color:var(--mute)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.stat strong{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:14px;color:var(--mute)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:10px 0 6px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start;min-height:84px}
.tool strong{display:block;font-size:18px}.tool span{color:var(--mute);font-size:15px}
.unit{margin:30px 0}
.unit-h{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;color:#fff}
.unit-h .n{font-size:40px;line-height:1;font-weight:700;opacity:.9}
.unit-h p{margin:.2em 0 0;font-size:16px;opacity:.92}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px}
.les{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:110px}
.les small{color:var(--mute);font-size:14px}
.les strong{font-size:18px;line-height:1.5}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:auto}
.bar>div{height:100%;border-radius:9px}
/* lesson page */
.lhead{padding:18px 0 6px}
.chip{display:inline-block;font-size:14px;padding:2px 12px;border-radius:99px;color:#fff}
.idea{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0}
.idea b{background:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;position:sticky;top:58px;z-index:10;background:var(--bg);scrollbar-width:thin}
.tab{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;white-space:nowrap}
.tab[aria-selected=true]{color:#fff;border-color:transparent}
.pane{padding:6px 0 60px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:12px 0}
.sec ul{margin:0;padding-inline-start:22px}.sec li{margin:4px 0}
.sec h3{display:flex;gap:8px;align-items:center;justify-content:space-between}
.say{font-size:14px;min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.btn.pri{color:#fff;border-color:transparent}
.note{color:var(--mute);font-size:15px}
/* mind map */
.mm{display:flex;flex-direction:column;align-items:center}
.mm-root{padding:12px 26px;border-radius:999px;color:#fff;font-weight:700;font-size:21px;text-align:center;box-shadow:0 8px 20px -12px #0008}
.mm-stem{width:3px;height:22px}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;width:100%;border-top:3px solid;padding-top:18px}
.br{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.br::before{content:"";position:absolute;top:-21px;inset-inline-start:50%;width:3px;height:18px;background:inherit;background:var(--stem)}
.br h4{margin:0 0 6px;font-size:18px;padding:4px 12px;border-radius:10px;color:#fff;display:inline-block}
.br ul{list-style:none;margin:0;padding:0;border-inline-start:2px dashed var(--line);padding-inline-start:12px}
.br li{position:relative;margin:6px 0;padding:2px 10px;border-radius:9px;background:color-mix(in srgb,var(--stem) 10%,transparent);font-size:16px}
.br li::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;width:12px;border-top:2px dashed var(--line)}
.hide .br li{color:transparent;background:var(--line);cursor:pointer;user-select:none}
.hide .br li.show{color:inherit;background:color-mix(in srgb,var(--stem) 10%,transparent)}
/* dialogue */
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;border:1px solid var(--line);animation:pop .25s ease}
.msg.t{align-self:flex-start;background:var(--card);border-start-start-radius:4px}
.msg.s{align-self:flex-end;color:#fff;border-start-end-radius:4px;border-color:transparent}
.msg .who{display:block;font-size:13px;opacity:.75}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.msg,.flip-in{animation:none}.card3d{transition:none}}
/* flash cards */
.fc{perspective:1200px;max-width:620px;margin:10px auto}
.card3d{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.card3d.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--card);font-size:21px}
.face.back{transform:rotateY(180deg);color:#fff;border-color:transparent}
.face small{position:absolute;top:10px;font-size:13px;opacity:.7}
.prog{font-size:15px;color:var(--mute);text-align:center}
/* cause effect */
.ce{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:12px 0}
.ce>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ce .ar{align-self:center;font-size:24px;color:var(--mute)}
.ce .lab{display:block;font-size:13px;color:var(--mute)}
.ce .eff.cover{cursor:pointer;color:var(--mute);display:grid;place-items:center;border-style:dashed}
@media(max-width:600px){.ce{grid-template-columns:minmax(0,1fr)}.ce .ar{transform:rotate(-90deg);justify-self:center}}
/* timeline */
.tl{position:relative;padding-inline-start:26px;border-inline-start:3px solid var(--line);margin-inline-start:8px}
.tl .ev{position:relative;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.tl .ev::before{content:"";position:absolute;inset-inline-start:-35px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.tl .d{font-weight:700;white-space:nowrap}
.tl .ev small{color:var(--mute);font-size:13px;margin-inline-start:6px}
.hideev .ev .e{color:transparent;background:var(--line);border-radius:6px;cursor:pointer}
.hideev .ev .e.show{color:inherit;background:none}
/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;max-width:760px}
.q .qt{font-size:20px;font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:10px 14px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:18px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.fb{margin-top:8px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,transparent)}
.score{font-size:clamp(40px,10vw,64px);font-weight:700;line-height:1.1}
.ess{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:12px 0}
.ess .ans{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.ess ol{margin:0;padding-inline-start:24px}
.tips li{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;list-style:none}
.tips{padding:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
footer{color:var(--mute);font-size:14px;padding:30px 0 50px;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<button class="ib" id="homeBtn" aria-label="الرئيسية"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
<div class="brand" id="brand">تاريخ الأردن – الصف الحادي عشر</div>
<button class="ib" id="sizeBtn" aria-label="تكبير الخط">أ+</button>
</div></header>
<main class="wrap" id="app"></main>
<footer>تطبيق مراجعة لكتاب «تاريخ الأردن» – الصف الحادي عشر الأكاديمي، الفصل الأول (طبعة 2025) · تطوير: Dahshan Soft</footer>
<script>
const UNITS=[
{n:1,t:"الأردن في العصور القديمة",idea:"الأردن متحف مفتوح، يزخر بتراثه الحضاري منذ العصور الحجرية حتى اليوم، ولا بد من دراسة هذا التراث ورعايته والمحافظة عليه.",c:"#b4532f"},
{n:2,t:"الأردن في العصور الإسلامية",idea:"الأردن بوابة الفتح الإسلامي لبلاد الشام؛ منه عبرت الجيوش، وعلى أرضه وقعت مؤتة وطبقة فحل واليرموك، وروى الصحابة أرضه بدمائهم.",c:"#1f6b5c"},
{n:3,t:"الأردن في العصر الحديث",idea:"خضع الأردن للحكم العثماني أربعة قرون، انتهت بالثورة العربية الكبرى؛ وهي نهضة هدفت إلى استقلال البلاد العربية في آسيا وتخليصها من الظلم.",c:"#2d4a86"}
];
const L=[];
/* ================= الوحدة 1 الدرس 1 ================= */
L.push({id:"u1l1",u:1,n:1,t:"الأردن في العصور الحجرية",
idea:"الأردن مأهول بالسكان منذ العصور الحجرية القديمة، وقامت على أرضه حضارات كثيرة.",
sum:[
{h:"معنى كلمة الأردن",p:["كلمة *الأردن (جوردان)* تتألف من (جور: بانياس) و(دان)، وهما الرافدان الشماليان لنهر الأردن.","أطلق العرب عليه اسم الأردن بمعنى *الشدة والغلبة*.","الاسم الإغريقي هو *يوردانيم*، ومعنى الأردن بالآرامية: *النهر المتعرّج شديد الانحدار*."]},
{h:"لماذا استقر الإنسان في الأردن؟ (عوامل قيام الحضارات)",p:["*اعتدال المناخ*.","*وفرة المياه*.","*التربة الخصبة*.","*الموقع المتوسط* بين حضارات بلاد الشام وبلاد الرافدين من جهة، وحضارات شبه الجزيرة العربية ومصر من جهة أخرى."]},
{h:"تقسيم العصور القديمة",p:["اتفق علماء الآثار والمؤرخون على تقسيمها إلى قسمين *تسهيلًا لدراستها* ومعرفة النشاط البشري:","*عصور ما قبل التاريخ*: من نشأة الإنسان حتى *اختراع الكتابة (3500 ق.م)*.","*العصور التاريخية*: ما بعد اختراع الكتابة.","عدد المواقع الأثرية المكتشفة في الأردن نحو *مئة ألف موقع* معظمها لعصور ما قبل التاريخ، والمسجّل رسميًا نحو *خمسة عشر ألف موقع*."]},
{h:"① العصر الحجري القديم (منذ 2.5 مليون سنة)",p:["بدأ الإنسان *يصنع أدواته من الحجر*، وعاش *صيادًا للحيوانات وجامعًا للطعام*.","عاش حياة التنقل، وسكن *الكهوف والملاجئ الصخرية*، وصنع أدواته من شظايا الحجارة والعظام والقرون، و*عرف استخدام النار*.","*دوقرة* (وادي الزرقاء/محافظة الزرقاء): من *أقدم مواقع هذا العصر في قارة آسيا* (2.5 مليون سنة).","مواقع أخرى: *وادي الحسا واللجون* (الطفيلة والكرك)، و*طبقة فحل* (غور الأردن الشمالي/إربد)."]},
{h:"② العصر الحجري الوسيط (20000 ق.م)",p:["*مرحلة انتقالية* من مجتمعات الصيد وجمع الطعام إلى *مجتمعات منتجة للغذاء*.","انتقل من الكهوف إلى السكن *قرب الأنهار والينابيع*، وبدأ الاستقرار التدريجي، ومحاولات أولى لزراعة النباتات البرية وتدجين الحيوانات.","أصبحت أدواته *أدق وأصغر*، وظهرت *المناجل والأجران ورحى الطحن*.","*عيون الحمام* (وادي زقلاب/إربد): *أقدم مقبرة منظمة في العالم* (نحو 16 ألف عام).","مواقع أخرى: *الأزرق والخرانة (الحرانة)* شرق عمّان."]},
{h:"③ العصر الحجري الحديث (8500 ق.م)",p:["استقر الإنسان في *قرى زراعية*، و*دجّن الحيوانات*، وبنى بيوتًا ذات *شكل هندسي*.","ظهرت *الملكية الفردية* (ملكية الحقول والحيوانات)، وصنع *الفخار*، والتماثيل الطينية لعبادة آلهة الخصب، وتعلّم حياكة الملابس، و*دفن موتاه*.","*عين غزال* (عمّان): نموذج للقرى، وتماثيلها *أقدم تماثيل جبسية في العالم*.","مواقع أخرى: *بسطة* (معان)، و*تل أبو الصوان* (جرش)."]},
{h:"④ العصر الحجري النحاسي (4500 ق.م)",p:["صنع الإنسان أدواته *من النحاس إلى جانب الحجر*، وعرف استخراج خاماته وصهرها وطرقها ← *ظهور طبقة الصنّاع والحرفيين*.","تطورت القرى وظهرت *المدن الصغيرة*، وبدأت *التجارة بالمقايضة*، ودُجّنت *الخيول والإبل*، وابتُكرت *العجلة ودولاب الخزف*، واخترعت *الكتابة*، واستُخدمت *الأختام الأسطوانية*، وبُنيت المعابد.","*وادي فينان* (قرب وادي عربة): *أشهر مناجم النحاس*.","مواقع أخرى: *تل الشونة الشمالية* (إربد)، *تليلات الغسول* (شمال البحر الميت)، *تل أبو حامد* (غور الأردن الشمالي)."]},
{h:"⑤ العصر البرونزي",p:["*البرونز = نحاس + قصدير*، وبنى الإنسان *الأسوار والبوابات والتحصينات الضخمة والمعابد*.","يُعدّ *أول مراحل التمدّن*: زاد الإنتاج على الحاجة ← التخزين وبيع الفائض.","نشأ نظام *دويلات المدن (دولة المدينة)*: لكل مدينة نظام خاص وحكم منفرد وجيش ← *الأمن والاستقرار* ← *ازدهار الزراعة والتجارة*.","مواقع: *باب الذراع* (غور الأردن الجنوبي/الكرك)، *جاوا* (البادية الشمالية الشرقية/المفرق)، *تل السعيدية* (غور الأردن الشمالي)."]},
{h:"أبرز الإنجازات الحضارية في العصور الحجرية",p:["اكتشاف *النار* وصهر المعادن وطرقها.","اكتشاف *الزراعة* وإنتاج الطعام.","*تدجين الحيوانات* واختراع *العجلة*.","*اختراع الكتابة*.","تنظيم المجتمع وظهور *السلطتين الدينية والسياسية*.","تطور *العمارة* وظهور *الفنون* كصناعة التماثيل."]}
],
map:{c:"العصور الحجرية",b:[

dlg:["م:صباح الخير! هل تعرف لماذا يسمّي كتابنا الأردنَّ «متحفًا مفتوحًا»؟","ط:لأن فيه آثارًا كثيرة؟","م:بالضبط. فيه نحو مئة ألف موقع أثري! والمسجّل رسميًا نحو خمسة عشر ألفًا.","ط:ولماذا عاش الإنسان القديم هنا بالذات؟","م:احفظها بأربع كلمات: مناخ معتدل، مياه وفيرة، تربة خصبة، وموقع متوسط بين الحضارات.","ط:وكيف قسّم العلماء التاريخ؟","م:إلى عصور ما قبل التاريخ، وهي حتى اختراع الكتابة سنة 3500 ق.م، والعصور التاريخية بعدها. والهدف تسهيل الدراسة.","ط:وما ترتيب العصور الحجرية؟","م:قل معي: «قد وصل حسنٌ ناجحًا ببراعة» = قديم، وسيط، حديث، نحاسي، برونزي.","ط:جميل! وما أهم موقع في كل عصر؟","م:دوقرة للقديم وهو أقدم موقع في آسيا، عيون الحمام للوسيط وهي أقدم مقبرة منظمة في العالم، عين غزال للحديث وفيها أقدم تماثيل جبسية، وادي فينان للنحاسي لأنه أشهر مناجم النحاس، وباب الذراع للبرونزي.","ط:وما الفرق بين القديم والحديث؟","م:في القديم كان الإنسان متنقلًا يصطاد ويجمع ويسكن الكهوف، وفي الحديث استقر في قرى، وزرع، ودجّن الحيوانات، وصنع الفخار. الشبه أن الأداة الأساسية في العصرين هي الحجر.","ط:وما معنى دويلات المدن؟","م:في العصر البرونزي صارت كل مدينة دولة لها حاكم وجيش ونظام، فانتشر الأمن، فازدهرت الزراعة والتجارة."],
tips:["ترتيب العصور: «*قد وصل حسنٌ ناجحًا ببراعة*» = قديم – وسيط – حديث – نحاسي – برونزي.","موقع ذهبي لكل عصر: *دوقرة* ← *عيون الحمام* ← *عين غزال* ← *وادي فينان* ← *باب الذراع*.","عوامل الاستقرار ٤ كلمات: «*مناخ – ماء – تربة – موقع*».","تذكّر الأوائل: دوقرة *أقدم موقع في آسيا*، عيون الحمام *أقدم مقبرة منظمة في العالم*، عين غزال *أقدم تماثيل جبسية في العالم*."],
cards:[["ما معنى اسم الأردن عند العرب؟","الشدة والغلبة."],["ما الاسم الإغريقي للأردن؟","يوردانيم."],["متى اختُرعت الكتابة؟","نحو 3500 ق.م، وبها تبدأ العصور التاريخية."],["لماذا قُسّمت العصور القديمة؟","تسهيلًا لدراستها ومعرفة النشاط البشري فيها."],["أقدم مواقع العصر الحجري القديم في آسيا؟","دوقرة في وادي الزرقاء (2.5 مليون سنة)."],["أقدم مقبرة منظمة في العالم؟","عيون الحمام في وادي زقلاب – إربد (16 ألف عام)."],["أين أقدم تماثيل جبسية في العالم؟","عين غزال في عمّان."],["أشهر مناجم النحاس في الأردن؟","وادي فينان قرب وادي عربة."],["مما يتكون البرونز؟","النحاس والقصدير."],["ما المقصود بدويلات المدن؟","نظام في العصر البرونزي تكون فيه كل مدينة دولة ذات نظام خاص وحكم منفرد وجيش يدافع عنها."],["عدد المواقع الأثرية المكتشفة والمسجلة؟","المكتشفة نحو 100 ألف، والمسجلة رسميًا نحو 15 ألف."],["العصر الذي يمثل مرحلة انتقالية؟","العصر الحجري الوسيط: من الصيد والجمع إلى إنتاج الغذاء."],["دلالة ظهور طبقة الصناع والحرفيين؟","معرفة الإنسان استخراج النحاس وصهره وطرقه في العصر الحجري النحاسي."],["مواقع العصر البرونزي؟","باب الذراع (الكرك)، جاوا (المفرق)، تل السعيدية (غور الأردن الشمالي)."]],

tl:[["2.5 مليون سنة","بداية العصر الحجري القديم (دوقرة)"],["20000 ق.م","العصر الحجري الوسيط"],["8500 ق.م","العصر الحجري الحديث"],["4500 ق.م","العصر الحجري النحاسي"],["3500 ق.م","اختراع الكتابة وبداية العصور التاريخية"],["1200 ق.م","بداية العصر الحديدي (نهاية البرونزي)"]],
mcq:[["الموقع الأردني الذي يعود إلى 2.5 مليون عام، ويعد أقدم مواقع العصر الحجري القديم في آسيا:",["بسطة","دوقرة","عيون الحمام","عين غزال"],1,"دوقرة في وادي الزرقاء."],["من المواقع التي تعود إلى العصر الحجري الحديث:",["عيون الحمام","وادي الحسا","عين غزال","دوقرة"],2,"عين غزال في عمّان، وفيها أقدم تماثيل جبسية."],["أقدم مقبرة منظمة في العالم:",["باب الذراع","عيون الحمام","تل السعيدية","طبقة فحل"],1,"عيون الحمام في وادي زقلاب – إربد، ويعود إلى العصر الحجري الوسيط."],["العصر الذي بدأ فيه الإنسان صناعة أدواته من النحاس إلى جانب الحجر:",["الحجري الحديث","الحجري الوسيط","الحجري النحاسي","البرونزي"],2,"ولذلك ظهرت فيه طبقة الصنّاع والحرفيين."],["البرونز خليط من:",["الحديد والنحاس","النحاس والقصدير","الذهب والفضة","الحديد والقصدير"],1,"نحاس + قصدير."],["يعد أول مراحل التمدّن:",["العصر الحجري الحديث","العصر البرونزي","العصر الحجري الوسيط","العصر الحديدي"],1,"نمت فيه المدن الصغيرة وأُحيطت بالأسوار."],["أشهر مناجم استخراج النحاس في الأردن:",["وادي فينان","وادي الحسا","وادي زقلاب","وادي الزرقاء"],0,"وادي فينان قرب وادي عربة."],["تبدأ العصور التاريخية مع:",["اكتشاف النار","اختراع الكتابة","اكتشاف الزراعة","صناعة الحديد"],1,"اختُرعت الكتابة نحو 3500 ق.م."],["موقع جاوا الأثري يقع في محافظة:",["الكرك","المفرق","إربد","معان"],1,"في البادية الشمالية الشرقية، ويعود إلى العصر البرونزي."],["العصر الذي يمثل مرحلة انتقالية من الصيد والجمع إلى إنتاج الغذاء:",["الحجري القديم","الحجري الوسيط","الحجري الحديث","النحاسي"],1,"العصر الحجري الوسيط."],["موقع بسطة الأثري يقع في محافظة:",["جرش","معان","الطفيلة","الزرقاء"],1,"ويعود إلى العصر الحجري الحديث."],["ظهرت الملكية الفردية للحقول والحيوانات في العصر:",["الحجري القديم","الحجري الحديث","البرونزي","الحجري الوسيط"],1,"بعد الاستقرار في القرى الزراعية."]],
ess:[["وضّح عوامل استقرار الإنسان في الأردن منذ العصور القديمة.","اعتدال المناخ|وفرة المياه|التربة الخصبة|الموقع المتوسط بين حضارات بلاد الشام والرافدين من جهة، وشبه الجزيرة العربية ومصر من جهة أخرى"],["فسّر: تقسيم التاريخ البشري إلى عصور.","تسهيلًا لدراسة العصور القديمة|ومعرفة النشاط البشري فيها"],["عدّد الإنجازات الحضارية في العصور الحجرية.","اكتشاف النار وصهر المعادن وطرقها|اكتشاف الزراعة وإنتاج الطعام|تدجين الحيوانات واختراع العجلة|اختراع الكتابة|تنظيم المجتمع وظهور السلطتين الدينية والسياسية|تطور العمارة وظهور الفنون كصناعة التماثيل"],["فسّر: أهمية اكتشاف الإنسان القديم معدن النحاس.","صنع منه أدوات أفضل إلى جانب الحجر|ظهرت طبقة الصناع والحرفيين إلى جانب المزارعين والرعاة"],["بيّن أوجه الشبه والاختلاف بين العصر الحجري القديم والعصر الحجري الحديث.","الشبه: استخدام الحجر في صناعة الأدوات|الاختلاف: القديم تنقّل وصيد وجمع وسكن الكهوف|الحديث: استقرار في قرى زراعية وتدجين الحيوانات وصناعة الفخار والملكية الفردية"],["أعطِ مثالًا على موقع أثري لكل عصر حجري مع محافظته.","القديم: دوقرة (الزرقاء)|الوسيط: عيون الحمام (إربد)|الحديث: عين غزال (عمّان)|النحاسي: وادي فينان (قرب وادي عربة)|البرونزي: باب الذراع (الكرك)"],["ناقش: يعد العصر الحجري الحديث ثورة في حياة البشرية.","لأن الإنسان انتقل فيه من التنقل والجمع إلى الاستقرار والزراعة وتدجين الحيوانات|فظهرت القرى والملكية الفردية والفخار، وهذا تغيير جذري يشبه أثر الثورة الصناعية والتكنولوجية"]]
});

L.push({id:"u1l2",u:1,n:2,t:"الأردن في العصر الحديدي",
idea:"شهد الأردن في العصر الحديدي ظهور الدولة المنظمة (الممالك) بدلًا من دويلات المدن.",
sum:[
{h:"العصر الحديدي (1200 – 332 ق.م)",p:["سُمّي بهذا الاسم لأن الإنسان بدأ *صناعة أدواته وأسلحته من الحديد*."]},
{h:"سمات العصر الحديدي",p:["*تحوّل نظام الحكم* من دويلات المدن إلى *النظام الملكي*.","*هجرة قبائل عربية* من شبه الجزيرة العربية إلى بلاد الشام والرافدين والأردن، واندماجها مع السكان المحليين.","*أسباب الهجرة*: القحط والجفاف، و*انهيار سد مأرب*، والنزاعات فيما بينها.","تطور الأدوات الزراعية؛ فصُنعت *المحاريث والمناجل وأدوات الطحن*.","*سكّ العملات* المعدنية من الذهب والفضة والبرونز."]},
{h:"الممالك الثلاث (من الجنوب إلى الشمال)",p:["*الآدومية* في الجنوب ← *المؤابية* في الوسط ← *العمونية* في الشمال.","احفظها: «*آدَم مَعَ عَمّو*»."]},
{h:"① المملكة الآدومية",p:["قبائل عربية من شبه الجزيرة استقرت في *جنوب الأردن*.","*التسمية*: آدوم تعني *اللون الأحمر* الذي تتميز به الصخور الرملية في منطقتهم.","*الامتداد*: من *العقبة* جنوبًا حتى *وادي الحسا* شمالًا.","*العاصمة*: *بصيرا* (الطفيلة) لموقعها الاستراتيجي على الطرق التجارية.","*الحكم*: قبلي؛ شيوخ القبائل يختارون *شيخ الشيوخ أو الملك* ومهمته القيادة الإدارية والعسكرية. من ملوكهم: *قوص ملك وأيارامو*.","*الآلهة*: بعل، إيل، قوس.","*الاقتصاد*: الزراعة والرعي، تقنيات ري متطورة (قنوات، سدود، آبار لجمع الأمطار)، ونمط عمارة *ورثه الأنباط*، والتجارة كأدلاء للقوافل إلى الخليج العربي.","توسعوا غربًا حتى جنوب فلسطين، وفي *القرن السادس ق.م اندمجوا مع الأنباط*."]},
{h:"② المملكة المؤابية",p:["*الامتداد*: من *وادي الحسا* جنوبًا إلى *وادي الموجب* شمالًا، ثم توسعت حتى *وادي الوالة*.","*العاصمة*: مؤاب (الكرك) ثم *ذيبان* (مأدبا) لموقعها *الحصين بين الموجب والوالة* ووفرة الأراضي الزراعية والمراعي.","*الحكم*: ملكي، وأشهر ملوكهم *ميشع*: انتصر على العبرانيين، ووسع مملكته، وشق الطرق، وبنى المدن كمأدبا وخربة الدليلة.","*الإله*: *كموش* (إله الحرب).","*مسلة ميشع (حجر مؤاب)*: حجر *بازلت أسود* نُقشت عليه انتصارات ميشع وأعماله، *أقدم نقش أثري مؤرخ في الأردن* (850 ق.م)، الأصل في *متحف اللوفر بباريس* ونسخ منها في المتاحف الأردنية.","*الاقتصاد*: القمح والشعير والذرة والأشجار المثمرة، رعي الماعز والضأن، حفر الآبار، والتجارة؛ وأقاموا *التحصينات على الطرق التجارية لحمايتها*.","*النهاية*: القرن 8 ق.م تحت حماية *الآشوريين*، ثم *البابليين (الكلدانيين)* الذين سقطوا بيد *الفرس 539 ق.م* فاختفت المملكة."]},
{h:"③ المملكة العمونية",p:["*الامتداد*: من *وادي الموجب* جنوبًا حتى *نهر الزرقاء* شمالًا.","*العاصمة*: *ربة عمون* (عمّان حاليًا).","*الحكم*: ملكي، وأشهر ملوكهم *ناحاش الأول*. *الآلهة*: عشتار، بعل، قوس.","*أوج الازدهار*: القرنان *السابع والسادس ق.م*: ازدياد المواقع في عمّان ومأدبا وحسبان، الاهتمام بالزراعة (الحبوب والأشجار المثمرة)، معاصر العنب، الآبار، *أبراج حراسة المزروعات مثل رجم الملفوف*.","صنعوا الأواني والزينة والأسلحة، وعملوا أدلاء وحراسًا للقوافل.","تبعت للآشوريين ثم البابليين، ودخلت تحت *الفرس 539 ق.م* حتى سيطر عليها *الإسكندر المقدوني 332 ق.م*.","*قارورة تل سيران*: تل داخل *حرم الجامعة الأردنية*، قارورة برونزية طولها *10 سم*، عليها *92 حرفًا في 8 أسطر* تذكر *أسماء ثلاثة ملوك عمونيين*، وفي داخلها *بذور قمح وشعير* ← دلالة على اهتمامهم بالزراعة.","*رجم الملفوف*: برج حراسة عموني في عمّان بين الدوار الثالث والرابع."]}
],

]},
dlg:["م:بعد العصر البرونزي جاء العصر الحديدي من 1200 إلى 332 ق.م. لماذا سُمّي بذلك؟","ط:لأن الإنسان صنع أدواته وأسلحته من الحديد.","م:أحسنت. وما أهم تغيير سياسي فيه؟","ط:انتهت دويلات المدن؟","م:نعم، وتحوّل الحكم إلى النظام الملكي، فظهرت ثلاث ممالك عربية. احفظها من الجنوب للشمال: «آدم مع عمّو» = آدوم، مؤاب، عمون.","ط:ومن أين جاءت هذه القبائل؟","م:من شبه الجزيرة العربية بسبب القحط والجفاف وانهيار سد مأرب والنزاعات بينها.","ط:لماذا سمّي الآدوميون بهذا الاسم؟","م:آدوم تعني الأحمر، وهو لون الصخور الرملية في جنوب الأردن. وعاصمتهم بصيرا في الطفيلة لأنها على الطرق التجارية.","ط:وما أشهر شيء عند المؤابيين؟","م:الملك ميشع ومسلّته! حجر بازلت أسود عليه انتصاراته، وهو أقدم نقش أثري مؤرخ في الأردن سنة 850 ق.م، وأصله في متحف اللوفر بباريس.","ط:ولماذا كانت ذيبان عاصمتهم؟","م:لأنها حصينة بين واديي الموجب والوالة، وفيها أراضٍ زراعية ومراعٍ وفيرة.","ط:والعمونيون عاصمتهم عمّان؟","م:نعم، ربة عمون. وبلغوا أوج ازدهارهم في القرنين السابع والسادس ق.م، ومن آثارهم رجم الملفوف وقارورة تل سيران التي وُجد فيها قمح وشعير؛ دليل على اهتمامهم بالزراعة."],
tips:["الممالك من الجنوب للشمال: «*آدَم مَعَ عَمّو*» = آدوم – مؤاب – عمون.","الحدود بالأودية من الجنوب: *العقبة | الحسا | الموجب | الزرقاء*؛ آدوم بين العقبة والحسا، مؤاب بين الحسا والموجب، عمون بين الموجب والزرقاء.","العواصم: *ب ذ ر* = بصيرا – ذيبان – ربة عمون.","الملوك: آدوم (قوص ملك، أيارامو)، مؤاب (*ميشع*)، عمون (*ناحاش الأول*).","آلهة مؤاب: *كموش* إله الحرب؛ لأن ميشع كان محاربًا."],
cards:[["لماذا سُمّي العصر الحديدي بهذا الاسم؟","لأن الإنسان بدأ يصنع أدواته وأسلحته من الحديد."],["ما الفترة الزمنية للعصر الحديدي؟","1200 – 332 ق.م."],["أسباب هجرة القبائل العربية من شبه الجزيرة؟","القحط والجفاف، وانهيار سد مأرب، والنزاعات فيما بينها."],["معنى كلمة آدوم؟","اللون الأحمر الذي تتميز به الصخور الرملية في جنوب الأردن."],["عاصمة الآدوميين ولماذا؟","بصيرا (الطفيلة)؛ لموقعها الاستراتيجي على الطرق التجارية."],["امتداد المملكة الآدومية؟","من العقبة جنوبًا حتى وادي الحسا شمالًا."],["عاصمة المؤابيين؟","مؤاب (الكرك) ثم ذيبان (مأدبا)."],["ما مسلة ميشع؟","حجر بازلت أسود نُقشت عليه انتصارات الملك ميشع وأعماله، أقدم نقش مؤرخ في الأردن (850 ق.م)."],["أين النسخة الأصلية لمسلة ميشع؟","في متحف اللوفر في باريس."],["إله المؤابيين؟","كموش (إله الحرب)."],["عاصمة العمونيين وأشهر ملوكهم؟","ربة عمون (عمّان)، والملك ناحاش الأول."],["متى بلغت المملكة العمونية أوج ازدهارها؟","في القرنين السابع والسادس قبل الميلاد."],["ما قارورة تل سيران؟","قارورة برونزية (10 سم) وُجدت في الجامعة الأردنية، عليها 92 حرفًا في 8 أسطر تذكر 3 ملوك عمونيين، وفيها بذور قمح وشعير."],["ما رجم الملفوف؟","برج عموني لحراسة المزروعات في عمّان بين الدوار الثالث والرابع."],["مع من اندمج الآدوميون؟","مع العرب الأنباط في القرن السادس قبل الميلاد."]],
ce:[["القحط والجفاف وانهيار سد مأرب والنزاعات","هجرة القبائل العربية من شبه الجزيرة العربية إلى بلاد الشام والرافدين."],["موقع بصيرا الاستراتيجي على الطرق التجارية","اتخاذها عاصمة للآدوميين."],["قلة المياه السطحية في جنوب الأردن","حفر الآدوميين القنوات وإنشاء السدود والآبار لتجميع مياه الأمطار."],["موقع ذيبان الحصين بين الموجب والوالة ووفرة الأراضي الزراعية والمراعي","اختيارها عاصمة للمملكة المؤابية."],["رغبة المؤابيين في حماية الطرق التجارية وحراستها","إقامة التحصينات على طول الطرق التجارية."],["وجود بذور قمح وشعير داخل قارورة تل سيران","دلالة على اهتمام العمونيين بالزراعة."],["سقوط البابليين على يد الفرس عام 539 ق.م","اختفاء المملكة المؤابية عن مسرح الأحداث السياسية."]],
tl:[["1200 ق.م","بداية العصر الحديدي"],["850 ق.م","مسلة ميشع (أقدم نقش مؤرخ في الأردن)"],["القرن 8 ق.م","مؤاب تحت حماية الآشوريين"],["القرن 6 ق.م","اندماج الآدوميين مع الأنباط"],["539 ق.م","سيطرة الفرس على المنطقة"],["332 ق.م","سيطرة الإسكندر المقدوني ونهاية العصر الحديدي"]],
mcq:[["عاصمة المملكة المؤابية:",["بصيرا","البترا","ربة عمون","ذيبان"],3,"ذيبان في مأدبا، بعد مؤاب (الكرك)."],["عاصمة المملكة الآدومية:",["بصيرا","ذيبان","ربة عمون","البترا"],0,"بصيرا في الطفيلة."],["أقدم نقش أثري مؤرخ عُثر عليه في الأردن:",["نقش أم الجمال","مسلة ميشع","قارورة تل سيران","نقش أريبوس"],1,"يعود إلى 850 ق.م."],["تعني كلمة (آدوم):",["الشدة والغلبة","اللون الأحمر","النهر المتعرج","الأرض الخصبة"],1,"نسبة إلى لون الصخور الرملية."],["إله الحرب عند المؤابيين:",["بعل","كموش","عشتار","قوس"],1,"عبد المؤابيون كموش."],["أشهر ملوك العمونيين:",["ميشع","قوص ملك","ناحاش الأول","أيارامو"],2,"ناحاش الأول."],["تمتد المملكة العمونية بين:",["العقبة والحسا","الحسا والموجب","الموجب ونهر الزرقاء","الزرقاء واليرموك"],2,"من وادي الموجب جنوبًا إلى نهر الزرقاء شمالًا."],["توجد النسخة الأصلية لمسلة ميشع في:",["المتحف البريطاني","متحف اللوفر","متحف الأردن","متحف إسطنبول"],1,"في باريس."],["يقع تل سيران داخل:",["قلعة عمّان","حرم الجامعة الأردنية","مدينة مأدبا","وادي الموجب"],1,"وعُثر فيه على القارورة البرونزية."],["من أسباب هجرة القبائل العربية في العصر الحديدي:",["انهيار سد مأرب","الحروب الصليبية","اكتشاف الحديد","وفرة الأمطار"],0,"إضافة إلى القحط والجفاف والنزاعات."],["بلغت المملكة العمونية أوج ازدهارها في القرنين:",["الثامن والتاسع ق.م","السابع والسادس ق.م","الرابع والثالث ق.م","العاشر والتاسع ق.م"],1,"السابع والسادس قبل الميلاد."],["سيطر الإسكندر المقدوني على المنطقة عام:",["539 ق.م","582 ق.م","332 ق.م","64 ق.م"],2,"وبه ينتهي العصر الحديدي."]],
ess:[["بيّن سمات العصر الحديدي.","تحوّل نظام الحكم من دويلات المدن إلى النظام الملكي|هجرة القبائل العربية من شبه الجزيرة واندماجها بالسكان المحليين|تطور الأدوات الزراعية كالمحاريث والمناجل وأدوات الطحن|سكّ العملات من الذهب والفضة والبرونز"],["وضّح عوامل هجرة القبائل من شبه الجزيرة العربية إلى بلاد الرافدين والشام.","القحط والجفاف|انهيار سد مأرب|النزاعات فيما بينها"],["فسّر: اختيار ذيبان عاصمة للمملكة المؤابية.","لموقعها الحصين بين وادي الموجب ووادي الوالة|ووفرة الأراضي الزراعية والمراعي فيها"],["وضّح الأهمية التاريخية لمسلة ميشع.","أقدم نقش أثري مؤرخ عُثر عليه في الأردن (850 ق.م)|سجّلت انتصارات الملك ميشع وأعماله، فهي مصدر لمعرفة تاريخ مؤاب"],["فسّر: وصلت المملكة العمونية في القرنين السابع والسادس ق.م أوج ازدهارها.","ازدياد المواقع العمونية في عمّان ومأدبا وحسبان|الاهتمام بالزراعة كالحبوب والأشجار المثمرة|انتشار معاصر العنب وحفر الآبار|بناء أبراج حراسة المزروعات مثل رجم الملفوف|الصناعة والتجارة"],["قارن بين الممالك الثلاث من حيث الامتداد والعاصمة.","الآدومية: من العقبة إلى وادي الحسا، العاصمة بصيرا|المؤابية: من الحسا إلى الموجب ثم الوالة، العاصمة ذيبان|العمونية: من الموجب إلى نهر الزرقاء، العاصمة ربة عمون"],["كيف تغلّب الآدوميون على شحّ المياه السطحية؟","بتقنيات ري متطورة: حفر القنوات|إنشاء السدود|حفر الآبار لتجميع مياه الأمطار واستخدامها في الزراعة"]]

L.push({id:"u1l3",u:1,n:3,t:"مملكة الأنباط",
idea:"التعرف إلى تاريخ الأردن في عهد مملكة الأنباط، ومظاهر الحضارة فيها، وأسباب ضعفها.",
sum:[
{h:"الموقع والنشأة",p:["الأنباط *قبيلة عربية* هاجرت من شبه الجزيرة واستقرت *جنوب الأردن في القرن السادس ق.م* تقريبًا.","استقروا في مناطق *الآدوميين* (البترا، بصيرا، خربة الذريح) ← دلالة على *الارتباط الحضاري واللغوي* بينهم.","*الامتداد*: من *مدائن صالح* جنوبًا حتى *دمشق* شمالًا، ومن *وادي السرحان* شرقًا حتى *غزة* غربًا."]},
{h:"البترا العاصمة (المدينة الوردية)",p:["أسباب اختيارها: *موقعها على الطرق التجارية*، و*موقعها الحصين بين الجبال*، و*قربها من ينابيع المياه*.","بقيت مجهولة للغرب حتى زارها الرحالة السويسري *بيركهارت 1812م*.","أُدرجت على *لائحة التراث العالمي 1985م*، واختيرت من *عجائب الدنيا السبع الجديدة 2007م*.","*سلطة إقليم البترا التنموي السياحي* تأسست *2009م*: شخصية اعتبارية ذات استقلال مالي وإداري، لتنمية الإقليم سياحيًا واقتصاديًا واجتماعيًا وثقافيًا."]},
{h:"① نظام الحكم",p:["*ملكي وراثي*.","*الحارث الأول*، و*عبادة الأول* الذي انتصر على العبرانيين.","*الحارث الثالث*: وسّع مملكته حتى *دمشق وسكّ نقوده فيها*.","*الحارث الرابع*: *أطول فترات الحكم وأكثرها ازدهارًا*.","*حقوق المرأة*: حق الوراثة والتملك والتصرف بأملاكها، ودور في السياسة؛ حكمت *شقيلات* والدة الملك رب إيل الثاني لأنه كان صغيرًا بعد وفاة والده مالك الثاني."]},
{h:"② العمارة",p:["نمطان: *النحت في الصخر من الأعلى إلى الأسفل*، و*الأحجار المشذّبة* (المعدّة للبناء).","معالم البترا: *السيق، الخزنة، المدرج، قصر البنت، الدير*.","مواقع نبطية أخرى: *البيضا* (شمال البترا)، *السيق البارد* (سُمّي كذلك لعدم دخول الشمس إليه لضيقه)، *خربة الذريح* (الطفيلة)، *أم الجمال* (المفرق).","*أم الجمال*: شرق المفرق، مركز تجاري على الطرق النبطية، تصدّر المواشي، فيها حصون وكنائس من *البازلت الأسود*، ونظام حصاد مائي وتصريف صحي من الأبرز عالميًا، وسقوف من ألواح البازلت تحملها العقود، أُدرجت على *التراث العالمي 2024م*."]},
{h:"③ اللغة والكتابة  ④ الديانة",p:["استخدموا *اللغة الآرامية*، وكتبوا *بالحروف النبطية ذات الأصل الآرامي*، و*اليونانية* لغة للتجارة الخارجية.","الآرامية لغة سامية جاءت مع الآراميين في القرن 11 ق.م، وتتكوّن من *22 حرفًا*.","*نقش أم الجمال الأول (نقش فهرو)*: اكتشفه الألماني *ليتمان*، أهميته *استخدام الخط النبطي المتأخر*.","الديانة مرتبطة بديانة العرب قبل الإسلام: *شيع القوم* (إله القوافل)، *الكتبا* (إله الكتابة)، *ذو الشرى*، *اللات*، *العزى*؛ وضعوها في المرتفعات وعلى جنبات الطرق وقدموا لها القرابين."]},
{h:"⑤ الزراعة وأنظمة الري",p:["الأردن فقير بالمياه السطحية، فأتقن الأنباط *هندسة الري والحصاد المائي*:","حفر *الخزانات في الصخر* لجمع الأمطار.","بناء *القنوات* وصنع *الأنابيب الفخارية* لجر المياه من العيون إلى المدينة.","بناء *السدود الاعتراضية* لتجنب السيول شتاءً والاستفادة من المياه صيفًا.","تقسيم الأراضي الجبلية إلى *مصاطب* لحماية التربة من الانجراف. زرعوا القمح والشعير والزيتون والعنب."]},
{h:"⑥ الصناعة",p:["استخراج *الملح* من البحر الميت وبيعه في فلسطين، و*النحاس* من وادي عربة وسيناء.","جمع *القار* من البحر الميت وتصديره إلى *مصر للتحنيط*.","الأدوات المعدنية (أزاميل، فؤوس، أسلحة)، والتماثيل، وأدوات الطحن.","*الفخار النبطي المميز* في صناعته ورقته وجمال زخارفه (أطباق، أباريق، جرار، أسرجة، أنابيب).","النسيج والجلود والحلي، والأخشاب والسفن والتوابيت."]},
{h:"⑦ التجارة",p:["موقع تجاري مهم يتوسط الطرق البرية والبحرية: قوافل اليمن والجزيرة إلى الشام، وقوافل الخليج إلى الشام ومصر.","*عوامل تطور التجارة*: الموقع المتوسط على الطرق التجارية، *السفن* عبر البحر الأحمر، *الأبراج والحاميات العسكرية* لأمن القوافل، *المحطات التجارية* على طول الطرق.","كانوا يرافقون القوافل ويزودونها بالجمال ويفرضون الضرائب ويتعهدون بحمايتها."]},
{h:"أسباب ضعف مملكة الأنباط ونهايتها",p:["*ضعف بعض ملوك الأنباط*.","*الاحتلال الروماني لبلاد الشام 64 ق.م* ومحاولاتهم السيطرة على الأنباط.","*سيطرة الرومان على الطرق التجارية* وحرمان الأنباط منها، خاصة طريق البحر الأحمر وموانئ المتوسط.","*نقل الرومان مركز التجارة إلى تدمر* لمنافسة الأنباط وحصارهم.","في *106م* احتل الإمبراطور *تراجان* البترا وضمها *للولاية العربية* التابعة لروما."]}
],

dlg:["م:من هم الأنباط يا بطل؟","ط:قبيلة عربية جاءت من شبه الجزيرة.","م:صحيح، واستقروا جنوب الأردن في القرن السادس ق.م، في نفس أماكن الآدوميين مثل البترا وبصيرا. ماذا يدل ذلك؟","ط:على علاقة بينهم؟","م:نعم، ارتباط حضاري ولغوي. والآن: لماذا اختاروا البترا عاصمة؟","ط:لأنها جميلة؟","م:هههه، الجمال لا يكفي في الامتحان! ثلاثة أسباب: على الطرق التجارية، حصينة بين الجبال، قريبة من ينابيع الماء.","ط:متى عرف العالم الغربي البترا؟","م:عندما زارها السويسري بيركهارت 1812م، ثم صارت تراثًا عالميًا 1985م، ومن عجائب الدنيا السبع الجديدة 2007م. احفظها: 1812 – 1985 – 2007.","ط:كيف حلّوا مشكلة قلة الماء؟","م:بالحصاد المائي: خزانات في الصخر، قنوات وأنابيب فخارية، سدود اعتراضية ضد السيول، ومصاطب تحمي التربة من الانجراف.","ط:ولماذا ضعفت مملكتهم؟","م:لأن الرومان احتلوا الشام 64 ق.م، وسيطروا على طرق التجارة، ونقلوا التجارة إلى تدمر، مع ضعف بعض الملوك. وأخيرًا احتل تراجان البترا عام 106م.","ط:ما قصة المرأة النبطية؟","م:كان لها حق الوراثة والتملك، والملكة شقيلات حكمت نيابة عن ابنها رب إيل الثاني لأنه كان صغيرًا."],
tips:["أسباب اختيار البترا: «*طريق – حصن – ينبوع*».","تواريخ البترا: *1812* بيركهارت ← *1985* تراث عالمي ← *2007* عجائب الدنيا ← *2009* سلطة الإقليم.","عوامل تطور التجارة ٤: «*موقع – سفن – أبراج – محطات*».","أسباب الضعف ٤: «*ملوك ضعفاء – روما – طرق – تدمر*» والنهاية *تراجان 106م*.","الحوارث: الثالث *وسّع ووصل دمشق*، الرابع *الأطول والأزهى*."],

L.push({id:"u1l4",u:1,n:4,t:"الحضارتان اليونانية والرومانية-البيزنطية",
idea:"التعرف إلى تاريخ الأردن في الحقبتين اليونانية والرومانية-البيزنطية، وأهم المظاهر الحضارية فيهما.",
sum:[
{h:"أولًا: اليونان في الأردن",p:["خضع الأردن لليونان بعد احتلال *الإسكندر المقدوني* لمصر وبلاد الشام عام *332 ق.م*.","بعد وفاته قُسّمت الإمبراطورية بين قادته: *أنتيغونوس* (آسيا الصغرى)، *بطليموس* (مصر وجزء من الشام = *البطالمة*)، *سلوقس* (بقية الشام والعراق وفارس = *السلوقيون* وعاصمتهم *أنطاكية*).","استمرت الحروب بين البطالمة والسلوقيين طمعًا في التوسع.","*الأنباط واليونان*: بقيت دولة الأنباط مستقلة، وفشلت حملتان يونانيتان عليها، واستغل *الحارث الثالث* الصراع ووسّع مملكته حتى دمشق."]},
{h:"مظاهر الحضارة اليونانية",p:["*العمارة*: مدن على الطراز اليوناني: *بيلا (طبقة فحل)، جدارا (أم قيس)، جراسا (جرش)، حسبان*.","بسبب الحروب والكوارث *لم يبقَ إلا قصر عراق الأمير (قصر العبد)* في وادي السير غرب عمّان، بُني من حجارة ضخمة نُحتت عليها أشكال *أسود* وحيوانات.","عناصر معمارية: *العقود والأقواس والقناطر والتاج الكورنثي* (رأس العمود على شكل زخارف نباتية، نسبة إلى مدينة كورنث).","*2016م*: اكتشاف أول تمثال شبه كامل لـ *أفروديت* في جرش.","*اللغة*: اليونانية رسمية، والآرامية لغة التخاطب.","*النقود*: اليونانية رسمية، و*تأثرت بها النقود النبطية* (نقود الحارث الثالث تأثرت بالسلوقية).","*الحضارة الهلنستية*: تمازج الحضارة اليونانية وتفاعلها مع حضارات الشرق القديمة، خاصة بلاد الشام."]},
{h:"ثانيًا: الرومان (64 ق.م – 395م)",p:["احتل القائد *بومبي* بلاد الشام *64 ق.م* *باستثناء دولة الأنباط* التي احتفظت باستقلالها الذاتي مقابل *إتاوة سنوية*.","*أعمال بومبي*: أعاد تنظيم المدن الأردنية، وأعطاها *حكمًا ذاتيًا*، ووضع أسس *حلف الديكابوليس (المدن العشر)*.","*الديكابوليس*: حلف *تجاري عسكري* لاستمرار التجارة بين المدن وصدّ هجمات القبائل البدوية؛ تركزت من دمشق إلى عمّان للسيطرة على الطريق التجاري بين الشام والجزيرة العربية.","مدنه في الأردن: *فيلادلفيا (عمّان)، جراسا (جرش)، كابيتولياس (بيت راس)، أبيلا (قويلبة)، جدارا (أم قيس)، بيلا (طبقة فحل)*.","تغيّر اسم ربة عمون إلى *فيلادلفيا* تكريمًا لـ *بطليموس الثاني فيلادلفيوس*، وبعد الفتح الإسلامي استعادت اسم ربة عمون ثم عمّان."]},
{h:"مظاهر الحضارة الرومانية",p:["*الحكم*: مدن الديكابوليس تتمتع *باستقلال سياسي تحت الحماية الرومانية*؛ لكل مدينة حاكم ومجلس، وحرية عقد الاتفاقيات وسك النقود، وتؤدي الضرائب.","*اللغة والثقافة*: *اللاتينية* للكتابة والمعاملات الرسمية، والآرامية والنبطية للتواصل. *جدارا* مركز للثقافة والفن ومعهد للحقوق، ومن أدبائها: *ميلياغروس الجداري، يونوماوس، أريبوس*.","*العمارة*: جرش وعمّان وأم قيس: المدرجات والأسواق والشوارع المبلطة والمعابد والحمامات ← دليل *الثراء*.","*الزراعة*: العنب والزيتون، *الجدران الاستنادية* لحماية التربة، القنوات والآبار والأنفاق.","*نفق اليرموك*: *أطول نفق في العالم*، اكتُشف *2012م*، طوله نحو *140 كم*، من درعا مرورًا بالطرة ووادي الشلالة إلى *أم قيس*، لتزويد مدن الديكابوليس بالمياه.","*الصناعة*: لوفرة خامات الحديد والنحاس والقصدير والفضة والذهب: أدوات وأوانٍ وحلي وأسلحة وسك نقود.","*التجارة*: ازدهرت لاهتمام الرومان بها؛ ربطوا المدن بشبكة طرق ووفروا الحماية وربطوها بموانئ المتوسط.","*الطريق الملوكي (طريق تراجان)*: أمر به *تراجان* لربط مصر ببلاد الشام والجزيرة الفراتية مرورًا بالمدن الأردنية *لأسباب تجارية وعسكرية*."]},
{h:"ثالثًا: الحقبة البيزنطية (395 – 636م)",p:["قسّم *ثيودوسيوس* الإمبراطورية بين ولديه: *هونوريوس* (الغربية، عاصمتها روما، سقطت بيد القوط الغربيين *476م*) و*أركاديوس* (الشرقية/البيزنطية، عاصمتها *بيزنطة = القسطنطينية = إسطنبول*).","خضع الأردن للبيزنطيين، واعتنق سكانه *المسيحية*، وانتشرت *الكنائس والأديرة*.","*أم الرصاص*: استيطان واسع في العصرين البيزنطي والأموي، كنائس بأرضيات *فسيفسائية نادرة*، تراث عالمي *2004م*.","*الفسيفساء*: فن تركيب مكعبات صغيرة ملونة من الحجر أو المعدن أو الزجاج لتشكيل صور تزين الأرضيات والجدران والسقوف.","*مأدبا*: فيها *أقدم خريطة فسيفسائية أصلية للأراضي المقدسة (560م)* في كنيسة الروم الأرثوذكس.","*المغطس*: مكان *تعميد السيد المسيح* عليه السلام، في *وادي الخرار شمال البحر الميت*، تراث عالمي *2015م*، ومن مواقع الحج المسيحي.","*أهل الكهف*: في *الرقيم جنوب شرق عمّان*، يعود لعهد الإمبراطور *ديكيوس (ديقيانوس)* الذي اضطهد المسيحيين."]}
],

dlg:["م:من أول قائد أجنبي كبير سيطر على الأردن في هذا الدرس؟","ط:الإسكندر المقدوني؟","م:نعم عام 332 ق.م. وبعد موته تقاسم قادته الإمبراطورية. من أخذ مصر؟","ط:بطليموس، ومنه جاء اسم البطالمة.","م:والسلوقيون أخذوا بقية الشام والعراق وعاصمتهم أنطاكية. والأنباط؟","ط:بقوا مستقلين، والحارث الثالث استغل حربهم ووسّع حتى دمشق.","م:ممتاز! ما الأثر الوحيد الباقي من العصر اليوناني؟","ط:قصر عراق الأمير أو قصر العبد في وادي السير.","م:ثم جاء بومبي الروماني 64 ق.م وأسس حلف الديكابوليس. احفظ مدنه في الأردن بجملة: «في جرش كابتن أبيل جدّد بيته».","ط:فيلادلفيا، جراسا، كابيتولياس، أبيلا، جدارا، بيلا!","م:رائع. وما هدف الحلف؟","ط:تجاري عسكري: استمرار التجارة وصد هجمات القبائل البدوية.","م:وما أطول نفق في العالم؟","ط:نفق اليرموك، اكتُشف 2012، طوله 140 كم، ينتهي في أم قيس.","م:وفي الحقبة البيزنطية انتشرت الكنائس لأن السكان اعتنقوا المسيحية. وتذكّر ثلاثة مواقع تراث عالمي: أم الرصاص 2004، المغطس 2015، وخريطة مأدبا الفسيفسائية تعود إلى 560م."],
tips:["مدن الديكابوليس في الأردن: «*في جرش كابتن أبيل جدّد بيته*» = فيلادلفيا – جراسا – كابيتولياس – أبيلا – جدارا – بيلا.","الأسماء الحالية: فيلادلفيا=*عمّان*، جراسا=*جرش*، كابيتولياس=*بيت راس*، أبيلا=*قويلبة*، جدارا=*أم قيس*، بيلا=*طبقة فحل*.","التواريخ: *332 ق.م* يونان ← *64 ق.م* رومان ← *395م* بيزنطيون ← *636م* اليرموك.","اللغات: اليونان: *اليونانية* رسمية | الرومان: *اللاتينية* رسمية | الشعب دائمًا: *الآرامية*.","التراث العالمي: أم الرصاص *2004*، المغطس *2015*."],
cards:[["متى خضع الأردن لليونان؟","بعد احتلال الإسكندر المقدوني مصر وبلاد الشام عام 332 ق.م."],["عاصمة الدولة السلوقية؟","أنطاكية."],["الأثر الوحيد الباقي من الفترة اليونانية؟","قصر عراق الأمير (قصر العبد) في وادي السير."],["ما التاج الكورنثي؟","رأس العمود المبني على شكل زخارف نباتية، نسبة إلى مدينة كورنث اليونانية."],["ما الحضارة الهلنستية؟","تمازج الحضارة اليونانية وتفاعلها مع حضارات الشرق القديمة وبخاصة بلاد الشام."],["من احتل بلاد الشام للرومان ومتى؟","القائد بومبي عام 64 ق.م."],["ما حلف الديكابوليس؟","حلف المدن العشر، تجاري عسكري أسسه بومبي لاستمرار التجارة وصد هجمات القبائل البدوية."],["لماذا تغير اسم ربة عمون إلى فيلادلفيا؟","تكريمًا لبطليموس الثاني فيلادلفيوس."],["اللغة الرسمية في الحقبة الرومانية؟","اللاتينية."],["المدينة التي كانت مركزًا للثقافة ومعهدًا للحقوق؟","جدارا (أم قيس)."],["ما نفق اليرموك؟","أطول نفق في العالم، اكتُشف 2012م، طوله 140 كم، من درعا إلى أم قيس لتزويد الديكابوليس بالمياه."],["ما الطريق الملوكي؟","طريق تراجان؛ لربط مصر ببلاد الشام والجزيرة الفراتية لأسباب تجارية وعسكرية."],["كيف انقسمت الإمبراطورية الرومانية؟","قسمها ثيودوسيوس بين هونوريوس (الغربية/روما) وأركاديوس (الشرقية/بيزنطة)."],["أين أقدم خريطة فسيفسائية للأراضي المقدسة؟","في مأدبا (560م) داخل كنيسة الروم الأرثوذكس."],["ما موقع المغطس؟","مكان تعميد السيد المسيح في وادي الخرار شمال البحر الميت، تراث عالمي 2015م."],["متى أُدرجت أم الرصاص على التراث العالمي؟","عام 2004م."]],

L.push({id:"u2l1",u:2,n:1,t:"الأردن في صدر الإسلام",
idea:"الأردن متحف يحفظ ذاكرة الأمة من مقامات الأنبياء والمرسلين إلى أضرحة أوائل شهداء الإسلام خارج شبه الجزيرة.",
sum:[
{h:"مكانة الأردن الدينية",p:["بلاد الشام والأردن منها *مهد الرسالات السماوية*، وفيه *مقامات الأنبياء*.","مرّ الرسول ﷺ بالأردن *قبل البعثة* في رحلتين: الأولى مع *عمه أبي طالب* ومروره بـ *ميفعة (أم الرصاص جنوب عمّان)*، والثانية في *تجارة السيدة خديجة* رضي الله عنها."]},
{h:"التمهيد للدعوة الإسلامية",p:["بعد *صلح الحديبية (6هـ/627م)* بدأ الرسول ﷺ *باستمالة القبائل العربية في الأردن*: لنشر الدعوة، وتحويل ولاء القبائل للحكم الإسلامي، ولتكون عونًا للمسلمين ضد الروم، فأرسل الرسل.","*6هـ*: *أول سرية خارج شبه الجزيرة* إلى *حسمى* جنوبي الأردن؛ لمعاقبة بطون من *جذام* رفضوا دعوة الصحابي *دحية بن خليفة الكلبي*.","*8هـ*: سرية إلى *قضاعة* في *ذات أطلاح* (قرب الطفيلة).","*الغساسنة*: من *قبائل الأزد اليمنية*، استقروا في البلقاء ثم مدوا نفوذهم حتى دمشق، *تحالفوا مع الروم*، ولُقب حكامهم بالملوك، وعاصمتهم *الجابية* قرب دمشق؛ من ملوكهم *الحارث بن جبلة وجبلة بن الأيهم*. ومعظم مسيحيي الأردن من أصول غسانية."]},
{h:"معركة مؤتة (8هـ/629م)",p:["*السبب المباشر*: قتل *شرحبيل بن عمرو الغساني* (حاكم مؤاب) رسولَ النبي ﷺ *الحارث بن عمير الأزدي* المرسَل إلى ملك بصرى.","*القادة*: *زيد بن حارثة* ← *جعفر بن أبي طالب* ← *عبد الله بن رواحة*، استشهد الثلاثة، فاتفق المسلمون على *خالد بن الوليد*.","*الأطراف*: المسلمون × الروم وحلفاؤهم من القبائل العربية، في *مؤتة (الكرك)*.","*خطة خالد*: كلّف جنودًا *بإثارة الغبار طوال الليل* ليوهم الروم بوصول الإمدادات، و*بدّل مواقع الجيش* (الميمنة ميسرة، والميسرة ميمنة، والقلب مؤخرة، والمؤخرة مقدمة)، ثم *انسحب انسحابًا منظمًا* إلى الصحراء فظن الروم أنه يستدرجهم فلم يطاردوه.","*أهميتها*: *أول مواجهة عسكرية بين المسلمين والروم*، أظهرت الروح المعنوية العالية، و*حنكة خالد بن الوليد* وشجاعته.","*جامعة مؤتة* (1981م) على أرض المعركة في الكرك، جناحان عسكري ومدني؛ للربط بين الماضي والحاضر."]},
{h:"ذات السلاسل وعام الوفود",p:["*ذات السلاسل (8هـ/629م)*: تحالف *قضاعة وبلي* لغزو المدينة، فأرسل الرسول ﷺ *عمرو بن العاص* إلى ماء السلسل في أرض جذام *قرب معان*، فطلب المدد فأمده بقوة يقودها *أبو عبيدة بن الجراح*، فانتصر المسلمون.","*عام الوفود (9هـ/630م)*: سُمّي لكثرة الوفود القادمة إلى المدينة مسلمة أو مصالحة.","صالح أهل *أذرح والجرباء* (قرب معان) مقابل *الجزية*، وصالح *يوحنا بن رؤبة* حاكم *أيلة (العقبة)*.","أسلم *فروة بن عمرو الجذامي* حاكم الروم على معان فقتله الروم، فهو *من أوائل شهداء الإسلام خارج شبه الجزيرة*."]},
{h:"الفتح الإسلامي للأردن",p:["أرسل *أبو بكر الصديق* جيش *أسامة بن زيد (11هـ/632م)* إلى أرض مؤاب: *حملة استطلاعية* لجمع المعلومات.","وضع الروم حامية في *زيزياء (الجيزة)* فأرسل سرية بقيادة *خالد بن سعيد*.","بعد حروب الردة جهّز *أربعة جيوش* دخلت الشام عبر الأردن (*بوابة الفتح*):","*عمرو بن العاص ← فلسطين* | *يزيد بن أبي سفيان ← دمشق* | *شرحبيل بن حسنة ← الأردن* | *أبو عبيدة ← حمص*.","*مواقف القبائل*: ① مع المسلمين (من أسلم أو له علاقات ودية) ② *الحياد = القبائل المسالمة* (كرهت قتال الروم بسبب الدين، وقتال المسلمين بسبب القربى) ③ مع الروم (مصالح مشتركة أو خوفًا من بطشهم).","جيش عمرو *أول جيش دخل الأردن*، وهزم الروم في *وادي عربة*."]},
{h:"طبقة فحل واليرموك",p:["*طبقة فحل (13هـ/634م)*: بعد أجنادين (قرب الرملة) استنفر *هرقل* الروم، فواجههم *شرحبيل بن حسنة* وحاصرهم *أربعة أشهر* حتى طلبوا الاستسلام وقبلوا *دفع الجزية*.","*اليرموك (15هـ/636م)*: على ضفاف نهر اليرموك شمال الأردن، قائد الروم *ماهان*، اجتمعت الجيوش الأربعة، *خالد بن الوليد القائد العام*؛ ربع الجيش خيالة، والباقي كتائب مشاة على أربعة ألوية (أبو عبيدة، شرحبيل، يزيد، عمرو)، واستخدم *سرية الخيالة المتحركة*، فهُزم الروم وطوردوا حتى دمشق.","*لماذا اليرموك معركة فاصلة؟* ① إنهاء الاحتلال الروماني-البيزنطي للشام الذي دام *سبعة قرون* ② فتح مدن الشام جميعها وانتشار الإسلام ③ *تحوّل ولاء القبائل العربية* للحكم الإسلامي.","*جامعة اليرموك* (1976م) في إربد؛ دلالة رمزية وربطًا للماضي بالحاضر."]},
{h:"الأجناد ومدينة أيلة",p:["قسّم *عمر بن الخطاب (18هـ/639م)* الشام إلى *أربعة أجناد* (الجند = الولاية أو المحافظة): *دمشق* (مركزه دمشق: جنوب نهر الزرقاء)، *فلسطين* (مركزه *اللد*)، *الأردن* (مركزه *طبرية*: شمال نهر الزرقاء وشمال فلسطين)، *حمص*.","حثّت التعاليم الإسلامية على *الحفاظ على المنشآت وعدم هدم الكنائس* وحرية العبادة (*العهدة العمرية* لأهل إيلياء).","*أيلة (العقبة)*: *أول مدينة نالت اهتمام المسلمين خارج شبه الجزيرة*، بوابة للأردن وفلسطين، اكتُشفت آثارها *1989م*: جدران سميكة محصنة، *شارعان رئيسان* يقسمانها أربعة أقسام، و*أربعة أبواب*."]},
{h:"مقامات الأنبياء وأضرحة الصحابة",p:["*مقامات*: *شعيب ويوشع بن نون* (البلقاء)، *هود* (جرش)، *هارون* (البترا/معان).","*الطفيلة*: فروة بن عمرو الجذامي (عفرا)، الحارث بن عمير الأزدي (بصيرا).","*الكرك (المزار)*: زيد بن حارثة، جعفر بن أبي طالب، عبد الله بن رواحة.","*البلقاء (الغور الأوسط)*: أبو عبيدة بن الجراح، ضرار بن الأزور.","*إربد*: معاذ بن جبل (الشونة الشمالية)، شرحبيل بن حسنة (وادي الريان)، عامر بن أبي وقاص (الغور الشمالي)."]}
],

dlg:["م:لماذا نقول إن الأردن «بوابة الفتح الإسلامي»؟","ط:لأن جيوش المسلمين دخلت الشام من خلاله.","م:صحيح. وقبل ذلك مهّد الرسول ﷺ بعد صلح الحديبية 6هـ. ماذا فعل؟","ط:استمال القبائل العربية وأرسل لها الرسل.","م:وأرسل أول سرية خارج الجزيرة إلى حسمى لمعاقبة بطون من جذام رفضوا دعوة دحية الكلبي. والآن مؤتة: ما سببها المباشر؟","ط:قتل شرحبيل الغساني للحارث بن عمير رسول النبي ﷺ.","م:والأمراء الثلاثة بالترتيب؟","ط:زيد بن حارثة، ثم جعفر بن أبي طالب، ثم عبد الله بن رواحة.","م:احفظها «زيد جعفر رواحة» مثل «ز ج ر»: «زَجَرَ». وماذا فعل خالد بعد استشهادهم؟","ط:أثار الغبار ليلًا، وبدّل مواقع الجيش، وانسحب انسحابًا منظمًا.","م:أحسنت! وفي عهد أبي بكر خرجت أربعة جيوش. من ذهب إلى الأردن؟","ط:شرحبيل بن حسنة.","م:وتذكّر: «شُرحبيل شَرَح الأردن، ويزيد يزور دمشق، وعمرو عَمَر فلسطين، وأبو عبيدة حمّص». وأيهما المعركة الفاصلة؟","ط:اليرموك 15هـ لأنها أنهت سبعة قرون من حكم الروم، وفُتحت بها مدن الشام، وتحوّل ولاء القبائل.","م:ممتاز. وما المقصود بالقبائل المسالمة؟","ط:القبائل التي وقفت على الحياد؛ كرهت قتال الروم بسبب الدين، وقتال المسلمين بسبب القربى."],
tips:["أمراء مؤتة بالترتيب: «*زَجَر*» = *ز*يد – *ج*عفر – ابن *ر*واحة.","الجيوش الأربعة: «*شُرحبيل شَرَح الأردن، يزيد يزور دمشق، عمرو عَمَر فلسطين، أبو عبيدة حمّص*».","تواريخ هجرية متتالية: *6* حسمى ← *8* مؤتة وذات السلاسل ← *9* الوفود ← *11* أسامة ← *13* فحل ← *15* اليرموك ← *18* الأجناد.","مواقف القبائل ٣: *مع – حياد – ضد*. والحياد = *القبائل المسالمة*.","طبقة فحل: *شرحبيل + حصار 4 أشهر + جزية*. اليرموك: *خالد + ماهان + 7 قرون*."],
cards:[["متى مرّ الرسول ﷺ بالأردن قبل البعثة؟","مرتين: مع عمه أبي طالب ومروره بميفعة، وفي تجارة السيدة خديجة."],["ما ميفعة؟","مدينة أم الرصاص جنوب عمّان."],["أول سرية خارج شبه الجزيرة؟","سرية حسمى جنوبي الأردن (6هـ) لمعاقبة بطون من جذام رفضوا دعوة دحية الكلبي."],["من هم الغساسنة؟","من قبائل الأزد اليمنية، استقروا في البلقاء، تحالفوا مع الروم، وعاصمتهم الجابية قرب دمشق."],["السبب المباشر لمعركة مؤتة؟","قتل شرحبيل بن عمرو الغساني الصحابيَّ الحارث بن عمير الأزدي رسول النبي ﷺ."],["أهمية معركة مؤتة؟","أول مواجهة عسكرية بين المسلمين والروم، وأظهرت الروح المعنوية وحنكة خالد بن الوليد."],["خطة خالد في مؤتة؟","إثارة الغبار ليلًا لإيهام الروم بوصول الإمدادات، وتبديل مواقع الجيش، والانسحاب المنظم إلى الصحراء."],["سبب معركة ذات السلاسل؟","تحالف قبيلتي قضاعة وبلي لغزو المدينة المنورة."],["لماذا سُمّي عام الوفود؟","لكثرة الوفود التي قدمت إلى المدينة مسلمة أو مصالحة للرسول ﷺ (9هـ)."],["لماذا يُعد فروة بن عمرو الجذامي من أوائل الشهداء؟","أسلم وهو حاكم الروم على معان فقتله الروم، فهو من أوائل شهداء الإسلام خارج شبه الجزيرة."],["ما القبائل المسالمة؟","القبائل التي وقفت على الحياد؛ كرهت قتال الروم بسبب الدين وقتال المسلمين بسبب القربى."],["نتيجة معركة طبقة فحل؟","حاصرها شرحبيل أربعة أشهر حتى طلب الروم الاستسلام وقبلوا دفع الجزية."],["القائد العام للمسلمين في اليرموك؟","خالد بن الوليد، وقائد الروم ماهان."],["لماذا تعد اليرموك معركة فاصلة؟","أنهت حكم الروم للشام (7 قرون)، وفُتحت مدن الشام وانتشر الإسلام، وتحوّل ولاء القبائل العربية."],["مركز جند الأردن؟","مدينة طبرية، ويضم شمال نهر الزرقاء وشمال فلسطين."],["أول مدينة نالت اهتمام المسلمين خارج الجزيرة؟","أيلة (العقبة)."],["أين ضريح أبي عبيدة؟","في الغور الأوسط – البلقاء."]],
ce:[["استمالة الرسول ﷺ القبائل العربية في الأردن","نشر الدعوة وتحويل ولاء القبائل للحكم الإسلامي ولتكون عونًا ضد الروم."],["رفض بطون من جذام دعوة دحية الكلبي","إرسال أول سرية خارج شبه الجزيرة إلى حسمى (6هـ)."],["قتل الحارث بن عمير الأزدي","وقوع معركة مؤتة (8هـ)."],["إثارة الغبار وتبديل مواقع الجيش والانسحاب المنظم","نجاة جيش المسلمين بأقل الخسائر في مؤتة."],["إسلام فروة بن عمرو الجذامي","قتل الروم له، فصار من أوائل شهداء الإسلام خارج الجزيرة."],["انتصار المسلمين في اليرموك","إنهاء الحكم البيزنطي للشام وفتح مدنه وتحوّل ولاء القبائل."],["تعاليم الإسلام بالحفاظ على المنشآت وحرية العبادة","عدم هدم الكنائس والأديرة بعد الفتح."]],

ess:[["وضّح كيف جرى التمهيد للدعوة الإسلامية في الأردن.","استمالة الرسول ﷺ القبائل العربية بعد صلح الحديبية وإرسال الرسل إليها|إرسال سرية حسمى (6هـ) لمعاقبة بطون جذام|إرسال سرية ذات أطلاح إلى قضاعة (8هـ)|إقامة علاقات ودية مع القبائل ومصالحتها في عام الوفود"],["فسّر: تعد معركة مؤتة من أهم المعارك بين المسلمين والروم.","أول مواجهة عسكرية بين المسلمين والروم|أظهرت الروح المعنوية العالية للمسلمين|أظهرت حنكة خالد بن الوليد وشجاعته في اتخاذ القرارات"],["بيّن موقف القبائل العربية في الأردن من الفتح الإسلامي.","الوقوف مع المسلمين: القبائل التي أسلمت أو لها علاقات ودية|الحياد: القبائل المسالمة التي كرهت قتال الروم للدين وقتال المسلمين للقربى|الوقوف مع الروم: لمصالح مشتركة أو خوفًا من بطشهم"],["فسّر: تعد معركة اليرموك من المعارك الفاصلة في تاريخ بلاد الشام.","إنهاء الاحتلال الروماني-البيزنطي للشام الذي دام سبعة قرون|فتح مدن الشام جميعها وانتشار الإسلام فيها|تحول ولاء القبائل العربية إلى الحكم الإسلامي"],["قارن بين معركتي طبقة فحل واليرموك من حيث السبب والنتيجة.","طبقة فحل: سببها استنفار هرقل الروم بعد أجنادين، ونتيجتها حصار 4 أشهر واستسلام الروم ودفع الجزية|اليرموك: سببها جمع ماهان جيوش الروم لقتال المسلمين، ونتيجتها هزيمة الروم ونهاية حكمهم للشام"],["املأ جدول معركة مؤتة.","التاريخ: 8هـ/629م|الأطراف: المسلمون × الروم وحلفاؤهم العرب|القادة: زيد، جعفر، ابن رواحة، ثم خالد|السبب المباشر: قتل الحارث بن عمير الأزدي|النتيجة: استشهاد الأمراء وانسحاب منظم بقيادة خالد"],["فسّر: يعد الأردن بوابة الفتوحات الإسلامية لبلاد الشام.","لأن الجيوش الإسلامية الأربعة دخلت الشام عبره، وشهدت أرضه معارك مؤتة وطبقة فحل واليرموك"]]

L.push({id:"u2l2",u:2,n:2,t:"الأردن في العصرين الأموي والعباسي",
idea:"التعرف إلى تاريخ الأردن في العصرين الأموي والعباسي، ومظاهر الحضارة فيهما.",
sum:[
{h:"الدولة الأموية (41–132هـ / 662–750م)",p:["أسسها *معاوية بن أبي سفيان*، ونقل العاصمة من *المدينة المنورة إلى دمشق*.","سُمّوا *الأمويين* نسبة إلى *أمية بن عبد شمس* من قريش، وشعارهم *اللون الأبيض*.","بلغت أوج اتساعها في عهد *الوليد بن عبد الملك*.","*أذرح*: قرية في معان، وقعت فيها *حادثة التحكيم* بين علي بن أبي طالب ومعاوية.","دخل الأردن تحت حكم الأمويين عام *41هـ/662م*."]},
{h:"أسباب اهتمام الأمويين بالأردن",p:["① *ولاء غالبية القبائل العربية* فيه للأمويين.","② *قربه من دمشق* عاصمة الأمويين.","③ وقوعه على *طريق الحج الشامي*.","④ موقعه على *الطرق التجارية* بين الجزيرة والشام ومصر والعراق.","⑤ *وفرة الأراضي الخصبة* والمحاصيل الزراعية."]},
{h:"المسيحيون العرب والتسامح",p:["كان المسيحيون العرب *أغلبية السكان*، وتحولوا تدريجيًا إلى الإسلام في *القرون الهجرية الأربعة الأولى*.","الدليل: كثرة الكنائس، مثل *كنائس إرحاب في المفرق (23 كنيسة معظمها أموي)* وكنيسة *أم الرصاص* ← دليل *تسامح الأمويين* مع أتباع الديانات الأخرى."]},
{h:"مظاهر اهتمام الأمويين بالأردن",p:["كانت قرى الأردن *مقرًا للخلفاء* (الوليد بن عبد الملك، يزيد بن عبد الملك): *الموقر، القسطل، زيزياء، الأزرق، عجلون، بيت راس، عمّان (جبل القلعة)* وفيها قصر الإمارة ودار سك النقود.","*الوليد بن يزيد* يقيم في *زيزياء (الجيزة)* في موسم الحج ليشرف على القوافل، يطعم الحجاج *ثلاثة أيام* ويعلف دوابهم.","الأردن *ملتقى لأعظم الشعراء*: *كثيّر عزة، الفرزدق، جرير*.","مشاركة القبائل الأردنية في الفتوحات (شمال إفريقيا والأندلس زمن الوليد)، أبرزها *جذام وغسان*.","*عمّان*: حافظت على مكانتها التجارية لتوسطها الطريق بين دمشق والجزيرة، وكانت مع *جرش مركزين لسك العملات*.","*أيلة*: ازدهرت، وفيها *ميناء أموي* هو *أول عمارة بحرية غارقة* يُكشف عنها في الأردن.","*المشاريع المائية*: لمياه الشرب وسقاية الحجاج والري: *البركة الأموية في جبل القلعة*، بركة زيزياء، بركة الموقر، بركة الضليل."]},
{h:"القصور الأموية",p:["بنى الأمويون قصورًا في بادية الشام، *تسعة منها في الأردن*.","*أغراضها*: ① الاستجمام وممارسة *الصيد* ② إرسال الأبناء لتعلم *العربية الفصيحة والفروسية* ③ *التواصل مع القبائل* الموالية ④ *الاستثمار الزراعي* ⑤ *محطات استراحة* للحجاج والمسافرين.","أشهرها: *قصير عمرة، المشتى، الأزرق، الحلابات، البرقع، الطوبة، الحرانة (الخرانة)، الموقر، القسطل*.","*قصير عمرة*: بُني في عهد *الوليد بن عبد الملك*، تراث عالمي *1985م*؛ لوحاته الجدارية (مشاهد صيد وحيوانات وطيور مع نقوش يونانية وعربية) *فريدة* في العمارة الإسلامية."]},
{h:"الدولة العباسية (132–656هـ / 750–1258م)",p:["انتصر *عبد الله بن علي العباسي* على *مروان بن محمد* في *معركة الزاب* (رافد لنهر دجلة) *132هـ/750م*.","نقلوا العاصمة من دمشق إلى *الكوفة ثم بغداد*، وسُمّوا نسبة إلى *العباس بن عبد المطلب* عم الرسول ﷺ، وشعارهم *اللون الأسود*."]},
{h:"الحميمة مركز الدعوة العباسية",p:["أقطع الخليفة الأموي *عبد الملك بن مروان* الحميمة (محافظة العقبة) لـ *علي بن عبد الله بن العباس* ليبقى *تحت ناظريه*.","اتخذ ابنه *محمد بن علي* الحميمة *مركزًا لدعوته السرية* لأنها: على *طريق الحج والقوافل*، و*موقعها متوسط* بين المشرق والمغرب الإسلامي، ولضمان *سرية لقاء مؤيديه* بعيدًا عن الأمويين.","انطلقت الدعوة منها إلى *الكوفة وخراسان*.","وُلد فيها من الخلفاء: *أبو العباس السفاح، أبو جعفر المنصور، المهدي*."]},
{h:"مظاهر الحكم العباسي في الأردن",p:["واجه العباسيون حركات تمرد، مثل *ثورة سعيد بن خالد الأموي (الفديني) 813م* من *حصن الفدين في المفرق* حتى حسبان لاسترداد الخلافة الأموية، وفشلت.","تعرضت المناطق التي قاومتهم *للتدمير*، كما تدل الاكتشافات في *الموقر*.","*شدّدوا قبضتهم*: فكان معظم الولاة على الشام *من بني العباس*.","تراجع الاهتمام بالأردن بسبب *نقل العاصمة إلى بغداد* وبُعده عنها."]}
],

dlg:["م:متى دخل الأردن تحت حكم الأمويين؟","ط:سنة 41هـ/662م.","م:ولماذا اهتم الأمويون بالأردن؟ عندي جملة تساعدك: «ولاءٌ قريبٌ على طريق الحج والتجارة والخِصب».","ط:يعني: ولاء القبائل، قربه من دمشق، طريق الحج، الطرق التجارية، والأرض الخصبة.","م:ممتاز! والقصور الأموية لماذا بُنيت في البادية؟","ط:للصيد...","م:وتعليم الأبناء الفصحى والفروسية، والتواصل مع القبائل، والزراعة، واستراحة الحجاج. احفظها: «صيد – فصاحة – قبائل – زراعة – استراحة».","ط:وما أشهر قصر؟","م:قصير عمرة، بناه الوليد بن عبد الملك، وصار تراثًا عالميًا 1985م بسبب جدارياته الفريدة.","ط:وما دليل تسامح الأمويين؟","م:بناء الكنائس في عهدهم، مثل 23 كنيسة في إرحاب بالمفرق معظمها أموي.","ط:والعباسيون، ما علاقتهم بالأردن؟","م:الحميمة في العقبة كانت مركز دعوتهم السرية؛ لأنها على طريق الحج، ومتوسطة بين المشرق والمغرب، وبعيدة عن أعين الأمويين. وولد فيها السفاح والمنصور والمهدي.","ط:ولماذا تراجع الاهتمام بالأردن في العصر العباسي؟","م:لأن العاصمة انتقلت بعيدًا إلى بغداد، وشدّد العباسيون قبضتهم بعد ثورة الفديني 813م."],
tips:["الألوان: *الأمويون = الأبيض*، *العباسيون = الأسود*. (ستحتاجها في علم الثورة العربية!)","أسباب اهتمام الأمويين: «*ولاءٌ قريبٌ على طريق الحج والتجارة والخِصب*».","أغراض القصور: «*صيد – فصاحة – قبائل – زراعة – استراحة*».","خلفاء ولدوا في الحميمة: «*سَمَم*» = *الس*فاح – *الم*نصور – *الم*هدي.","التواريخ: *41هـ* الأمويون في الأردن، *132هـ* الزاب، *813م* ثورة الفديني، *656هـ* سقوط بغداد."],
cards:[["مؤسس الدولة الأموية وعاصمتها؟","معاوية بن أبي سفيان، وعاصمتها دمشق."],["لماذا سُمّي الأمويون بهذا الاسم؟","نسبة إلى أمية بن عبد شمس من قبيلة قريش."],["شعار الأمويين؟","اللون الأبيض."],["ما أذرح؟","قرية في معان وقعت فيها حادثة التحكيم بين علي ومعاوية."],["متى دخل الأردن تحت حكم الأمويين؟","عام 41هـ/662م."],["دليل تسامح الأمويين في الأردن؟","بناء الكنائس في عهدهم مثل كنائس إرحاب (23 كنيسة) وكنيسة أم الرصاص."],["أين كان يقيم الوليد بن يزيد في موسم الحج؟","في زيزياء (الجيزة) ليشرف على قوافل الحجاج."],["المدينتان مركزا سك العملات الأموية؟","عمّان وجرش."],["أول عمارة بحرية غارقة كُشف عنها في الأردن؟","الميناء الأموي في أيلة (العقبة)."],["عدد القصور الأموية في الأردن؟","تسعة قصور."],["متى أدرج قصير عمرة على التراث العالمي؟","عام 1985م."],["أين وقعت معركة الزاب ومتى؟","على نهر الزاب (رافد لدجلة) عام 132هـ/750م."],["شعار العباسيين؟","اللون الأسود."],["لماذا أقطع عبد الملك الحميمة لعلي بن عبدالله بن العباس؟","ليبقى تحت ناظريه."],["من ثار على العباسيين من حصن الفدين؟","سعيد بن خالد الأموي (الفديني) عام 813م."],["الخلفاء العباسيون الذين ولدوا في الحميمة؟","السفاح والمنصور والمهدي."]],
ce:[["ولاء القبائل وقرب الأردن من دمشق ووقوعه على طريق الحج والتجارة","اهتمام الخلفاء الأمويين بالأردن."],["توسط عمّان الطريق بين دمشق وشبه الجزيرة","محافظة عمّان على مكانتها التجارية في العصر الأموي."],["الحاجة إلى مياه الشرب وسقاية الحجاج وري المزروعات","اهتمام الأمويين بالمشاريع المائية كالبرك."],["إقطاع عبد الملك بن مروان الحميمة لعلي بن عبد الله بن العباس","اتخاذ محمد بن علي الحميمة مركزًا للدعوة العباسية."],["وقوع الحميمة على طريق الحج وتوسط موقعها وسرية اللقاءات","اختيارها مركزًا للدعوة العباسية السرية."],["محاولة استرداد الخلافة الأموية","ثورة الفديني 813م وتشديد العباسيين قبضتهم."]],

L.push({id:"u2l3",u:2,n:3,t:"الأردن خلال حملات الفرنجة",
idea:"التعرف إلى تاريخ الأردن خلال حملات الفرنجة، وتحريره منهم.",
sum:[
{h:"حملات الفرنجة: التعريف والدوافع",p:["*حملات الفرنجة*: *تسع حملات* أوروبية شُنّت على الشام ومصر من *أواخر القرن 11م حتى الثلث الأخير من القرن 13م*.","أنشأوا *أربع إمارات*: *الرها، أنطاكية، طرابلس، مملكة بيت المقدس*.","استغلوا *حالة الضعف والفرقة والصراع* في العالم الإسلامي.","*الدوافع*: ① *سياسي*: رغبة الأمراء في تأسيس إمارات في الشرق ② *ديني*: حقد الفتوحات وحماية طريق الحج المسيحي ③ *اقتصادي واجتماعي*: الفقر والمجاعة والنظام الإقطاعي في أوروبا.","لم يراعوا حرمة الأماكن المقدسة، وارتكبوا المذابح دون تمييز (كما وصف *يعقوب الفيتري* و*ابن القلانسي*)."]},
{h:"لماذا اتجه الفرنجة إلى الأردن؟",p:["بعد احتلالهم *القدس 492هـ/1099م* اتجهت أنظارهم إلى الأردن لأنه:","① *الخط الدفاعي* عن مملكتهم في القدس من غارات القبائل العربية.","② *حلقة وصل* بين بلاد الشام ومصر والجزيرة العربية."]},
{h:"أعمال الفرنجة في الأردن",p:["*بلدوين الأول* ملك القدس: هاجم القبائل قرب البحر الميت (سبى ونهب) بسبب هجومها على مملكته.","بنى *قلعة مونتريال (الشوبك)* على موقع حصين واستراتيجي، وأقام فيها حامية.","في العام التالي احتل *أيلة (العقبة)* وأجبر أهلها على مغادرتها، وبنى فيها *حصنًا* ليكون مركزًا دفاعيًا ويسيطر على الطريق بين الشام ومصر.","*فولك أنجو* ملك القدس: بنى *قلعة الكرك* على أنقاض قلعة *مؤابية*؛ لتكون مركزًا للمنطقة الفرنجية شرقي المملكة، وللسيطرة على القبائل والطرق.","المناطق *شمال وادي الموجب* (عمّان، جرش، عجلون) بقيت *بعيدة عن سيطرة الفرنجة* وتابعة للخلافة العباسية."]},
{h:"تحرير الأردن من الفرنجة",p:["*نور الدين محمود زنكي*: حاصر الكرك *أربعة أيام* مرورًا بالبلقاء، ولم يفتحها *بسبب الإمدادات الفرنجية*.","*صلاح الدين الأيوبي*: خيّم في *الربة* قرب الكرك وحاصرها، ولم يفتحها *لمناعة أسوارها ووصول الإمدادات*، فعقد *هدنة* مع مملكة بيت المقدس.","*أرناط* أمير الكرك *نقض الهدنة* واستولى على *قافلة تجارية* من مصر إلى الشام، وقتل حراسها وأسر تجارها ← سبب *معركة حطين*.","*حطين 583هـ/1187م*: بين طبرية والناصرة، الفرنجة بقيادة *غي دي لوزينيان*، انتهت *بانتصار المسلمين واسترجاع القدس*.","بعدها توجّه صلاح الدين إلى *الكرك والشوبك* وحاصرهما *وحررهما*.","التقت في حطين جيوش *ثلاثة أجناد* (الشام ومصر والجزيرة) ← توحيد القوة سبب النصر."]}
],

dlg:["م:من هم الفرنجة؟","ط:أوروبيون هاجموا بلاد الشام.","م:شنّوا تسع حملات من أواخر القرن 11م حتى القرن 13م. وما دوافعهم؟","ط:دينية؟","م:وسياسية واقتصادية. احفظها «سدق»: سياسي، ديني، اقتصادي. وما الإمارات التي أسسوها؟","ط:لا أذكر.","م:قل «رأى طبيبًا» = الرها، أنطاكية، طرابلس، بيت المقدس.","ط:ولماذا اهتموا بالأردن؟","م:لأنه خط دفاعي عن مملكتهم في القدس، وحلقة وصل بين الشام ومصر والجزيرة. فبنى بلدوين الأول قلعة الشوبك وحصن أيلة، وبنى فولك أنجو قلعة الكرك.","ط:إذن بلدوين = الشوبك، وفولك = الكرك.","م:بالضبط! وهذا سؤال اختيار من متعدد مشهور. ولماذا لم يفتح نور الدين زنكي الكرك؟","ط:بسبب الإمدادات الفرنجية.","م:وما سبب حطين؟","ط:أرناط أمير الكرك نقض الهدنة وهاجم قافلة تجارية.","م:وحطين كانت 583هـ/1187م، وبعدها حرّر صلاح الدين القدس ثم الكرك والشوبك."],
tips:["دوافع الحملات: «*سدق*» = *س*ياسي – *د*يني – ا*ق*تصادي.","الإمارات الأربع: «*رأى طبيبًا*» = *ر*ها – *أ*نطاكية – *ط*رابلس – *ب*يت المقدس.","القلاع: *بلدوين الأول = الشوبك + حصن أيلة* | *فولك أنجو = الكرك*.","حطين: *583هـ = 1187م* (الأرقام فيها 8 و7 في التاريخين!).","شمال الموجب (*عمّان، جرش، عجلون*) لم يحتله الفرنجة."],

L.push({id:"u2l4",u:2,n:4,t:"الأردن في العصر الأيوبي",
idea:"التعرف إلى تاريخ الأردن في العصر الأيوبي، ومظاهر الحضارة فيه.",
sum:[
{h:"الدولة الأيوبية (569–648هـ / 1174–1250م)",p:["أسسها *صلاح الدين الأيوبي* في *مصر*، وامتدت لتشمل *الشام والحجاز واليمن* وأجزاء من ليبيا، وعاصمتها *القاهرة*.","سُمّيت نسبة إلى *آل أيوب* في الموصل شمال العراق.","صلاح الدين: وحّد شمال العراق والشام ومصر والحجاز واليمن في ظل الخلافة العباسية، وهزم الفرنجة في حطين واستعاد القدس."]},
{h:"أهمية الأردن عند الأيوبيين",p:["① *حلقة الوصل بين مصر والشام* لتوحيد الجهود العسكرية بين جيوشهما.","② *أرض للحشد العسكري والتعبئة* لمواجهة الفرنجة.","③ *ممر لطريق الحج* والطريق التجاري من الشام إلى مصر والحجاز.","④ *غني بالثروة الزراعية*."]},
{h:"مظاهر اهتمام الأيوبيين بالأردن",p:["① *قلعة عجلون*: على قمة *جبل عوف* عام *579هـ/1184م*، بناها *عز الدين أسامة* أحد قادة صلاح الدين؛ *لمراقبة تحركات الفرنجة وتأمين طرق التجارة* بين الشام ومصر.","② حافظ الأردن على أهميته الاستراتيجية: الاعتناء بالأمن، *حماية طريق الحج والتجارة*، حفر الآبار وإقامة خزانات الماء.","③ *الكرك*: أقطعها صلاح الدين لأخيه *الملك العادل*، فأعاد بناء أسوارها وبنى المساجد والدور والمرافق، وامتدت إمارته من *السلط إلى العقبة*.","④ *إمارة الكرك الأيوبية* في عهد *الملك الناصر داود*: ضمت كل المناطق الأردنية الحالية + *نابلس والقدس والخليل*؛ نظّمها، وأحاط نفسه *بالعلماء والفقهاء والأدباء*، وأسس جيشًا، واتخذ الوزراء، وجدّد قلعة الكرك وبنى فيها *القاعة الناصرية*.","⑤ *قلعة السلط* على قمة جبل *رأس الأمير*.","⑥ *المساجد*: *مسجد عجلون الكبير* (أمر ببنائه *الملك الصالح نجم الدين أيوب*، من أقدم مساجد الأردن)، ومساجد ريمون (جرش)، وإربد القديم، وطبقة فحل، وحبراص وبيت راس (إربد)."]},
{h:"المغول ونهاية الحكم الأيوبي",p:["*المغول*: قبائل بدوية من منغوليا، وحّدها *جنكيز خان*، توسعوا حتى دمّروا *بغداد 656هـ/1258م*، ثم وصلوا الشام، وهزمهم المماليك في *عين جالوت*.","*658هـ/1260م*: هاجم المغول دمشق ودخلوا الأردن، و*استعصت عليهم قلعة عجلون* فحاصروها حتى استسلمت بعد قتل حاميتها وهدم أجزاء منها."]},
{h:"الحياة العلمية في العصر الأيوبي",p:["بنى الأيوبيون *المدارس* وأثثوها وزودوها بالمدرسين والكتب، وخصصوا لها *الأوقاف*.","*الملك المعظم عيسى*: شجع العلماء، وأمر بتدريس *العلوم العقلية* (الفلسفة، الفلك، الطب، الرياضيات، الكيمياء) و*العلوم النقلية* (الحديث، الفقه، التفسير، الأدب، النحو، التاريخ) في الكرك.","نُسب علماء إلى *أيلة والشوبك والكرك وحسبان وعجلون وباعون*، و*القبة الباعونية* للتدريس داخل المسجد الأموي في دمشق تُنسب إلى *باعون* في عجلون.","*العلماء*: *عبد الحميد الخسروشاهي* (الكرك، طب وفلسفة وفقه، كتاب *مختصر المهذب*) | *موفق الدين يعقوب بن القف* (مسيحي من الكرك، أديب) | *الشطنوفي* (من البلقاء، درّس الحديث والتفسير في الجامع الطولوني بالقاهرة) | *سبط بن الجوزي* (*تاريخ مرآة الزمان*) | *جمال الدين بن واصل* (*مفرج الكروب في أخبار بني أيوب*) | *محي الدين أحمد قاضي عجلون* | *شهاب الدين الكركي*."]}
],

idea:"التعرف إلى تاريخ الأردن في العصر المملوكي، ومظاهر الحضارة فيه.",
sum:[
{h:"الدولة المملوكية (648–923هـ / 1250–1517م)",p:["تأسست بعد سقوط الدولة الأيوبية في *مصر*، وشملت *الشام والحجاز*، وحكمت *أكثر من قرنين ونصف*، وعاصمتها *القاهرة*.","*المماليك*: رجال وشباب *جُلبوا من آسيا الصغرى* ورُبّوا تربية *دينية وعسكرية صارمة*، اعتمد عليهم الأيوبيون في الجيش حتى سيطروا عليه ثم على الدولة.","قسمان: *المماليك البرجية* (سكنوا أبراج قلعة الجبل في القاهرة) و*المماليك البحرية* (أسكنهم الصالح نجم الدين أيوب في جزيرة الروضة بنهر النيل)."]},
{h:"أهمية الأردن ومعركة عين جالوت",p:["خضع الأردن للمماليك *بعد انتصارهم على المغول في عين جالوت*.","*الأهمية*: ① *الخط الدفاعي عن مصر* من الخطرين المغولي والفرنجي ② *مصدر مهم لتوفير أرزاق الجند*.","*عين جالوت (658هـ/1260م)*: قرب *جنين* في فلسطين، المغول بقيادة *كتبغا* × المسلمين بقيادة السلطان *سيف الدين قطز*، وانتهت بانتصار المسلمين وخروج المغول من الشام."]},
{h:"مظاهر اهتمام المماليك بالأردن",p:["① *التقسيم الإداري*: *نيابة الكرك* (من وادي الموجب شمالًا إلى العقبة جنوبًا) و*نيابة دمشق* (تضم من الأردن المنطقة من *نهر اليرموك* إلى *وادي الموجب*).","② *تحصين القلاع* لمواجهة المغول: ترميم *قلعتي عجلون والكرك*.","③ بنى السلطان *قانصوه الغوري قلعة العقبة* على أنقاض حصن فرنجي وبرج أيوبي.","④ استحدثوا وظيفة *أمير العربان*: أبرزهم *الأمير شطي بن عقبة* أمير بني عقبة؛ مهمته *حراسة طريق الحج* وتوفير الأمن مقابل تقديم قواته للسلطان.","⑤ *البريد البري* بين الشام ومصر مرورًا بالأردن، مراكزه مزودة بالخيول والطعام والعلف.","⑥ *الحمام الزاجل* لنقل الأخبار بسرعة، أقاموا له الأبراج وعينوا له أشخاصًا سُمّوا *البرّاجين*، واستخدموا *النار للإشارات* (*المناور*: مواضع رفع النار ليلًا والدخان نهارًا للإعلام بتحركات التتار).","⑦ *نمو البلدات*: العقبة، الشوبك، الكرك، عمّان، السلط، إربد، حسبان، عجلون.","⑧ *قصب السكر* في *الأغوار*، وبلغت صناعة السكر أوجها لجودته ونقائه (بنوعيه البني والأبيض)، وفي *الأغوار الجنوبية أقدم مصنع للسكر*، ووُجد *سكر الكرك والشوبك في أسواق فلورنسا* بإيطاليا.","⑨ *الثروات*: *الحديد* في عجلون، *النحاس* من وادي فينان، *الكبريت والقار (الحُمَر)* من البحر الميت.","⑩ *طريق الحج*: توفير الأمن وسبل الراحة، *الخانات* مثل *خان (قلعة) القطرانة*، ومراكز لجمع *المكوس* (ضرائب البضائع المستوردة) كمركزي *الحسا والعقبة*."]},
{h:"الحياة العلمية في العصر المملوكي",p:["ازدهرت الحركة العلمية في الشام ومصر، ونال علماء الأردن *مكانة مرموقة* وبرعوا في الدراسات القرآنية والحديث والفقه واللغة والشعر والطب.","*المدارس*: *الشافعية والصالحية في الكرك*، *مدرسة حسبان*، *المدرسة السيفية في السلط*.","*العلماء*: *عائشة بنت يوسف الباعونية* (الصلاح والعلم، كتاب *الملامح الشريفة والآثار المنيفة*) | *محمد بن يونس العجلوني* (محدّث عجلون وشاعرها) | *قاسم محمد الإربدي* (فقيه ومحدّث في *الأتابكية* بدمشق) | *تاج الدين الحسباني* (قاضٍ، درّس في *الأمينية* بدمشق وتولى *الحسبة*) | *محمد بن عبد الله الصلتي* (تولى قضاء القدس ونابلس والخليل وحمص، كتاب *مختصر ميدان الفرسان*) | *أبو الفرج بن القف الكركي* (طبيب مسيحي، كتابا *الشافي في الطب* و*العمدة في صناعة الجراح*)."]}
],

dlg:["م:من هم المماليك؟","ط:عبيد اشتُروا؟","م:رجال وشباب جُلبوا من آسيا الصغرى، ورُبّوا تربية دينية وعسكرية صارمة، ثم سيطروا على الجيش الأيوبي ثم على الدولة. وعاصمتهم القاهرة.","ط:ومتى خضع الأردن لهم؟","م:بعد انتصارهم على المغول في عين جالوت سنة 658هـ/1260م بقيادة سيف الدين قطز.","ط:ولماذا اهتموا بالأردن؟","م:لأنه الخط الدفاعي عن مصر من المغول والفرنجة، ومصدر لأرزاق الجند.","ط:وكيف قسّموه إداريًا؟","م:نيابتان: نيابة الكرك من الموجب إلى العقبة، ونيابة دمشق من اليرموك إلى الموجب.","ط:وما المقصود بالبرّاجين؟","م:الأشخاص الذين يخدمون الحمام الزاجل في الأبراج. وكانت هناك المناور: نار في الليل ودخان في النهار للتحذير من التتار.","ط:وما قصة السكر؟","م:زرعوا قصب السكر في الأغوار، وفي الأغوار الجنوبية أقدم مصنع للسكر، ووصل سكر الكرك والشوبك إلى أسواق فلورنسا في إيطاليا!","ط:وما أشهر عالمة؟","م:عائشة الباعونية، ولها كتاب الملامح الشريفة والآثار المنيفة. ومن قلعة العقبة؟ بناها قانصوه الغوري."],
tips:["أهمية الأردن عند المماليك: «*دفاع + أرزاق*».","النيابتان: *الكرك* (الموجب ← العقبة)، *دمشق* (اليرموك ← الموجب).","القلاع: *قانصوه الغوري = قلعة العقبة*، وترميم *عجلون والكرك*.","الاتصالات الثلاثة: «*بريد – حمام – نار*».","الثروات: *حديد عجلون، نحاس فينان، قار وكبريت البحر الميت، سكر الأغوار*.","عين جالوت: *قطز × كتبغا*، 658هـ/1260م."],

L.push({id:"u3l1",u:3,n:1,t:"الأوضاع السياسية والإدارية في العهد العثماني",
idea:"التعرف إلى تاريخ الأردن السياسي والإداري في العهد العثماني.",
sum:[
{h:"الدولة العثمانية (1299–1923م)",p:["أسسها *عثمان بن أرطغرل* في *آسيا الصغرى*، وسُمّيت العثمانية *نسبة إليه*.","بلغت أوج اتساعها في *القرنين 16 و17م*، وضمت أجزاء من *أوروبا وآسيا وإفريقيا*، وعاصمتها *إسطنبول (الأستانة)*.","خضع الأردن للعثمانيين بعد انتصارهم على المماليك في *معركة مرج دابق 1516م*."]},
{h:"أهمية الأردن عند العثمانيين",p:["① *الأهمية التي أولاها المماليك* للأردن وما شهده من تقدم عمراني واقتصادي وعلمي.","② كونه *طريقًا للحج الشامي*.","③ *الثروة الزراعية* التي تمتع بها."]},
{h:"قافلة الحج الشامي",p:["قافلة تضم حجاج *بلاد الشام وأواسط آسيا والأناضول والبلقان*، يشرف *السلطان بنفسه* على إعدادها وخروجها من إسطنبول، وتتجمع في *دمشق* ثم تعبر الأردن إلى *المدينة ومكة*.","*اهتمام الدولة*: تعمير *الخانات* وحفر *الآبار والبرك*، وتزويد الطريق *بالجنود والمياه والطعام*، وتوزيع رواتب وأعطيات على القبائل البدوية (*الصرّة*) لضمان سلامة الحجاج.","*آثار مرور القافلة*: ① *التبادل التجاري* بين الأردنيين والحجاج ② إقامة *الأسواق الموسمية* ③ استفادة القبائل من *الدلالة وتأجير الجمال* ④ *تحوّل منازل الحج إلى مدن*.","محطاتها في الأردن: الرمثا، المفرق، الزرقاء، عمّان، خان الزبيب، القطرانة، الحسا، عنيزة، معان، المدورة..."]},
{h:"الأوضاع الإدارية",p:["قسّم العثمانيون الشام إلى *ثلاث ولايات (إيالات)*: *الشام، طرابلس، حلب*، وكل ولاية مقسمة إلى ألوية، ولم تثبت طويلًا بسبب الفصل والضم.","اعتمدوا التقسيمات المملوكية للأردن: *لواء عجلون* (عجلون، السلط، الغور، جبل بني حميدة، الكرك، الشوبك) و*لواء حوران* (ناحية بني كنانة).","*أبقوا الزعماء المحليين* بسبب *انشغال الدولة بحروبها في أوروبا*، واعتمدوا عليهم مقابل *جباية الإقطاعات وحفظ الأمن وإعداد الجند*.","*التيمار*: نظام إقطاعي يقوم على إعطاء أرض للفرسان؛ لتخفيف دفع رواتب الجيش، ومصدر دخل للخزانة، وزيادة الفرسان، والاستيعاب التدريجي للمناطق المفتوحة."]},
{h:"تنامي دور الزعماء المحليين (ق17–18م)",p:["*الأسباب*: زيادة التنافس بينهم على الثروات، وطموح بعضهم *بالانفصال*، واستغلالهم *ضعف الإدارة العثمانية وانشغالها بحروب أوروبا*.","أبرزهم: *فخر الدين المعني الثاني* (لبنان)، *ظاهر العمر الزيداني* (شمال فلسطين وشمال الأردن)، *أحمد باشا الجزار* (عكا).","*النتيجة*: *فوضى وانعدام الأمن*، هجر كثير من القرى، واعتداء القبائل على القرى الزراعية *وقافلة الحج*."]},
{h:"الحكم المصري لبلاد الشام (1831–1840م)",p:["أرسل *محمد علي باشا* والي مصر ابنه *إبراهيم باشا*؛ طمعًا في *إنشاء دولة له ولأبنائه* مستغلًا ضعف الدولة العثمانية.","*أعماله*: ① تقسيم الشام إلى *مديريات ومتسلّميات* على نمط مصر، وأصبح الأردن تابعًا *لمتسلّمية عجلون* ② *نزع السلاح* لفرض الأمن ③ *ضرائب جديدة* ④ *التجنيد الإجباري*.","*رفض الأردنيون* ذلك، ورفعوا العرائض، وتمرّدوا في *البلقاء والكرك 1834م*؛ لجأ *قاسم الأحمد* (من زعماء نابلس) إلى الكرك فحاصرها إبراهيم باشا وضرب قلعتها، ثم هرب إلى *السلط* فدمّر قلعتها.","تمرّد *جبل عجلون 1839م*، فضعفت قواته، وانسحب إلى مصر *1840م* بعد *ضغط الدول الأوروبية*."]},
{h:"بعد الحكم المصري",p:["عادت الإدارة العثمانية: *قضاء عجلون* (تابع للواء حوران/درعا)، *قضاء البلقاء* (تابع للواء نابلس/ولاية بيروت)، و*قضاء معان* الذي تحوّل إلى *لواء الكرك 1894م*.","حاولت الدولة *توطين البدو* وتنمية الزراعة: إنشاء *المصرف الزراعي* لإقراض الفلاحين، طرائق زراعية جديدة.","*توطين الشركس والشيشان* القادمين من *القفقاس* بعد حرب مع روسيا، في: *الزرقاء، السخنة، جرش، عمّان، صويلح، وادي السير، ناعور*؛ وكان لهم دور في تطوير الحياة الاقتصادية والاجتماعية والثقافية.","*المشاركة في المجالس*: *المجلس العمومي لولاية سوريا*: عودة القسوس (الكرك)، يوسف السكر (السلط)، عبد النبي النسعة (معان)، محمود العوران (الطفيلة)، عبد القادر التل (عجلون)، عبد العزيز الكايد (جرش). *مجلس المبعوثان*: *توفيق المجالي*."]},
{h:"الاحتجاجات والحرب العالمية الأولى",p:["*أسباب الاحتجاجات*: إحصاء النفوس، التجنيد الإجباري، عدم الاهتمام بالأمن، التشدد في جمع الضرائب.","أبرزها: *تمرد بني حميدة 1889م*، *تمرد الشوبك 1905م*، *تمرد الكرك (الهيّة) 1910م*.","دخلت الدولة *الحرب العالمية الأولى 1914م* مع *ألمانيا والنمسا-هنغاريا* ضد *بريطانيا وفرنسا وروسيا وإيطاليا*.","عُيّن *جمال باشا* قائد الجيش الرابع واليًا على سوريا: ارتفاع الأسعار، التجنيد، نهب الغلال، الأحكام العرفية.","أعلن *الشريف الحسين بن علي* الثورة العربية الكبرى في *10 حزيران 1916م* فسارع معظم الأردنيين للانضمام إليها."]}
],

ess:[["وضّح آثار مرور قافلة الحج الشامي بالأراضي الأردنية.","التبادل التجاري بين الأردنيين والحجاج|إقامة الأسواق الموسمية في محطات القافلة|استفادة القبائل البدوية من تقديم خدمات الدلالة وتأجير الجمال والدواب|تحول منازل الحج إلى مدن فيما بعد"],["فسّر: تنامي دور الزعماء المحليين في القرنين 17 و18م.","زيادة التنافس بينهم للحصول على المزيد من الثروات|طموح العديد منهم بالانفصال عن الدولة العثمانية وتشكيل كيانات محلية|استغلالهم ضعف الإدارة العثمانية وانشغالها بحروبها في أوروبا"],["لخّص فترة الحكم المصري لبلاد الشام.","أرسل محمد علي ابنه إبراهيم باشا 1831م لإنشاء دولة|قسّم الشام إلى مديريات ومتسلميات|نزع السلاح وفرض ضرائب جديدة والتجنيد الإجباري|تمرد أهل البلقاء والكرك 1834م وعجلون 1839م|انسحب عام 1840م بضغط من الدول الأوروبية"],["فسّر: اندلاع الاحتجاجات والتمرد ضد الإدارة العثمانية في نهاية القرن 19 وبداية القرن 20.","إحصاء النفوس|فرض التجنيد الإجباري|عدم الاهتمام بالأمن|التشدد في جمع الضرائب"],["أعطِ أمثلة على مشاركة الأردنيين في المجلس العمومي ومجلس المبعوثان.","المجلس العمومي: عودة القسوس (الكرك)، يوسف السكر (السلط)، عبد النبي النسعة (معان)، محمود العوران (الطفيلة)، عبد القادر التل (عجلون)، عبد العزيز الكايد (جرش)|مجلس المبعوثان: توفيق المجالي"],["بيّن أهمية الأردن في العهد العثماني.","الأهمية التي أولاها المماليك للأردن وما شهده من تقدم عمراني واقتصادي وعلمي|كونه طريقًا للحج الشامي|الثروة الزراعية التي تمتع بها"],["وضّح أهداف نظام التيمار.","تخفيف الضغط عن الدولة في دفع رواتب الجيش|الحصول على مصدر دخل جديد للخزانة المركزية|زيادة عدد جنود الفرسان|الاستيعاب التدريجي للمناطق المفتوحة"]]
});
